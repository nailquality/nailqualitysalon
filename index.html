<script id="salon-final-customer-package-shop-js">
(function(){
'use strict';
function listedPackages(){
 const records=Array.isArray(portalCatalog?.packages)?portalCatalog.packages:[];
 const map=new Map();
 for(const p of records){
  if(!p||p.active===false)continue;
  const id=String(p.id||p.packageId||p.serviceId||'');if(!id||map.has(id))continue;
  map.set(id,{...p,id,kind:p.kind==='credit'?'credit':'instant',name:String(p.name||p.nameAr||'باقة'),nameEn:String(p.nameEn||p.name||p.nameAr||'Package'),creditsTotal:Math.max(1,Number(p.creditsTotal)||1),eligibleServiceIds:Array.isArray(p.eligibleServiceIds)?p.eligibleServiceIds:[],eligibleServiceNames:Array.isArray(p.eligibleServiceNames)?p.eligibleServiceNames:[]});
 }
 return [...map.values()];
}
function salonPhoneForPackages(){
 const s=String(portalCatalog?.settings?.whatsapp||db?.settings?.whatsapp||WA_NUMBER).replace(/\D/g,'');
 if(/^05\d{8}$/.test(s))return '966'+s.slice(1);
 if(/^5\d{8}$/.test(s))return '966'+s;
 if(/^9665\d{8}$/.test(s))return s;
 return typeof salonContactDigits==='function'?salonContactDigits():String(WA_NUMBER).replace(/\D/g,'');
}
function openSalonPackageWhatsApp(message){
 const number=salonPhoneForPackages();
 if(!/^\d{9,15}$/.test(number)){toast('ضعي رقم واتساب الصالون الصحيح في إعدادات المالكة');return}
 const url='https://wa.me/'+number+'?text='+encodeURIComponent(message);
 window.open(url,'_blank','noopener,noreferrer');
}
function packageName(p){return lang==='en'?(p.nameEn||p.name):p.name}
function customerLabel(){return String(portalUser?.name||portalUser?.nameAr||'عميلة').trim()}
function renderShop(){
 if(portalRole!=='client'||!portalUser)return;
 const app=document.getElementById('app');if(!app)return;
 // Remove all obsolete duplicated versions of the public packages panel.
 app.querySelectorAll('#salonPublicPackages,#salonCustomerPackagesShop,#salonOldPackageBanner').forEach(el=>el.remove());
 const nav=app.querySelector('nav.nav');
 if(nav){
  [...nav.querySelectorAll('button')].filter(b=>b.hasAttribute('data-salon-luxe-packages')||(b.textContent||'').trim().match(/^(🎀\s*)?(الباقات|Packages)$/i)&&!b.hasAttribute('data-salon-package-nav')).forEach(b=>b.remove());
 }
 if(nav&&!nav.querySelector('[data-salon-package-nav]')){
  const btn=document.createElement('button');btn.type='button';btn.dataset.salonPackageNav='1';btn.textContent=lang==='en'?'🎀 Packages':'🎀 الباقات';
  btn.classList.toggle('active',salonClientPage==='packages');
  btn.onclick=()=>{salonClientPage='packages';renderPortalClient()};
  // Place the packages tab directly after Home, not inside booking or as a sub-section of appointments.
  const first=nav.querySelector('button');
  if(first)first.after(btn);else nav.append(btn);
 }
 // Only show package shopping on its own page, separate from booking and 'my bookings'.
 if(salonClientPage!=='packages')return;
 const panel=document.getElementById('salonClientPagePanel')||app;
 const all=listedPackages(),instant=all.filter(x=>x.kind!=='credit'),credits=all.filter(x=>x.kind==='credit');
 const section=document.createElement('section');section.id='salonCustomerPackagesShop';section.className='salon-pkg-shop';
 const renderCard=p=>{
  const name=esc(packageName(p)),kind=p.kind==='credit',desc=esc(lang==='en'?(p.descriptionEn||p.detailsEn||p.description||p.details||''):(p.description||p.details||''));
  const creditLine=kind?'رصيد '+p.creditsTotal+' استخدامات · '+(Number(p.validityMonths)===0?'بدون تاريخ انتهاء':'صلاحية '+(Number(p.validityMonths)||12)+' شهر'):'عرض يُنفذ في زيارة واحدة';
  return '<article class="salon-pkg-card" data-shop-kind="'+(kind?'credit':'instant')+'"><span class="salon-pkg-label '+(kind?'credit':'')+'">'+(kind?'باقة رصيد استخدامات':'عرض استخدام واحد')+'</span><h3>'+name+'</h3><p>'+desc+'</p><p>'+esc(creditLine)+'</p><b class="price">'+money(p.price)+'</b><button type="button" class="btn" data-package-buy="'+esc(p.id)+'">طلب الشراء عبر واتساب</button></article>';
 };
 section.innerHTML='<h2>✦ عروضنا وباقاتنا</h2><p class="salon-pkg-shop-intro">اختاري الباقة المناسبة وارسلي طلب الشراء إلى واتساب الصالون. الدفع واعتماد رصيد الباقة يتمان بعد تأكيد الصالون، وليس بمجرد فتح واتساب.</p>'+
  '<div class="salon-pkg-tabs" role="group" aria-label="تصفية الباقات"><button type="button" class="active" data-pkg-filter="all">كل الباقات ('+all.length+')</button><button type="button" data-pkg-filter="instant">استخدام واحد ('+instant.length+')</button><button type="button" data-pkg-filter="credit">رصيد استخدامات ('+credits.length+')</button></div>'+
  '<div class="salon-pkg-grid">'+(all.length?all.map(renderCard).join(''):'<p class="salon-pkg-note">لا توجد باقات منشورة الآن. تستطيع المالكة إضافتها من صفحة الباقات ثم إعادة نشرها للعميلات.</p>')+'</div>'+
   '';
 panel.append(section);
 section.querySelectorAll('[data-pkg-filter]').forEach(btn=>btn.addEventListener('click',()=>{
  section.querySelectorAll('[data-pkg-filter]').forEach(x=>x.classList.toggle('active',x===btn));
  const kind=btn.dataset.pkgFilter;
  section.querySelectorAll('[data-shop-kind]').forEach(card=>card.classList.toggle('hidden',kind!=='all'&&card.dataset.shopKind!==kind));
 }));
 section.querySelectorAll('[data-package-buy]').forEach(btn=>btn.addEventListener('click',()=>{
  const p=all.find(x=>x.id===btn.dataset.packageBuy);if(!p)return;
  const msg=(lang==='en'?['🌸 Package purchase request — Quality Nail Salon','Client: '+customerLabel(),'Package: '+packageName(p),'Type: '+(p.kind==='credit'?'Multi-use credit':'One-time offer'),'Listed price: '+money(p.price),p.kind==='credit'?'Uses included: '+p.creditsTotal:'','I would like to purchase this package. Please share payment instructions.','Please confirm payment before activating the package.']:['🌸 طلب شراء باقة — صالون جودة الأظافر','الاسم: '+customerLabel(),'الباقة: '+p.name,'النوع: '+(p.kind==='credit'?'رصيد استخدامات':'استخدام واحد'),'السعر المعلن: '+money(p.price),p.kind==='credit'?'عدد الاستخدامات: '+p.creditsTotal:'','أرغب بإتمام شراء الباقة ومعرفة طريقة الدفع.','يرجى تأكيد الدفع وتفعيل الباقة بعد التحقق.']).filter(Boolean).join('\n');
  openSalonPackageWhatsApp(msg);
 }));

}
const previousRender=window.renderPortalClient;
window.renderPortalClient=function(...args){
 const active=document.activeElement;
 const searchFocus=active?.id==='salonCartSearch'||active?.id==='salonBookingServiceSearch';
 const query=searchFocus?active.value:null;
 const start=searchFocus?active.selectionStart:null,end=searchFocus?active.selectionEnd:null;
 const result=previousRender.apply(this,args);renderShop();
 if(searchFocus&&salonClientPage==='home'){
  const fresh=document.getElementById(active.id);
  if(fresh){fresh.value=query;fresh.dispatchEvent(new Event('input',{bubbles:true}));fresh.focus({preventScroll:true});try{fresh.setSelectionRange(start,end)}catch(e){}}
 }
 return result;
};
// Keep the dedicated packages page accessible after reloading the client portal.
if(typeof portalRole!=='undefined'&&portalRole==='client'&&portalUser)renderShop();
})();
</script>

<!-- Salon auth transition control: avoid stale profile reads and full-page logout reload loops. -->
<script id="salon-signout-stable-20261103">
(function(){
'use strict';
window.salonAuthRevision=window.salonAuthRevision||0;
let pending=false;
function discardPrivateState(){
  portalRole='';portalUser=null;portalBookings=[];
  salonClientPage='home';
  portalCatalog={services:[],staff:[],packages:[],settings:{}};
  db=initialState();db.session=null;
  firebaseReady=false;
  if(typeof salonInvoiceStorageReady!=='undefined')salonInvoiceStorageReady=false;
  if(typeof salonCloudBaseline!=='undefined')salonCloudBaseline=null;
  loginInProgress=false;
  document.getElementById('modalRoot')?.replaceChildren();
  try{localStorage.removeItem(STORAGE_KEY)}catch(_ignored){}
}
function cleanOldLogoutQuery(){
  // The old release appended signed_out=1 and used a full navigation.
  // Removing that marker changes the URL *without* reloading the page.
  try{
    const url=new URL(window.location.href);
    if(url.searchParams.has('signed_out')){
      url.searchParams.delete('signed_out');
      window.history.replaceState(window.history.state,'',url.pathname+url.search+url.hash);
    }
  }catch(_ignored){}
}
clearSession=async function salonSecureLogout(){
  if(pending)return;
  pending=true;
  window.salonLogoutBusy=true;
  ++window.salonAuthRevision;
  const app=document.getElementById('app');
  if(app){app.className='wrap';app.innerHTML='<section class="card" role="status" aria-live="polite" style="max-width:500px;margin:40px auto;text-align:center"><h2>جارٍ تسجيل الخروج…</h2></section>';}
  document.getElementById('homeBtn')?.classList.add('hidden');
  try{
    await auth.signOut();
    if(auth.currentUser)throw new Error('تعذّر إنهاء جلسة Firebase.');
    discardPrivateState();
    cleanOldLogoutQuery();
    renderHome();
  }catch(err){
    console.error('Sign out failed:',err);
    if(!auth.currentUser){discardPrivateState();cleanOldLogoutQuery();renderHome();}
    else{
      // Let the still-authenticated user see their original page if Firebase rejected logout.
      window.salonLogoutBusy=false;
      // Don't claim sign-out succeeded when the authenticated session survived.
      if(db.session?.type==='owner')renderOwner('dashboard');
      else if(portalRole==='client'&&portalUser)renderPortalClient();
      else if(portalRole==='employee'&&portalUser)renderPortalEmployee();
      else renderHome();
      toast('تعذّر تسجيل الخروج: '+String(err?.message||err));
    }
  }finally{
    window.salonLogoutBusy=false;
    pending=false;
  }
};
const oldClient=renderPortalClient;
renderPortalClient=function(...args){
  if(window.salonLogoutBusy||!auth.currentUser||portalRole!=='client')return;
  return oldClient.apply(this,args);
};
const oldEmployee=renderPortalEmployee;
renderPortalEmployee=function(...args){
  if(window.salonLogoutBusy||!auth.currentUser||portalRole!=='employee')return;
  return oldEmployee.apply(this,args);
};
const oldOwner=renderOwner;
renderOwner=function(...args){
  if(window.salonLogoutBusy||!auth.currentUser||db.session?.type!=='owner')return;
  return oldOwner.apply(this,args);
};
window.addEventListener('pageshow',function(event){
  if(event.persisted&&!auth.currentUser&&db.session){discardPrivateState();renderHome()}
});
cleanOldLogoutQuery();
document.documentElement.dataset.salonLogoutFix='stable-auth-20261103';
})();
</script>

es are currently available. Please contact the salon or refresh services.","الخدمات متوفرة لكن لا توجد موظفة متاحة للحجز. يرجى التواصل مع الصالون.":"Services are available, but no specialist is available for booking. Please contact the salon.","طلب ربط النقاط":"Points transfer request","التحقق عبر SMS مُلغى. استخدمي طلب ربط النقاط بعد تأكيد بريدك الإلكتروني.":"SMS verification is disabled. Request your previous points after verifying your email.","تم إرسال طلب ربط النقاط لمراجعته من الصالون":"Your points transfer request was sent to the salon for review","تأخر اتصال النقاط. جرّبي زر تحديث الرصيد لاحقًا.":"The points service is taking too long. Please refresh your balance later.","تعذر تحديث النقاط.":"Unable to refresh points.","تعذر إرسال الطلب":"Unable to send request","تعذر إرسال طلب الربط":"Unable to submit points transfer request","ربط النقاط بالبريد يحتاج نشر وظائف Firebase المرفقة.":"Points transfer requires the salon's Firebase functions to be deployed.","تم إيقاف محاولات الدخول مؤقتًا بسبب كثرة المحاولات. لا تكرري المحاولة الآن، ويرجى التواصل مع الصالون للمساعدة.":"Too many login attempts. Please contact the salon for help.","البريد أو كلمة المرور غير صحيحة. يرجى التواصل مع الصالون للمساعدة.":"Incorrect email or password. Contact the salon for help.","تعذر تسجيل الدخول بهذه البيانات. يرجى التواصل مع الصالون للمساعدة.":"Unable to sign in with these details. Contact the salon for help.","إكمال بيانات حساب العميلة":"Complete client profile","حساب الدخول موجود بالفعل، لكن بيانات العميلة لم تكتمل في قاعدة البيانات. لا تحذفي الحساب ولا تنشئي حسابًا جديدًا؛ أكملي البيانات هنا.":"Your account exists, but the client profile is incomplete. Complete it here instead of creating another account.","حفظ البيانات والدخول":"Save details and sign in","الخروج والعودة للدخول":"Sign out and return to login","أكملي الاسمين":"Please complete both names","اسم الحساب 3-32 حرفًا إنجليزيًا أو رقمًا":"Username: 3–32 English letters or digits","اسم العميلة بالعربي:":"Client name (Arabic):","اسم العميلة بالإنجليزي:":"Client name (English):","الاسم بالعربي":"Arabic name","الاسم بالإنجليزي":"English name","البريد الإلكتروني":"Email address","رقم الجوال":"Mobile number","البريد الإلكتروني الحقيقي لاستعادة كلمة المرور":"Recovery email address","رقم الجوال للحسابات القديمة":"Phone for older accounts","بريد إلكتروني صحيح":"Valid email","لا توجد رسوم SMS. احفظي بريدك الحقيقي؛ سيُستخدم للدخول والاستعادة.":"No SMS fees. Keep your email address for account access and recovery."};
 const patterns=[["^نقاطك المرتبطة بحسابك:\\s*(.+?)\\s+نقطة\\.?$","Points linked to your account: $1 points."],["^كل الباقات \\((\\d+)\\)$","All packages ($1)"],["^استخدام واحد \\((\\d+)\\)$","One-time offers ($1)"],["^رصيد استخدامات \\((\\d+)\\)$","Multi-use credits ($1)"],["^رصيد\\s+(\\d+)\\s+استخدامات\\s*·\\s*صلاحية\\s+(\\d+)\\s+شهر$","$1 uses · Valid for $2 months"],["^رصيد\\s+(\\d+)\\s+استخدامات\\s*·\\s*بدون تاريخ انتهاء$","$1 uses · No expiry date"],["^نتائج البحث:\\s*(\\d+)\\s*—\\s*الخدمات المختارة:\\s*(\\d+)$","Results: $1 — selected: $2"],["^لا توجد خدمات مطابقة، جربي كلمة أخرى\\. الخدمات المختارة:\\s*(\\d+)$","No matching services. Try another keyword. Selected: $1"],["^اكتبي حرفًا أو جزءًا من اسم الخدمة لتظهر النتائج\\. الخدمات المختارة:\\s*(\\d+)$","Enter part of a service name to see results. Selected: $1"],["^كل\\s+(\\d+)\\s+نقطة\\s*=\\s*خصم\\s*(.+)\\s+حسب سياسة الصالون\\.$","Every $1 points = a $2 discount, subject to salon policy."],["^إجمالي عدد الخدمات:\\s*(\\d+)\\s*\\(الحد 10 لكل خدمة\\)\\s*—\\s*الإجمالي:\\s*(.+)$","Total services: $1 (max. 10 each) — Total: $2"],["^إجمالي عدد الخدمات:\\s*(\\d+)","Total services: $1"],["^نقطة\\s*=\\s*(.+)؛\\s*لا تُخصم النقاط عند طلب الحجز$","points = $1; points are not deducted until the booking is confirmed"],["^اكتبي اسم الخدمة لتظهر الخيارات\\.\\s*الخدمات المختارة:\\s*(\\d+)$","Type a service to see options. Selected: $1"],["^(\\d+)\\s*دقيقة$","$1 min"],["^(.+)\\s+دقيقة$","$1 min"]].map(([pat,repl])=>[new RegExp(pat,'u'),repl]);
 const partial={"نتائج البحث:":"Search results:","الخدمات المختارة:":"Selected services:","لا توجد خدمات مطابقة، جربي كلمة أخرى.":"No matching services. Try another keyword.","عدد الخدمات:":"Service count:","— الإجمالي:":"— Total:","— المدة:":"— Duration:","نقطة =":"points =","حسب سياسة الصالون.":"Subject to salon policy.","أُضيف إلى السلة":"Added to basket"};
 const roots=['#app','#modalRoot','#toastRoot'];
 const skipTags=new Set(['SCRIPT','STYLE','NOSCRIPT','CODE','PRE','SVG','TEXTAREA','OPTIONAL']);
 let busy=false, scheduled=false;
 const english=()=>typeof lang!=='undefined'&&lang==='en';
 function translateString(value){
   if(!/[\u0600-\u06FF]/u.test(value))return value;
   const match=/^(\s*)([\s\S]*?)(\s*)$/u.exec(value),prefix=match[1],core=match[2],suffix=match[3];
   if(Object.prototype.hasOwnProperty.call(exact,core))return prefix+exact[core]+suffix;
   for(const [p,r] of patterns){if(p.test(core))return prefix+core.replace(p,(_,a,b)=>r.replace('\$1',a??'').replace('\$2',b??''))+suffix;}
   let translated=core;
   // Only replace a few known UI fragments in mixed quantitative summaries.
   if(/^(?:نتائج البحث:|الخدمات المختارة:|عدد الخدمات:|— الإجمالي:|— المدة:|نقطة =|حسب سياسة الصالون\.|أُضيف إلى السلة)/u.test(core)){
      for(const [ar,en] of Object.entries(partial))translated=translated.split(ar).join(en);
   }
   return prefix+translated+suffix;
 }
 function localize(root){
   if(!english()||!root)return;
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
   for(const node of nodes){
      const parent=node.parentElement;
      if(!parent||skipTags.has(parent.tagName)||parent.closest('[contenteditable="true"],[data-keep-original-language],.salon-ai-panel'))continue;
      const updated=translateString(node.nodeValue||'');if(updated!==node.nodeValue)node.nodeValue=updated;
   }
   const elements=[root,...root.querySelectorAll('input,textarea,button,select,option,[title],[aria-label]')];
   for(const el of elements){
      if(el.closest?.('[data-keep-original-language],.salon-ai-panel'))continue;
      for(const attr of ['placeholder','title','aria-label']){
       if(el.hasAttribute?.(attr)){const prev=el.getAttribute(attr),next=translateString(prev);if(prev!==next)el.setAttribute(attr,next);}
      }
   }
 }
 function run(){
    scheduled=false;if(busy||!english())return;
    busy=true;
    try{for(const selector of roots)localize(document.querySelector(selector));}
    catch(err){console.warn('Customer language sync:',err);}
    finally{busy=false;}
 }
 function schedule(){
   if(scheduled||busy||!english())return;
   scheduled=true;queueMicrotask(run);
 }
 const observer=new MutationObserver(schedule);
 for(const selector of roots){const el=document.querySelector(selector);if(el)observer.observe(el,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']});}
 // Running after rendering preserves cursor focus, typed text, and existing event listeners.
 document.getElementById('langBtn')?.addEventListener('click',()=>queueMicrotask(schedule));
 document.addEventListener('DOMContentLoaded',schedule);
 schedule();
 window.salonTranslateCurrentView=schedule;
})();
</script>

<script id="salon-booking-closure-and-owned-packages-js">
(function(){
 'use strict';
 const ownerUid='AvRinM2frzLkDWH1CsH7CnIhFnK2';
 const localized=(ar,en)=>lang==='en'?en:ar;
 const portalRef=firestore.collection('portal').doc('catalog');
 const packageViews=firestore.collection('clientPackageViews');
 function onlineBookingControl(){
   const x=portalCatalog?.bookingControl;
   return {acceptingBookings:x?.acceptingBookings===true,blocks:Array.isArray(x?.blocks)?x.blocks:[]};
 }
 function bookingRestriction(c,date,time,staffId,duration){
   if(c?.acceptingBookings!==true)return localized('الحجوزات مغلقة حاليًا أو لم يكتمل التحقق من فتحها. يرجى التواصل مع الصالون.','Bookings are closed or opening could not be verified. Please contact the salon.');
   if(!date||!time||!staffId)return '';
   const beginning=typeof timeToMin==='function'?timeToMin(time):Number(time.slice(0,2))*60+Number(time.slice(3));
   const ending=beginning+Math.max(1,Number(duration)||30);
   if((c?.blocks||[]).some(b=>String(b.date)===date&&(String(b.staffId)==='all'||String(b.staffId)===String(staffId))&&(b.fullDay===true||(beginning<(Number(String(b.endTime||'24:00').slice(0,2))*60+Number(String(b.endTime||'24:00').slice(3)))&&ending>(Number(String(b.startTime||'00:00').slice(0,2))*60+Number(String(b.startTime||'00:00').slice(3))))))){
     return localized('هذا اليوم أو الوقت مغلق من إدارة الصالون. اختاري موعدًا آخر.','This date or time is unavailable. Please select a different appointment.');
   }
   return '';
 }
 async function getLatestControl(){
   const snap=await portalRef.get({source:'server'});
   if(!snap.exists)throw Error(localized('إعدادات الحجز غير متاحة، تواصلي مع الصالون.','Booking settings are unavailable; contact the salon.'));
   const data=snap.data()||{},c=data.bookingControl;
   if(!c||c.acceptingBookings!==true&&c.acceptingBookings!==false)throw Error(localized('لم تُنشر حالة الحجوزات في إعدادات الصالون؛ تطلبين إعادة نشرها من لوحة الإدارة.','Booking status has not been published. Ask the salon to publish its booking settings.'));
   portalCatalog.bookingControl=c;
   return c;
 }
 function ownerCanPublish(){return firebaseReady&&auth.currentUser?.uid===ownerUid&&db.session?.type==='owner'}
 async function publishControl(){
   if(!ownerCanPublish())throw Error('انتهت جلسة المالكة');
   const blocks=(Array.isArray(db.blocks)?db.blocks:[]).filter(b=>b?.date).map(b=>({date:String(b.date),staffId:String(b.staffId||'all'),fullDay:b.fullDay===true,startTime:String(b.startTime||'00:00'),endTime:String(b.endTime||'23:59')}));
   const control={acceptingBookings:db.settings?.onlineBookingOpen!==false,blocks,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
   await portalRef.set({bookingControl:control},{merge:true});
   const check=await portalRef.get({source:'server'});
   if(check.data()?.bookingControl?.acceptingBookings!==control.acceptingBookings)throw Error('تعذر التحقق من حالة الحجز المنشورة');
   return true;
 }
 window.salonPublishBookingControl=async function(){
   try{await saveQueue;await publishControl();toast('تم نشر حالة الحجوزات والأوقات المغلقة للعميلات');}
   catch(e){console.error('Booking publishing failed',e);toast('لم يتم نشر الإغلاق للعميلات: '+(e.message||e))}
 };
 window.salonToggleOnlineBooking=async function(){
   if(!ownerCanPublish())return;
   const now=db.settings.onlineBookingOpen!==false;
   if(now&&!confirm('تأكيد إيقاف استقبال الحجوزات الجديدة من الموقع؟'))return;
   db.settings.onlineBookingOpen=!now;
   const button=document.querySelector('#salonOnlineBookingToggle');if(button)button.disabled=true;
   try{const ok=await persist();if(!ok)throw Error('لم تُحفظ حالة الحجوزات');await publishControl();toast(now?'تم إغلاق الحجوزات على الموقع':'تم فتح الحجوزات على الموقع');renderOwner('schedule')}
   catch(err){
     console.error('Booking switch failed:',err);
     // Restore owner UI on failure; never announce that a failed publication took effect.
     db.settings.onlineBookingOpen=now;
     try{await persist()}catch(revertErr){console.error('Booking switch restoration:',revertErr)}
     toast('لم يتغير استقبال الحجوزات لدى العميلات. تحققي من صلاحيات نشر portal/catalog ثم أعيدي المحاولة: '+String(err.message||err));
     renderOwner('schedule')
   }
 };
 const originalSchedule=scheduleForm;
 scheduleForm=function(){
   const open=db.settings?.onlineBookingOpen!==false;
   const manage='<div class="salon-booking-manager"><h3>'+localized('🔒 حالة استقبال الحجوزات','🔒 Online booking status')+'</h3><p class="muted">'+localized('إغلاق الحجز يمنع العميلات من إرسال حجوزات جديدة عبر الموقع. ويمكنك أيضًا إغلاق يوم أو فترة أدناه.','Closing bookings stops customers from creating new bookings. You can also block dates or hours below.')+'</p><div class="row"><strong>'+(open?localized('الحجوزات مفتوحة','Bookings open'):localized('الحجوزات مغلقة','Bookings closed'))+'</strong><button type="button" id="salonOnlineBookingToggle" class="btn '+(open?'danger':'secondary')+'" onclick="salonToggleOnlineBooking()">'+(open?localized('إيقاف استقبال الحجوزات','Stop accepting bookings'):localized('فتح الحجوزات','Open bookings'))+'</button><button type="button" class="btn secondary" onclick="salonPublishBookingControl()">'+localized('إعادة نشر الأوقات المغلقة','Sync closed times')+'</button></div></div>';
   return manage+originalSchedule.apply(this,arguments);
 };
 const oldBlock=addBlock;
 addBlock=function(...args){const before=(db.blocks||[]).length;const result=oldBlock.apply(this,args);if((db.blocks||[]).length!==before){saveQueue.then(publishControl).then(()=>toast('تم تطبيق الإغلاق على صفحة العميلة')).catch(e=>toast('حُفظ الإغلاق لكن تعذّر نشره للعميلات: '+(e.message||e)))}return result};
 const oldReopen=reopenBlock;
 reopenBlock=function(...args){const before=(db.blocks||[]).length;const result=oldReopen.apply(this,args);if((db.blocks||[]).length!==before){saveQueue.then(publishControl).catch(e=>toast('تعذّر نشر إعادة فتح الوقت: '+(e.message||e)))}return result};
 // Recheck the *server* before submitting a regular booking. Never rely on a stale page cache.
 const oldSubmitBooking=submitPortalBooking;
 submitPortalBooking=async function(event){
   event.preventDefault();if(portalRole!=='client'||!auth.currentUser)return;
   const form=event.target,send=form.querySelector('button[type="submit"]');if(send?.disabled)return;
   const fd=new FormData(form),staff=String(fd.get('staff')||''),date=String(fd.get('date')||''),time=String(fd.get('time')||'');
   const duration=(portalCatalog.services||[]).reduce((n,s)=>n+Math.max(0,Number(fd.get('serviceQty_'+s.id))||0)*(Number(s.duration)||30),0);
   if(send)send.disabled=true;
   try{const control=await getLatestControl();const message=bookingRestriction(control,date,time,staff,duration);if(message){toast(message);return}await oldSubmitBooking.call(this,event)}

         const number=String(portalCatalog.settings?.whatsapp||WA_NUMBER).replace(/\D/g,'');
         const phone=/^05\d{8}$/.test(number)?'966'+number.slice(1):number;
         if(/^\d{9,15}$/.test(phone)){
           const message=localized('طلب حجز باستخدام باقتي','Appointment request using my package')+' — '+String(record.packageName||'')+'\n'+localized('العميلة: ','Client: ')+String(portalUser.nameAr||portalUser.name||'')+'\n'+localized('الخدمة: ','Service: ')+String(service.name||'')+'\n'+localized('الموظفة: ','Specialist: ')+String(staff.name||'')+'\n'+date+' '+time+'\n'+localized('رقم الطلب: ','Request number: ')+bookingRef.id;
           const a=document.createElement('a');a.className='btn secondary';a.target='_blank';a.rel='noopener noreferrer';a.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);a.textContent=localized('إرسال نسخة عبر واتساب (اختياري)','Send a copy by WhatsApp (optional)');notice.appendChild(a);

       }catch(error){console.warn('Package booking request error',error);toast(error.code==='permission-denied'?localized('قواعد Firebase لا تسمح بالحجز. حدّثي قواعد portalBookings أولًا.','Firebase rules rejected the request. Update portalBookings rules first.'):String(error.message||error))}
       finally{if(button.isConnected)button.disabled=false}

 // A purchased balance is synced to a per-account document, NEVER to the public catalog.
 async function syncPackageView(client){
   if(!ownerCanPublish())throw Error('Owner permission required');
   const uid=String(client?.authUid||'');if(!uid)return false;
   const profile=await firestore.collection('clientProfiles').doc(uid).get({source:'server'});
   if(!profile.exists||salonNormalizePhone(profile.data()?.phone)!==salonNormalizePhone(client.phone))throw Error('الملف ورقم جوال العميلة غير متطابقين، لا يمكن ربط الباقات');

 window.salonOwnerLinkCustomerPackages=async function(id){
   if(!ownerCanPublish())return;
   const c=(db.clients||[]).find(c=>String(c.id)===String(id));if(!c)return;
   try{
     const variants=[...new Set(['0'+salonNormalizePhone(c.phone),'+966'+salonNormalizePhone(c.phone),'966'+salonNormalizePhone(c.phone)])];
     const found=new Map();for(const phone of variants){const docs=await firestore.collection('clientProfiles').where('phone','==',phone).limit(3).get();docs.forEach(doc=>found.set(doc.id,doc.data()))}
     if(found.size!==1){toast('لم يتم العثور على حساب واحد مطابق للجوال. راجعي بيانات العميلة أولًا.');return}
     const [uid,profile]=[...found.entries()][0];
     if(!confirm('راجعي هوية العميلة وإثبات شرائها قبل الربط. هل تأكدتِ من أن حساب '+(profile.nameAr||profile.name||uid)+' يعود للعميلة '+c.name+'؟'))return;
     const old=c.authUid;c.authUid=uid;
     const persisted=await persist();if(!persisted){c.authUid=old;throw Error('تعذر حفظ الربط في قاعدة الصالون')}

     const pos=html.indexOf(token);if(pos<0)continue;const rowEnd=html.indexOf('</div></td></tr>',pos);if(rowEnd>=0)html=html.slice(0,rowEnd)+target+html.slice(rowEnd);
   }
   return html;

 // Keep the customer's page synchronized when the owner closes/reopens bookings after page load.
 // A cached/offline snapshot is never taken as proof that bookings are open.
 let controlVerified=false;
 const unsubscribeBookingControl=portalRef.onSnapshot({includeMetadataChanges:true},snap=>{
   const value=(!snap.metadata.fromCache&&snap.exists)?snap.data()?.bookingControl:null;
   portalCatalog.bookingControl=value&&typeof value.acceptingBookings==='boolean'?value:{acceptingBookings:false,blocks:[]};
   controlVerified=!!value&&!snap.metadata.fromCache;
   if(portalRole==='client')decorateBookingStatus();
 },error=>{
   console.warn('Live booking status unavailable',error);
   controlVerified=false;
   portalCatalog.bookingControl={acceptingBookings:false,blocks:[]};
   if(portalRole==='client')decorateBookingStatus();
 });
 const oldInvoiceSaver=salonSaveIndependentInvoice;
 salonSaveIndependentInvoice=async function(...args){
   const result=await oldInvoiceSaver.apply(this,args);

   return result;

<script id="salon-startup-and-header-completion-20261104">

}

  document.documentElement.classList.remove('salon-booting');

 }
},15000);

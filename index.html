<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صالون جودة الأظافر</title><style>
:root{--a:#773d58;--b:#f9eaf1;--line:#e9d7df}*{box-sizing:border-box}body{margin:0;background:#faf7f9;color:#302632;font-family:Tahoma,Arial,sans-serif}header{background:var(--a);color:white;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}main{max-width:1050px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 5px 20px #41202c0b}.portal{text-align:center;cursor:pointer;min-height:140px}.portal b{display:block;margin:12px}h2,h3{color:var(--a)}button{border:0;background:var(--a);color:white;padding:11px 15px;border-radius:10px;cursor:pointer;margin:3px}button.secondary{background:var(--b);color:var(--a)}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:11px;border:1px solid #dac9d1;border-radius:10px;margin:5px 0 12px;background:white}label{display:block;font-size:14px;font-weight:bold}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.muted{color:#786e78;font-size:13px}.error{color:#a42639}.success{color:#14734a}.hide{display:none!important}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:start}th{background:var(--b)}.scroll{overflow:auto}.chip{display:inline-block;background:var(--b);border-radius:20px;padding:6px 12px;margin:3px}.nav{display:flex;gap:5px;flex-wrap:wrap}#message{position:fixed;bottom:10px;left:10px;right:10px;max-width:550px;margin:auto;z-index:9;background:#2b2730;color:white;padding:12px;border-radius:12px;display:none}input[type=checkbox]{width:auto;margin:5px} @media(max-width:600px){header strong{font-size:15px}}
</style></head><body><header><strong>✿ <span data-t="brand">صالون جودة الأظافر</span></strong><div><button class="secondary" id="language">English</button><button class="secondary hide" id="logout" data-t="logout">خروج</button></div></header><main id="app"></main><div id="message"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script><script>
'use strict';
const config={apiKey:'AIzaSyA31G1qjrzq-Ykxu4EojR8KkhL3zS_MuGY',authDomain:'nailqualitysalon.firebaseapp.com',projectId:'nailqualitysalon',storageBucket:'nailqualitysalon.firebasestorage.app',messagingSenderId:'596122867385',appId:'1:596122867385:web:0d3f8d4bcf3e04b51f6d68'};
firebase.initializeApp(config);const auth=firebase.auth(),fs=firebase.firestore(),fn=firebase.app().functions('us-central1');const OWNER='AvRinM2frzLkDWH1CsH7CnIhFnK2';let lang=localStorage.getItem('salon-lang')||'ar',role='',user=null,services=[],staff=[],settings={redeemPoints:50,redeemRiyals:10};const $=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sar=n=>new Intl.NumberFormat(lang==='ar'?'ar-SA':'en-US',{style:'currency',currency:'SAR'}).format(Number(n)||0);const tr=(ar,en)=>lang==='ar'?ar:en;const msg=x=>{const e=$('message');e.textContent=x;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',5000)};const err=e=>msg(e?.message||String(e));const call=async(name,data)=>{const r=await fn.httpsCallable(name)(data);return r.data};const rows=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));const dateNow=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
async function loadCatalog(){const [a,b,c]=await Promise.all([fs.collection('services').get(),fs.collection('staffPublic').get(),fs.doc('settings/public').get()]);services=rows(a).filter(x=>x.active!==false);staff=rows(b).filter(x=>x.active!==false);settings={redeemPoints:50,redeemRiyals:10,...(c.data()||{})}}
function shell(html){$('app').innerHTML=html;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('language').textContent=lang==='ar'?'English':'العربية';$('logout').classList.toggle('hide',!user)}
function home(){role='';shell(`<h2>${tr('اختاري بوابة الدخول','Choose your portal')}</h2><div class="grid"><div class="card portal" onclick="selectRole('client')">🌷<b>${tr('بوابة العميلة','Client portal')}</b>${tr('حجوزات ونقاط الولاء','Bookings and loyalty')}</div><div class="card portal" onclick="selectRole('employee')">📅<b>${tr('بوابة الموظفة','Staff portal')}</b>${tr('مواعيدي','My appointments')}</div><div class="card portal" onclick="selectRole('owner')">👑<b>${tr('بوابة المالكة','Owner portal')}</b>${tr('الإدارة والتقارير','Management and reports')}</div></div>`)}
function selectRole(r){role=r;if(user){route();return}login()}
function login(register=false){shell(`<div class="card" style="max-width:520px;margin:auto"><button class="secondary" onclick="home()">← ${tr('الرئيسية','Home')}</button><h2>${register?tr('إنشاء حساب عميلة','Create client account'):tr('تسجيل الدخول','Sign in')}</h2><form id="loginForm">${register?`<label>${tr('الاسم','Name')}</label><input name="name" required maxlength="80"><label>${tr('الجوال','Phone')}</label><input name="phone" required maxlength="20">`:''}<label>${tr('البريد الإلكتروني','Email')}</label><input name="email" type="email" required><label>${tr('كلمة المرور','Password')}</label><input name="password" type="password" minlength="8" required><button>${register?tr('إنشاء حساب','Create account'):tr('دخول','Sign in')}</button></form>${role==='client'?`<button class="secondary" onclick="login(${!register})">${register?tr('لدي حساب','Already registered'):tr('إنشاء حساب جديد','Create account')}</button>`:''}<p class="muted">${tr('تُحفظ كلمات المرور في Firebase Authentication','Passwords are managed by Firebase Authentication')}</p></div>`);$('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=f.get('email'),password=f.get('password');e.target.querySelector('button').disabled=true;try{if(register){const c=await auth.createUserWithEmailAndPassword(email,password);await call('ensureClient',{name:f.get('name'),phone:f.get('phone')});user=c.user}else{const c=await auth.signInWithEmailAndPassword(email,password);user=c.user}await route()}catch(x){err(x);e.target.querySelector('button').disabled=false}}}
async function route(){if(!user){login();return}try{if(role==='owner'){if(user.uid!==OWNER)throw Error(tr('هذا الحساب ليس حساب المالكة','Owner account required'));await loadCatalog();owner('dashboard')}else if(role==='employee'){const d=await fs.doc('staffAccounts/'+user.uid).get();if(!d.exists||d.data().active===false)throw Error(tr('حساب الموظفة غير مفعل','Staff account not active'));employee()}else if(role==='client'){const d=await fs.doc('clients/'+user.uid).get();if(!d.exists)throw Error(tr('هذا ليس حساب عميلة، أنشئي حسابًا من بوابة العميلة','Client profile not found'));await loadCatalog();client()}else home()}catch(e){err(e);home()}}
async function client(){try{await loadCatalog();const [c,b]=await Promise.all([fs.doc('clients/'+user.uid).get(),fs.collection('bookings').where('clientId','==',user.uid).get()]);const p=c.data()||{},bookings=rows(b).sort((a,b)=>String(b.date).localeCompare(String(a.date)));shell(`<div class="row"><h2>${tr('أهلًا','Welcome')} ${safe(p.name)}</h2><button class="secondary" onclick="home()">${tr('البوابات','Portals')}</button></div><div class="card"><h3>${tr('رصيد نقاطك','Your points')}</h3><h2>${Number(p.points)||0} ⭐</h2><p>${settings.redeemPoints} ${tr('نقطة','points')} = ${sar(settings.redeemRiyals)} ${tr('خصم','discount')}</p></div><div class="card"><h3>${tr('حجز موعد جديد','New booking')}</h3><form id="bookForm"><label>${tr('اختاري خدمة أو أكثر','Select one or more services')}</label><div>${services.map(s=>`<label class="chip"><input type="checkbox" name="svc" value="${safe(s.id)}" onchange="estimate()"> ${safe(lang==='en'&&s.nameEn?s.nameEn:s.name)} — ${sar(s.price)} — ${s.loyaltyPoints||0} ⭐</label>`).join('')}</div><label>${tr('الموظفة','Employee')}</label><select name="staffId" required><option value="">${tr('اختاري','Choose')}</option>${staff.map(s=>`<option value="${safe(s.id)}">${safe(s.name)}</option>`).join('')}</select><div class="row"><div><label>${tr('التاريخ','Date')}</label><input type="date" name="date" min="${dateNow()}" required></div><div><label>${tr('الوقت','Time')}</label><input type="time" name="time" required></div></div><label>${tr('المكان','Location')}</label><select name="location" onchange="$('addressWrap').classList.toggle('hide',this.value!=='home')"><option value="salon">${tr('في الصالون','Salon')}</option><option value="home">${tr('في المنزل','At home')}</option></select><div id="addressWrap" class="hide"><label>${tr('عنوان المنزل','Home address')}</label><input name="address" maxlength="250"></div><label>${tr('النقاط التي تريدين استخدامها','Points to redeem')}</label><input type="number" name="pointsToUse" value="0" min="0" step="${settings.redeemPoints}" oninput="estimate()"><p class="muted" id="estimate"></p><label>${tr('ملاحظات','Notes')}</label><textarea name="notes"></textarea><button>${tr('تأكيد طلب الحجز','Submit booking')}</button></form></div><div class="card"><h3>${tr('حجوزاتي','My bookings')}</h3>${bookings.length?bookings.map(b=>`<p>${safe(b.date)} ${safe(b.time)} — ${safe(b.items?.map(x=>x.name).join('، '))} — ${sar(b.total)} — ${safe(b.status)} ${['pending','confirmed'].includes(b.status)?`<button class="secondary" onclick="cancelMyBooking('${safe(b.id)}')">${tr('إلغاء','Cancel')}</button>`:''}</p>`).join(''):tr('لا توجد حجوزات','No bookings')}</div>`);$('bookForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const data={serviceIds:f.getAll('svc'),staffId:f.get('staffId'),date:f.get('date'),time:f.get('time'),location:f.get('location'),address:f.get('address'),pointsToUse:Number(f.get('pointsToUse')),notes:f.get('notes')};if(!data.serviceIds.length){msg(tr('اختاري خدمة','Select a service'));return}const btn=e.target.querySelector('button[type=submit],button:not([type])');btn.disabled=true;try{await call('createBooking',data);msg(tr('تم تسجيل الحجز','Booking saved'));await client()}catch(x){err(x);btn.disabled=false}};estimate()}catch(e){err(e)}}
function estimate(){const f=$('bookForm');if(!f)return;const ids=new FormData(f).getAll('svc'),sum=services.filter(s=>ids.includes(s.id)).reduce((a,s)=>a+Number(s.price),0),points=Number(new FormData(f).get('pointsToUse'))||0,discount=points/settings.redeemPoints*settings.redeemRiyals;$('estimate').textContent=`${tr('الإجمالي','Subtotal')}: ${sar(sum)} — ${tr('الخصم','Discount')}: ${sar(discount)} — ${tr('المطلوب','Due')}: ${sar(Math.max(0,sum-discount))}`}
async function cancelMyBooking(id){if(!confirm(tr('إلغاء الحجز واستعادة نقاط الخصم؟','Cancel and refund points?')))return;try{await call('cancelBooking',{id});client()}catch(e){err(e)}}
async function employee(){try{const [s,b]=await Promise.all([fs.doc('staffAccounts/'+user.uid).get(),fs.collection('bookings').where('staffId','==',user.uid).get()]);const bs=rows(b).sort((a,b)=>String(a.date+a.time).localeCompare(String(b.date+b.time)));shell(`<div class="row"><h2>${tr('مواعيد الموظفة','Employee appointments')}: ${safe(s.data()?.name)}</h2><button class="secondary" onclick="home()">${tr('البوابات','Portals')}</button></div><div class="card">${bs.length?bs.map(b=>`<p>📅 ${safe(b.date)} ${safe(b.time)} — ${safe(b.items?.map(s=>s.name).join('، '))} — ${b.location==='home'?tr('منزلي','Home'):tr('صالون','Salon')} ${b.location==='home'?safe(b.address):''} — ${safe(b.status)}</p>`).join(''):tr('لا توجد مواعيد','No appointments')}</div>`)}catch(e){err(e)}}
async function owner(tab='dashboard'){try{await loadCatalog();const [bs,cs,ivs,st]=await Promise.all([fs.collection('bookings').get(),fs.collection('clients').get(),fs.collection('invoices').get(),fs.collection('staffAccounts').get()]);window._owner={bookings:rows(bs),clients:rows(cs),invoices:rows(ivs),staffAccounts:rows(st)};const nav=[['dashboard',tr('التقارير','Reports')],['bookings',tr('الحجوزات','Bookings')],['services',tr('الخدمات والنقاط','Services & points')],['staff',tr('الموظفات','Staff')],['clients',tr('العميلات','Clients')],['migration',tr('نقل البيانات','Migration')]];shell(`<h2>${tr('بوابة صاحبة الصالون','Owner portal')}</h2><div class="nav">${nav.map(([id,label])=>`<button class="${id===tab?'':'secondary'}" onclick="owner('${id}')">${label}</button>`).join('')}</div><section id="panel"></section>`);const o=window._owner,p=$('panel');if(tab==='dashboard'){const revenue=o.invoices.reduce((n,i)=>n+Number(i.total||0),0);const byStaff={};o.invoices.forEach(i=>byStaff[i.staffId]=(byStaff[i.staffId]||0)+Number(i.total||0));p.innerHTML=`<div class="grid"><div class="card"><h3>${tr('إجمالي الفواتير','Total revenue')}</h3><h2>${sar(revenue)}</h2></div><div class="card"><h3>${tr('عدد الحجوزات','Bookings')}</h3><h2>${o.bookings.length}</h2></div><div class="card"><h3>${tr('الفواتير','Invoices')}</h3><h2>${o.invoices.length}</h2></div></div><div class="card"><h3>${tr('إيرادات الموظفات','Revenue by employee')}</h3>${Object.entries(byStaff).map(([id,value])=>`<p>${safe(staff.find(s=>s.id===id)?.name||id)}: ${sar(value)}</p>`).join('')}</div><p class="muted">${tr('التقارير تعتمد على الفواتير المسجلة في النسخة الجديدة. لا تشمل المصروفات القديمة.','Reports use invoices from this version, excluding legacy expenses.')}</p>`}
else if(tab==='services'){p.innerHTML=`<div class="card"><h3>${tr('إعدادات الخصم','Redemption settings')}</h3><form id="settingsForm"><label>${tr('عدد النقاط','Points threshold')}</label><input name="redeemPoints" type="number" min="1" value="${settings.redeemPoints}" required><label>${tr('الخصم بالريال','Discount SAR')}</label><input name="redeemRiyals" type="number" min="0.01" step="0.01" value="${settings.redeemRiyals}" required><button>${tr('حفظ','Save')}</button></form></div><div class="card"><h3>${tr('إضافة خدمة','Add service')}</h3><form id="serviceForm"><label>${tr('اسم الخدمة','Service name')}</label><input name="name" required><label>English</label><input name="nameEn"><label>${tr('السعر','Price')}</label><input name="price" type="number" min="0" step=".01" required><label>${tr('المدة بالدقائق','Duration minutes')}</label><input name="duration" type="number" min="5" value="30" required><label>${tr('نقاط الخدمة','Service points')}</label><input name="loyaltyPoints" type="number" min="0" value="0" required><button>${tr('حفظ','Save')}</button></form></div><div class="card">${services.map(s=>`<p>${safe(s.name)} — ${sar(s.price)} — ${s.loyaltyPoints} ⭐ <button class="secondary" onclick="editService('${safe(s.id)}')">${tr('تعديل','Edit')}</button></p>`).join('')}</div>`;$('settingsForm').onsubmit=async e=>{e.preventDefault();try{await call('saveSettings',Object.fromEntries(new FormData(e.target)));owner('services')}catch(x){err(x)}};$('serviceForm').onsubmit=async e=>{e.preventDefault();try{await call('saveService',Object.fromEntries(new FormData(e.target)));owner('services')}catch(x){err(x)}}}
else if(tab==='staff'){p.innerHTML=`<div class="card"><h3>${tr('إضافة موظفة وحساب دخول','Add employee login')}</h3><form id="staffForm"><label>${tr('الاسم','Name')}</label><input name="name" required><label>${tr('الجوال','Phone')}</label><input name="phone"><label>${tr('بريد الموظفة','Employee email')}</label><input type="email" name="email" required><label>${tr('كلمة المرور التي تحددينها (8 أحرف على الأقل)','Password you set (8+ characters)')}</label><input type="password" name="password" minlength="8" required><button>${tr('إضافة','Add')}</button></form></div><div class="card">${o.staffAccounts.map(s=>`<p>${safe(s.name)} — ${safe(s.email)} — ${s.active===false?tr('معطلة','Disabled'):tr('نشطة','Active')} <button class="secondary" onclick="resetStaffPassword('${safe(s.id)}')">${tr('تغيير كلمة المرور','Change password')}</button> <button onclick="disableStaff('${safe(s.id)}')">${tr('تعطيل','Disable')}</button></p>`).join('')}</div>`;$('staffForm').onsubmit=async e=>{e.preventDefault();try{await call('createStaff',Object.fromEntries(new FormData(e.target)));msg(tr('تم إنشاء حساب الموظفة','Staff created'));owner('staff')}catch(x){err(x)}}}
else if(tab==='bookings'){p.innerHTML=`<div class="card scroll"><table><thead><tr><th>${tr('الموعد','Appointment')}</th><th>${tr('العميلة','Client')}</th><th>${tr('الخدمات','Services')}</th><th>${tr('الموظفة','Staff')}</th><th>${tr('المبلغ','Total')}</th><th>${tr('الحالة','Status')}</th><th>${tr('الإجراءات','Actions')}</th></tr></thead><tbody>${o.bookings.sort((a,b)=>String(b.date+b.time).localeCompare(String(a.date+a.time))).map(b=>`<tr><td>${safe(b.date)} ${safe(b.time)}<br>${b.location==='home'?tr('منزل','Home'):tr('صالون','Salon')}</td><td>${safe(o.clients.find(c=>c.id===b.clientId)?.name||b.clientId)}</td><td>${safe(b.items?.map(i=>i.name).join('، '))}</td><td>${safe(staff.find(s=>s.id===b.staffId)?.name)}</td><td>${sar(b.total)}</td><td>${safe(b.status)}</td><td>${!['completed','cancelled','noShow'].includes(b.status)?`<button class="secondary" onclick="changeStatus('${safe(b.id)}','confirmed')">${tr('تأكيد','Confirm')}</button><button onclick="invoice('${safe(b.id)}')">${tr('إصدار فاتورة','Invoice')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
else if(tab==='clients'){p.innerHTML=`<div class="card scroll"><table><tr><th>${tr('الاسم','Name')}</th><th>${tr('الجوال','Phone')}</th><th>${tr('البريد','Email')}</th><th>${tr('النقاط','Points')}</th></tr>${o.clients.map(c=>`<tr><td>${safe(c.name)}</td><td>${safe(c.phone)}</td><td>${safe(c.email)}</td><td>${c.points||0}</td></tr>`).join('')}</table></div>`}
else if(tab==='migration'){p.innerHTML=`<div class="card"><h3>${tr('نقل الخدمات من النظام القديم','Import legacy services')}</h3><p>${tr('ينقل الخدمات وقاعدة خصم النقاط من المستند القديم دون حذفه. لا ينقل حسابات الموظفات أو العميلات القديمة تلقائيًا.','Imports services and loyalty settings only. Old accounts are not automatically migrated.')}</p><button onclick="migrate()">${tr('بدء نقل الخدمات','Import services')}</button></div>`}
}catch(e){err(e)}}
async function editService(id){const s=services.find(x=>x.id===id);if(!s)return;const name=prompt(tr('اسم الخدمة','Service name'),s.name);if(name===null)return;const price=prompt(tr('السعر','Price'),s.price);if(price===null)return;const points=prompt(tr('النقاط','Points'),s.loyaltyPoints);if(points===null)return;try{await call('saveService',{...s,name,price:Number(price),loyaltyPoints:Number(points)});owner('services')}catch(e){err(e)}}
async function resetStaffPassword(uid){const password=prompt(tr('كلمة المرور الجديدة (8 أحرف على الأقل)','New password (8+ characters)'));if(!password)return;try{await call('setStaffPassword',{uid,password});msg(tr('تم تغيير كلمة المرور','Password changed'))}catch(e){err(e)}}
async function disableStaff(uid){if(!confirm(tr('تعطيل حساب الموظفة؟','Disable staff account?')))return;try{await call('disableStaff',{uid});owner('staff')}catch(e){err(e)}}
async function changeStatus(id,status){try{await call('setBookingStatus',{id,status});owner('bookings')}catch(e){err(e)}}
async function invoice(bookingId){const payment=prompt(tr('طريقة الدفع: cash أو card أو transfer','Payment: cash, card or transfer'),'card');if(payment===null)return;try{await call('createInvoice',{bookingId,payment});msg(tr('تم إصدار الفاتورة وإضافة النقاط','Invoice issued and points credited'));owner('bookings')}catch(e){err(e)}}
async function migrate(){if(!confirm(tr('نقل الخدمات والإعدادات من النظام القديم؟','Import old services and settings?')))return;try{const r=await call('migrateLegacy',{});msg(`${tr('تم نقل','Imported')} ${r.services} ${tr('خدمة','services')}`);owner('services')}catch(e){err(e)}}
$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('salon-lang',lang);if(!role)home();else if(user)route();else login()};$('logout').onclick=async()=>{await auth.signOut();user=null;home()};auth.onAuthStateChanged(u=>{user=u;if(!role)home();else if(u)route();else login()});
</script></body></html>

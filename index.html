let salonCloudBaseline=null;
function persist(){
  if(!firebaseReady || !auth.currentUser || auth.currentUser.uid!=="AvRinM2frzLkDWH1CsH7CnIhFnK2"){
    console.warn("Blocked unauthenticated salon data write");return Promise.resolve(false);
  }
  const cleanRecords=arr=>(arr||[]).map(({password,...record})=>record);
  const snapshot=JSON.parse(JSON.stringify({...db,clients:cleanRecords(db.clients),staff:cleanRecords(db.staff),session:null}));
  const tracked=Object.keys(snapshot).filter(key=>!['session','updatedAt','schemaVersion','invoices','invoiceStorageVersion','clientPackages'].includes(key));
  const stringify=value=>JSON.stringify(value===undefined?null:value);
  const startingBaseline=salonCloudBaseline;
  saveQueue=saveQueue.then(async()=>{
    // Reading the current server document prevents overwriting unrelated work from other tabs/devices.
    if(!firebaseReady||auth.currentUser?.uid!=="AvRinM2frzLkDWH1CsH7CnIhFnK2")throw Error('انتهت جلسة المالكة');
    const remoteSnapshot=await salonDoc.get({source:'server'});
    if(!remoteSnapshot.exists)throw Error('قاعدة الصالون غير موجودة في Firebase؛ لن نستبدلها ببيانات فارغة');
    const remote=remoteSnapshot.data()||{};
    const baseline=salonCloudBaseline||startingBaseline||remote;
    const patch={};
    for(const key of tracked){
      // Skip stale local values when this session did not edit them.
      if(stringify(snapshot[key])===stringify(baseline[key]))continue;
      // Skip values already written by live roster / other authorized writers.
      if(stringify(snapshot[key])===stringify(remote[key]))continue;
      patch[key]=snapshot[key];
    }
    if(!Object.keys(patch).length)return true;
    patch.updatedAt=new Date().toISOString();patch.schemaVersion=3;
    await salonDoc.set(patch,{merge:true});
    salonCloudBaseline={...baseline,...patch};
    return true;
  }).catch(err=>{console.error("Firestore save failed",err);toast("تعذر حفظ البيانات في Firebase: "+String(err.message||err));return false});
  return saveQueue;
}

async function salonManageClient(action,id){
 if(!firebaseReady||db.session?.type!=='owner'||auth.currentUser?.uid!=='AvRinM2frzLkDWH1CsH7CnIhFnK2'){toast('العملية مخصصة للمالكة فقط');return}
 if(!['delete','archive','restore'].includes(action))return;
 const local=[...(db.clients||[]),...salonClientsArchive()].find(x=>String(x.id)===String(id));
 if(!local){toast('العميلة غير موجودة؛ حدّثي الصفحة');return}
 if(action==='delete'&&!confirm('حذف سجل التجربة «'+local.name+'» من قائمة الصالون نهائيًا؟ لن تُحذف أي فواتير أو حسابات Firebase Authentication. سنفحص المعاملات أولًا.'))return;
 if(action==='archive'&&!confirm('أرشفة «'+local.name+'» وإخفاؤها من القوائم النشطة؟ يمكن استعادتها لاحقًا.'))return;
 if(action==='restore'&&!confirm('استعادة «'+local.name+'» إلى قائمة العميلات النشطات؟'))return;
 try{
  await saveQueue;
  // Check separate Firestore documents as well as old salonData/main arrays. Refuse when rules block verification.
  const portalBookings=action==='delete'||action==='archive'?await salonClientPortalBookingInfo(local):{any:false,upcoming:false};
  if(action==='archive'&&portalBookings.upcoming)throw Error('للعميلة حجز مستقبلي في بوابة الحجز؛ لا يمكن أرشفتها قبل إتمامه أو إلغائه');
  if(action==='delete'){
   if(portalBookings.any)throw Error('للعميلة حجوزات محفوظة في بوابة الحجز؛ لا يمكن حذف السجل نهائيًا');
   if((await salonClientLookupProfiles(local.phone)).length)throw Error('يوجد سجل مرتبط بهذا الرقم في clientProfiles. احذفي حساب التجربة القديم بشكل آمن من Firebase أولًا، ثم أعيدي المحاولة.');
   if(await salonClientInvoiceExists(local))throw Error('توجد فواتير محفوظة لهذا الرقم في salonInvoices؛ لا يمكن الحذف النهائي. استخدمي الأرشفة إن لم يبق رصيد أو حجز قائم.');
  }
  let updated=null;
  await firestore.runTransaction(async tx=>{
   const doc=await tx.get(salonDoc);if(!doc.exists)throw Error('مستند بيانات الصالون غير موجود');
   const remote=doc.data()||{},active=Array.isArray(remote.clients)?remote.clients:[],archive=Array.isArray(remote.clientArchive)?remote.clientArchive:[];
   const existing=(action==='restore'?archive:active.find(x=>String(x.id)===String(id))?active:archive).find(c=>String(c.id)===String(id));
   if(!existing)throw Error('السجل تغيّر من جهاز آخر، أعيدي تحميل القائمة');
   const report=salonClientReferenceReport(remote,existing);
   let clients=active.slice(),clientArchive=archive.slice();
   if(action==='delete'){
    if(report.points>0||report.hasHistory)throw Error('العميلة لها نقاط أو فواتير أو حجوزات أو سجل خدمات؛ لا يمكن حذفها نهائيًا');
    clients=clients.filter(x=>String(x.id)!==String(id));clientArchive=clientArchive.filter(x=>String(x.id)!==String(id));
   }else if(action==='archive'){
    if(report.points>0||report.activeCredits||report.futureBookings)throw Error('لا يمكن أرشفة عميلة لديها نقاط أو باقة فعالة أو حجز قادم؛ احتفظي بها نشطة');
    if(archive.some(x=>String(x.id)===String(id)))throw Error('العميلة مؤرشفة مسبقًا');
    clients=clients.filter(x=>String(x.id)!==String(id));clientArchive.push({...existing,archivedAt:new Date().toISOString()});
   }else{
    if(active.some(x=>String(x.id)===String(id)||salonClientMatchPhone(x.phone,existing.phone)))throw Error('الرقم مسجل في قائمة العميلات النشطات بالفعل');
    clientArchive=clientArchive.filter(x=>String(x.id)!==String(id));const {archivedAt,...rest}=existing;clients.push(rest);
   }
   updated={...remote,clients,clientArchive};tx.update(salonDoc,{clients,clientArchive,updatedAt:new Date().toISOString()});
  });
  db.clients=updated.clients;db.clientArchive=updated.clientArchive;salonCloudBaseline=updated;
  renderOwner('clients');toast(action==='delete'?'تم حذف سجل التجربة من Firestore':action==='archive'?'تمت أرشفة العميلة مع الاحتفاظ بسجلها':'تمت استعادة العميلة');
 }catch(err){toast('لم تُنفذ العملية: '+String(err.message||err));console.error('Client management operation blocked',err)}
}

   const previous=clients.find(c=>String(c.id)===String(before.clientId));

  }

  if(!target){

function invoiceEmployeeLabel(invoice){

 const key=String(invoice.staffId||invoice.employeeId||invoice.staffUid||'').trim();
 const current=(db.staff||[]).find(s=>key&&(String(s.id)===key||String(s.authUid||'')===key));
 const archives=db.staffArchive||{};
 const historic=key?(archives[key]||Object.values(archives).find(s=>String(s?.authUid||'')===key)):null;
 const booking=invoice.bookingId?(db.bookings||[]).find(b=>String(b.id)===String(invoice.bookingId)):null;
 const candidate=invoice.staffName||invoice.employeeName||current?.name||historic?.name||booking?.staffName||
  (booking?.staffId?(db.staff||[]).find(s=>String(s.id)===String(booking.staffId))?.name||archives[String(booking.staffId)]?.name:'');

function invoiceEmployeeRevenue(invoice,employeeId){

 const total=Number(invoice.total)||0;
 if(subtotal<=0){return rows.some(x=>String(x.staffId||invoice.staffId||'')===String(employeeId))?total:0;}
 return rows.reduce((sum,x)=>{
   const id=String(x.staffId||invoice.staffId||'');if(id!==String(employeeId))return sum;

 },0);

async function readAssistantImages(){

 btn.disabled=true;
 try{

  if(!window.Tesseract){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('تعذر تحميل مكتبة قراءة الصور'));document.head.appendChild(sc)})}

function parseAssistantInvoices(){
 assistantDraft=[];const lines=($('#assistantInput')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
 for(const line of lines){
  const parts=line.split(/[،,|؛;]/).map(x=>x.trim()).filter(Boolean), phone=(line.match(/(?:\+?966|0)5\d{8}/)||[])[0]||'';
  const services=activeServices().filter(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name))||(s.nameEn&&normalizeAssistant(line).includes(normalizeAssistant(s.nameEn))));
  const employee=activeStaff().find(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name)));
  const payment=/شبك|بطاق|مدى|card/i.test(line)?'card':/تحويل/.test(line)?'transfer':/نقد|كاش|cash/i.test(line)?'cash':'';
  let name=parts.find(x=>!/(?:\+?966|0)5\d{8}/.test(x)&&!services.some(s=>normalizeAssistant(x).includes(normalizeAssistant(s.name)))&&!/شبك|بطاق|مدى|تحويل|نقد|كاش|cash|card/i.test(x)&&(!employee||!normalizeAssistant(x).includes(normalizeAssistant(employee.name))))||'';
  if(!name&&parts.length)name=parts[0].replace(phone,'').trim();
  assistantDraft.push({name,phone,services:services.map(s=>s.id),staffId:employee?.id||'',payment:payment||'cash',date:today(),error:!name||!phone||!services.length});
 }
 renderAssistantPreview();
}

async function saveAssistantInvoices(){

 if(!assistantDraft.length)return;
 if(assistantDraft.some(r=>!r.name?.trim()||!/(?:\+?966|0)5\d{8}/.test(r.phone)||!r.services.length||!r.date)){
  toast('أكملي الاسم والجوال والخدمات والتاريخ لكل فاتورة');return;
 }
 if(!confirm('تأكيد إصدار '+assistantDraft.length+' فاتورة وحفظ كل واحدة بشكل مستقل؟'))return;
 let completed=0;

  for(const r of assistantDraft.slice()){
   let client=db.clients.find(c=>String(c.phone||'').replace(/\D/g,'')===r.phone.replace(/\D/g,''));
   const mode=client?'existing':'new';
   if(!client)client={id:uid('cl'),name:r.name,phone:r.phone,points:0,createdAt:new Date().toISOString()};
   const items=r.services.map(id=>{
    const svc=db.services.find(x=>x.id===id);if(!svc)throw Error('خدمة غير موجودة: '+id);
    return {serviceId:id,name:svc.name,price:Number(svc.price)||0,quantity:1,duration:Number(svc.duration)||30,
      lineTotal:Number(svc.price)||0,staffId:r.staffId||'',staffName:activeStaff().find(st=>String(st.id)===String(r.staffId))?.name||''};
   });
   const subtotal=items.reduce((sum,item)=>sum+item.lineTotal,0);
   const earned=items.reduce((sum,item)=>sum+Math.max(0,Math.floor(Number(db.services.find(s=>s.id===item.serviceId)?.loyaltyPoints)||0)),0);
   const record={id:uid('inv'),clientId:client.id,customerName:client.name,customerPhone:client.phone,
    staffId:r.staffId||'',staffName:activeStaff().find(st=>String(st.id)===String(r.staffId))?.name||'',
    items,serviceId:items[0].serviceId,serviceName:items.map(x=>x.name).join('، '),subtotal,
    discount:0,taxRate:0,tax:0,total:subtotal,payment:r.payment,pointsUsed:0,loyaltyDiscount:0,
    pointsAdded:earned,pointsEarned:earned,notes:'أدخلت من مساعد المالكة بعد المراجعة',date:r.date,createdAt:new Date().toISOString()};
   await salonSaveIndependentInvoice(record,client,mode);
   assistantDraft.shift();completed++;
  }
  renderOwner('invoices');toast('تم حفظ '+completed+' فاتورة مستقلة');
 }catch(error){console.error('Assistant invoice save',error);toast('حُفظت '+completed+' فاتورة؛ وتعذر حفظ البقية: '+String(error.message||error))}
}

 if(/^5\d{8}$/.test(digits))return '966'+digits;
 if(/^9665\d{8}$/.test(digits))return digits;
 if(/^009665\d{8}$/.test(digits))return digits.slice(2);

}

 if(!/^[a-z0-9._-]{3,32}$/.test(u))throw Error(lang==='ar'?'اسم الحساب 3-32 حرفًا إنجليزيًا أو رقمًا':'Username must be 3-32 Latin letters, digits or ._-');
 return u+'@staff.nailqualitysalon.app';
}
// The phone login is a backwards-compatible alias for accounts created here.
// Accounts created directly in Firebase Authentication may instead use a real email.
function salonClientAuthMessage(error,usingEmail){
 const code=String(error?.code||'');
 if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(code)){
  return lang==='en'
   ?(usingEmail?'The email or password is incorrect. Please contact the salon if you need help.':'Unable to sign in with these details. Please contact the salon if you need help.')
   :(usingEmail?'البريد أو كلمة المرور غير صحيحة. يرجى التواصل مع الصالون للمساعدة.':'تعذّر تسجيل الدخول بهذه البيانات. يرجى التواصل مع الصالون للمساعدة.');
 }
 if(code==='auth/email-already-in-use'||code==='salon/account-already-exists')return lang==='en'?'An account with this email already exists. Please sign in or reset your password. If you used phone login before, sign in with your existing mobile account.':'هذا البريد مستخدم بالفعل. سجّلي الدخول أو استعِيدي كلمة المرور. وإذا لديك حساب قديم برقم الجوال، ادخلي به أولًا واربطِي البريد من الإعدادات.';

// Salon contact is distinct from the developer's contact shown in the footer.
// The owner may change this number in Settings; the published catalog is used when already loaded.
function salonContactDigits(){
 const raw=String(portalCatalog?.settings?.whatsapp||db?.settings?.whatsapp||WA_NUMBER);
 const digits=raw.replace(/\D/g,'');
 if(/^05\d{8}$/.test(digits))return '966'+digits.slice(1);
 if(/^5\d{8}$/.test(digits))return '966'+digits;
 if(/^9665\d{8}$/.test(digits))return digits;
 return String(WA_NUMBER).replace(/\D/g,'');
}
function salonContactDisplay(){
 const digits=salonContactDigits();
 return /^9665\d{8}$/.test(digits)?'+966 '+digits.slice(3,5)+' '+digits.slice(5,8)+' '+digits.slice(8):'+'+digits;
}

// Owner can publish a limited catalog; private invoices and phone lists are never published.
async function publishPortalCatalog(){
 if(db.session?.type!=='owner'){toast('النشر متاح للمالكة فقط');return false;}
 try{
  const cleanText=v=>v==null?'':String(v);
  const cleanNumber=v=>Number.isFinite(Number(v))?Number(v):0;
  const services=(db.services||[]).filter(Boolean).map(s=>({
   id:cleanText(s.id),name:cleanText(s.name),nameEn:cleanText(s.nameEn),
   price:cleanNumber(s.price),duration:cleanNumber(s.duration)||30,
   active:s.active!==false,loyaltyPoints:cleanNumber(s.loyaltyPoints),
   imageUrl:cleanText(s.imageUrl||s.image||'')
  }));
  const staff=(db.staff||[]).filter(Boolean).map(s=>({
   id:cleanText(s.id),name:cleanText(s.name),active:s.active!==false,
   authUid:cleanText(s.authUid)
  }));
  const catalog={services,staff,settings:{
   redeemPoints:cleanNumber(db.settings?.redeemPoints)||50,
   redeemRiyals:cleanNumber(db.settings?.redeemRiyals)||10,
   homeServiceEnabled:db.settings?.homeServiceEnabled===true
  },publishedAt:firebase.firestore.FieldValue.serverTimestamp()};
  // Preserve other public catalog sections including packages, and publish current booking closure.
  catalog.bookingControl={acceptingBookings:db.settings?.onlineBookingOpen!==false,blocks:(db.blocks||[]).filter(b=>b?.date).map(b=>({date:String(b.date),staffId:String(b.staffId||'all'),fullDay:b.fullDay===true,startTime:String(b.startTime||'00:00'),endTime:String(b.endTime||'23:59')}))};
  await firestore.collection('portal').doc('catalog').set(catalog,{merge:true});
  toast('تم نشر '+services.length+' خدمة للعميلات بنجاح');
  return true;
 }catch(e){console.error('Catalog publish failed',e);toast('تعذر نشر الخدمات: '+(e.message||'خطأ غير معروف'));return false;}
}

function translateInterface(){

 const walk=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
 for(const n of nodes){if(n.parentElement?.closest('script,style'))continue;const v=n.nodeValue,trim=v.trim();if(!trim)continue;const target=lang==='en'?interfaceTranslations[trim]:reverse[trim];if(target&&target!==trim)n.nodeValue=v.replace(trim,target)}
 for(const el of app.querySelectorAll('input[placeholder],textarea[placeholder]')){const p=el.getAttribute('placeholder');const target=lang==='en'?interfaceTranslations[p]:reverse[p];if(target)el.setAttribute('placeholder',target)}
}
let translationPending=false;
const interfaceObserver=new MutationObserver(()=>{if(translationPending)return;translationPending=true;queueMicrotask(()=>{translationPending=false;translateInterface()})});
interfaceObserver.observe(document.getElementById('app'),{subtree:true,childList:true,characterData:true});
const previousApplyLang=applyLang;

 if(!user){firebaseReady=false;db.session=null;db=initialState();portalUser=null;portalRole='';portalBookings=[];salonClientPage='home';renderHome();return}
 try{
  if(user.uid==="AvRinM2frzLkDWH1CsH7CnIhFnK2"){
   const snap=await salonDoc.get();if(!salonAuthStillCurrent())return;firebaseReady=true;localStorage.removeItem(STORAGE_KEY);

   if(!salonAuthStillCurrent())return;

    if(salonAuthStillCurrent()&&db.session?.type==='owner'&&ownerActiveTab==='dashboard')renderOwner('dashboard');
   }).catch(err=>console.warn('Invoice initialization',err));
   return;
  }
  const client=await firestore.collection("clientProfiles").doc(user.uid).get();
   if(!salonAuthStillCurrent())return;
  if(loginInProgress)return;
  if(client.exists){if(!salonAuthStillCurrent())return;portalUser=client.data();portalRole="client";await loadPortalCatalog();if(auth.currentUser?.uid!==user.uid)return;try{await loadPortalBookings()}catch(err){console.warn('Bookings unavailable',err);portalBookings=[]}if(!salonAuthStillCurrent())return;renderPortalClient();return}
  // Check employees first: an employee must never be offered a client-profile recovery form.
  let employee;
  try{employee=await firestore.collection("employeeProfiles").doc(user.uid).get()}
  catch(checkError){console.warn('Employee lookup not allowed for this UID',checkError);employee={exists:false}}
  
  if(loginInProgress)return;
  if(employee.exists&&employee.data().active===true&&String(employee.data().email||'').trim().toLowerCase()===String(user.email||'').trim().toLowerCase()){if(auth.currentUser?.uid!==user.uid)return;portalUser=employee.data();portalRole="employee";await loadPortalCatalog();if(auth.currentUser?.uid!==user.uid)return;try{await loadPortalBookings()}catch(err){console.warn('Employee bookings unavailable',err);portalBookings=[];toast('تم الدخول، لكن تعذر جلب الحجوزات. تأكدي من نشر قواعد Firestore المرفقة.')}if(!salonAuthStillCurrent())return;renderPortalEmployee();return}
  if(loginInProgress)return;
  if(employee.exists&&employee.data().active===true&&String(employee.data().email||'').trim().toLowerCase()!==String(user.email||'').trim().toLowerCase()){
   toast('إيميل حساب Firebase لا يطابق الإيميل المرتبط بـ UID الموظفة. راجعي ربط الحساب من لوحة المالكة.');
   renderHome();return;
  }
  if(employee.exists){toast('هذا حساب موظفة. تأكدي من حالة الحساب وربط البريد، واستخدمي بوابة الموظفات.');renderHome();return}
  // An authenticated client may finish a profile whose first Firestore write failed.
  if((salonClientPhoneFromAuthEmail(user.email)||salonValidRecoveryEmail(user.email))&&auth.currentUser?.uid===user.uid){
   salonShowClientProfileRecovery(user);
   return;
  }
  toast("لم يُعثر على ملف الحساب بعد. أعيدي المحاولة بعد قليل أو سجّلي الدخول من جديد.");
 }catch(e){console.error(e);if(loginInProgress||!salonAuthStillCurrent())return;toast("تعذر تحميل الحساب. راجعي قواعد Firestore: "+e.message);if(!portalUser)renderHome()}
});

<script>

iv><div class="full"><h3>إظهار العبارات والإعلانات في</h3><div class="row">${[['client','العميلات'],['employee','الموظفات'],['owner','المالكة']].map(([k,v])=>`<label class="checkline"><input type="checkbox" name="audience_${k}" ${salonTheme.showFor[k]?'checked':''}>${v}</label>`).join('')}</div></div><div class="full theme-preview" id="salonThemePreview"><strong>معاينة التصميم</strong><p>هنا يظهر شكل الألوان والعبارات قبل النشر</p><button type="button" class="btn">زر تجريبي</button></div><div class="row full"><button type="button" class="btn secondary" id="themePreviewButton">معاينة</button><button type="button" class="btn outline" id="themeResetButton">استعادة التصميم الافتراضي</button><button type="submit" class="btn success">حفظ ونشر لجميع الأجهزة</button></div><div id="themeSaveStatus" class="full tiny" aria-live="polite"></div></form></div>`

function salonSendWhatsAppBooking(e){
 e.preventDefault();const f=new FormData(e.currentTarget),ids=f.getAll('services');
 const services=(portalCatalog.services||[]).filter(s=>ids.includes(String(s.id))&&s.active!==false);
 const staff=(portalCatalog.staff||[]).find(s=>String(s.id)===String(f.get('staff'))&&s.active!==false);
 const date=String(f.get('date')||''),time=String(f.get('time')||''),location=String(f.get('location')||'salon');
 const address=String(f.get('address')||'').trim(),notes=String(f.get('notes')||'').trim();
 if(!services.length||!staff||!date||!time){toast('اختاري الخدمة والموظفة والتاريخ والوقت');return}
 if(date<today()){toast('لا يمكن اختيار تاريخ سابق');return}
 if(location==='home'&&(portalCatalog.settings?.homeServiceEnabled!==true||!address)){toast('أدخلي عنوان الخدمة المنزلية');return}
 const duration=services.reduce((n,s)=>n+(Number(s.duration)||30),0);if(timeToMin(time)+duration>1440){toast('المدة تتجاوز نهاية اليوم');return}
 const points=Math.max(0,Number(portalUser.points)||0),threshold=Math.max(1,Number(portalCatalog.settings?.redeemPoints)||50),unit=Math.max(0,Number(portalCatalog.settings?.redeemRiyals)||10);
 const requested=!!f.get('redeem');if(requested&&points<threshold){toast('رصيد النقاط أقل من الحد الأدنى للاستبدال');return}
 const total=services.reduce((n,s)=>n+salonEffectivePrice(s.originalPrice??s.price,s.sale),0);
 const possibleDiscount=requested?Math.min(total,Math.floor(points/threshold)*unit):0;
 const requestNumber='QN-'+Date.now().toString(36).toUpperCase();

 '🌸 طلب حجز جديد — صالون جودة الأظافر',
 'رقم مرجع الطلب: '+requestNumber,
 'رقم الفاتورة: لم تصدر بعد (تصدر عند تأكيد الخدمة والدفع)',
 'اسم صاحبة الحجز: '+String(portalUser.name||'—'),
 'رقم جوال العميلة: '+String(portalUser.phone||'—'),
 'الخدمة / الخدمات: '+services.map(s=>s.name).join('، '),
 'الموظفة: '+staff.name,
 'التاريخ: '+date,
 'الوقت: '+time,
 'المدة الإجمالية: '+duration+' دقيقة',
 'مكان تقديم الخدمة: '+(location==='home'?'في المنزل':'داخل الصالون'),
 ...(location==='home'?['عنوان الخدمة المنزلية: '+address]:[]),
 'السعر قبل الخصم: '+money(total),
 'استخدام نقاط الولاء: '+(requested?'نعم — طلب استبدال':'لا'),
 'رصيد النقاط الظاهر: '+points,
 'الخصم المتوقع (بانتظار اعتماد الصالون): '+money(possibleDiscount),
 'المبلغ المتوقع بعد الخصم: '+money(Math.max(0,total-possibleDiscount)),
 'ملاحظات: '+(notes||'لا يوجد'),
 'الحالة: طلب حجز غير مؤكد — يرجى تأكيد الموعد والخصم ورقم الفاتورة من الصالون'
 ].join('\n');
 const number=String(portalCatalog.settings?.whatsapp||db.settings?.whatsapp||WA_NUMBER).replace(/\D/g,'');
 const url='https://wa.me/'+number+'?text='+encodeURIComponent(msg);
 const w=window.open(url,'_blank','noopener,noreferrer');if(!w)window.location.href=url;
 toast('تم تجهيز تفاصيل الطلب لواتساب. أرسلي الرسالة لتأكيد الطلب مع الصالون.');

 salonClientSearchRender();

 if(!form)return;

 if(!grid)return;
 const holder=document.createElement('div');holder.className='field full';holder.style.marginBottom='10px';

// Detect changes to the public employee roster and republish the safe catalog automatically.
let salonPublishedStaffSignature=JSON.stringify((db.staff||[]).map(s=>[s.id,s.name,s.active!==false,s.authUid||'']));
let salonStaffPublishTimer=null;
const salonStaffOriginalPersist=persist;
persist=function(){
 // Preserve the real Firestore write result for package/service/account editors.
 // The old wrapper discarded the Promise and falsely reported failed saves.
 const saveResult=salonStaffOriginalPersist();
 if(db.session?.type!=='owner'||auth.currentUser?.uid!=='AvRinM2frzLkDWH1CsH7CnIhFnK2')return saveResult;
 const signature=JSON.stringify((db.staff||[]).map(s=>[s.id,s.name,s.active!==false,s.authUid||'']));
 if(signature===salonPublishedStaffSignature)return saveResult;
 salonPublishedStaffSignature=signature;
 if(salonStaffPublishTimer)clearTimeout(salonStaffPublishTimer);
 salonStaffPublishTimer=setTimeout(async()=>{
  const saved=await saveResult;
  if(saved===false){toast('تعذر حفظ الموظفات؛ لن ننشر بيانات غير محفوظة');return}
  const ok=await publishPortalCatalog();
  if(!ok)toast('تعذر تحديث الموظفات للعميلات؛ استخدمي زر نشر الخدمات والموظفات');
 },800);
 return saveResult;
};

<script>
/* Quality Nail Salon: owner marketing, reversible offers, and employee deactivation. */
(function(){
'use strict';
const hasOwner=()=>db.session?.type==='owner' && auth.currentUser?.uid===firebaseConfigOwner();
function firebaseConfigOwner(){return 'AvRinM2frzLkDWH1CsH7CnIhFnK2'}
function discountPct(){return 0} // Replaced by time-limited offers per service.
function discounted(price){return Math.round((Number(price)||0)*(1-discountPct()/100)*100)/100}
function safePhone(raw){let p=String(raw||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0')&&p.length===10)p='966'+p.slice(1);if(p.startsWith('5')&&p.length===9)p='966'+p;return /^9665\d{8}$/.test(p)?p:''}
function lastVisit(c){const records=(db.invoices||[]).filter(i=>i.clientId===c.id||safePhone(i.customerPhone)===safePhone(c.phone)&&!!safePhone(c.phone));const dates=records.map(i=>String(i.date||i.createdAt||'').slice(0,10)).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();return dates.at(-1)||''}
function eligible(c,days){if(c.marketingConsent!==true||!safePhone(c.phone))return false;if(days===0)return true;const v=lastVisit(c);return v && (Date.now()-new Date(v+'T12:00:00').getTime())/86400000>=days}
function offerPanel(){return `<section class="card"><h2>الخصم الجماعي على الخدمات</h2><p class="muted">خصم موحد على جميع الخدمات المنشورة. السعر الأساسي محفوظ، ويمكن إلغاء الخصم في أي وقت. لا يغيّر الفواتير القديمة.</p><div class="form-grid"><div class="field"><label>نسبة الخصم %</label><input id="salonBulkPercent" type="number" min="0" max="100" step="1" value="${discountPct()}"></div><div class="field"><label>معاينة</label><div class="notice good">خدمة سعرها 100 ريال تصبح <strong id="salonBulkPreview">${money(discounted(100))}</strong></div></div><div class="row full"><button class="btn" type="button" id="salonBulkSave">تطبيق الخصم ونشر الأسعار</button><button class="btn secondary" type="button" id="salonBulkReset">إلغاء الخصم</button></div></div><p class="notice">تحديث الأسعار العامة يحتاج نجاح نشر الخدمات في Firebase. تحققي من النشر قبل الإعلان للعميلات.</p></section>`}
function marketingPanel(){return `<section class="card"><h2>رسائل العميلات والعروض (واتساب مجاني)</h2><p class="muted">رسائل جاهزة تُفتح عميلةً عميلةً، ولا تُرسل تلقائيًا. اختاري العميلات الموافقـات على العروض فقط.</p><div class="form-grid"><div class="field"><label>الفئة</label><select id="salonMarketingDays"><option value="0">جميع المشتركات في العروض</option><option value="30">لم تزُر منذ 30 يومًا</option><option value="60">لم تزُر منذ 60 يومًا</option><option value="90">لم تزُر منذ 90 يومًا</option></select></div><div class="field"><label>عدد المستهدفات</label><div class="notice good" id="salonMarketingCount"></div></div><div class="field full"><label>نص الرسالة</label><textarea id="salonMarketingMessage" rows="5">🌸 أهلًا بكِ من صالون جودة الأظافر! يسعدنا تقديم خصم 30% على خدمات الصالون لفترة محدودة. نتشرف بزيارتكِ 💗</textarea></div></div><div id="salonMarketingList" style="margin-top:14px"></div><p class="notice">مهم: الموافقة على الرسائل التسويقية لا تُفترض تلقائيًا. يجب تسجيل موافقة العميلة الفعلية وإتاحة إيقاف الرسائل. فتح واتساب لا يثبت إرسال الرسالة.</p></section>`}
const oldOwner=renderOwner;
renderOwner=function(tab=ownerActiveTab){oldOwner(tab);if(!hasOwner())return;
if(tab==='services'){
const container=document.createElement('div');container.style.marginBottom='14px';container.innerHTML=offerPanel();const main=$('#app');const cards=main.querySelector('.card');if(cards)cards.before(container);else main.append(container);

$('#salonBulkSave').onclick=()=>save(Number(field.value));$('#salonBulkReset').onclick=()=>save(0);
}

<script>
/* Booking bridge: save to Firestore first, then offer WhatsApp. */
(function(){
'use strict';
const bookingCollection=firestore.collection('portalBookings');
const adminPhone='966544267911';
const safeStr=v=>String(v??'');
function bookingWhatsApp(b,id){
 const message=['🌸 طلب حجز جديد — صالون جودة الأظافر','رقم الطلب: '+id,'العميلة: '+b.clientName,'الجوال: '+b.clientPhone,'الخدمات: '+b.serviceName,'الموظفة: '+b.staffName,'التاريخ: '+b.date,'الوقت: '+b.time,'المكان: '+(b.location==='home'?'منزل':'الصالون'),'السعر المبدئي: '+b.price+' ريال','العربون: لم يُدفع بعد','الحالة: بانتظار تأكيد الإدارة'].join('\n');
 return 'https://wa.me/'+adminPhone+'?text='+encodeURIComponent(message);
}
submitPortalBooking=async function(event){
 event.preventDefault();
 const form=event.currentTarget,button=form.querySelector('button[type="submit"]');
 if(!auth.currentUser||portalRole!=='client'||!portalUser){toast('سجّلي دخول العميلة أولًا');return}
 const data=new FormData(form),services=[];
 for(const item of (portalCatalog.services||[]).filter(x=>x.active!==false)){
  const qty=Number(data.get('serviceQty_'+item.id)||0);
  if(!Number.isInteger(qty)||qty<0||qty>10){toast('الحد الأقصى 10 مرات للخدمة الواحدة');return}
  for(let i=0;i<qty;i++)services.push(item);
 }
 const staff=(portalCatalog.staff||[]).find(x=>String(x.id)===String(data.get('staff'))&&x.active!==false);
 const date=safeStr(data.get('date')),time=safeStr(data.get('time')),location=safeStr(data.get('location')||'salon');
 const address=safeStr(data.get('address')).trim().slice(0,200),notes=safeStr(data.get('notes')).trim().slice(0,300);
 if(!services.length||!staff||!staff.authUid||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<today()||!/^\d{2}:\d{2}$/.test(time)){toast('اختاري خدمات وموظفة مربوطة بحساب Firebase والتاريخ والوقت الصحيح');return}
 if(location==='home'&&(!portalCatalog.settings?.homeServiceEnabled||!address)){toast('أدخلي عنوان الخدمة المنزلية');return}
 const duration=services.reduce((n,x)=>n+(Number(x.duration)||30),0);
 if(timeToMin(time)+duration>1440){toast('وقت الحجز يتجاوز نهاية اليوم');return}
 const price=services.reduce((n,x)=>n+salonEffectivePrice(x.originalPrice??x.price,x.sale),0);
 const record={clientUid:auth.currentUser.uid,clientName:safeStr(portalUser.nameAr||portalUser.name).slice(0,100),clientNameEn:safeStr(portalUser.nameEn||'').slice(0,70),clientPhone:safeStr(portalUser.phone).slice(0,20),staffUid:safeStr(staff.authUid||staff.id),staffName:safeStr(staff.name),serviceIds:services.map(x=>safeStr(x.id)),serviceName:services.map(x=>safeStr(x.name)).join('، ').slice(0,500),price,duration,date,time,location,address,notes,redeemRequested:data.get('redeem')==='on',status:'pending',depositStatus:'unpaid',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
 if(button)button.disabled=true;
 try{
  const ref=await bookingCollection.add(record);
  try{await loadPortalBookings()}catch(err){console.warn('Booking saved, list refresh failed',err)}
  salonClientPage='bookings';renderPortalClient();
  const url=bookingWhatsApp(record,ref.id);
  const notice=document.createElement('div');notice.className='card';notice.style.margin='12px 0';notice.innerHTML='<h3>✅ تم حفظ طلب الحجز لدى الإدارة</h3><p>رقم الطلب: '+esc(ref.id)+'</p><p>الحالة: بانتظار دفع العربون وتأكيد الصالون. يمكنك إرسال التفاصيل أيضًا عبر واتساب.</p>';
  const link=document.createElement('a');link.className='btn success';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='إرسال تفاصيل الحجز إلى واتساب الإدارة';notice.append(link);
  const target=document.querySelector('#salonClientPagePanel')||document.querySelector('#app');target.prepend(notice);
  toast('تم حفظ الحجز في Firebase بنجاح');
 }catch(err){console.error('Booking Firestore error',err);toast('لم يُحفظ الحجز: '+(err.code==='permission-denied'?'قواعد Firebase ترفض الطلب. تأكدي من نشر قواعد portalBookings.':err.message));}
 finally{if(button&&button.isConnected)button.disabled=false}
};
function ownerBookingCard(b){
 const id=esc(b.id),pending=b.status==='pending',closed=['cancelled','completed'].includes(b.status);
 return `<div class="card" style="margin:10px 0"><div class="spread"><b>${esc(b.clientName||'عميلة')} — ${esc(b.date)} ${esc(b.time)}</b>${statusBadge(b.status||'pending')}</div><p>${esc(b.serviceName||'')} — ${b.packageUseRequested?'🎁 طلب استخدام باقة «'+esc(b.packageName||'')+'» — مشمول بالرصيد':money(b.price)} — ${esc(b.staffName||'')}</p><p>الجوال: ${esc(b.clientPhone||'—')} · المكان: ${b.location==='home'?'منزل':'الصالون'} · ${b.packageUseRequested?'طلب من باقاتي — لا يتم الخصم إلا عند تسجيل الخدمة في الكاشير':('العربون: '+(b.depositStatus==='paid'?'مدفوع':'غير مدفوع'))}</p><p class="muted tiny">رقم الطلب: ${id}${b.notes?' · ملاحظات: '+esc(b.notes):''}</p><div class="row">${!closed?`<button class="btn success small" onclick="ownerConfirmSavedBooking('${id}')">${b.packageUseRequested?'تأكيد موعد الباقة':(pending?'تأكيد بعد العربون':'تحديث تأكيد العربون')}</button><button class="btn secondary small" onclick="ownerEditSavedBooking('${id}')">تعديل الحجز</button><button class="btn danger small" onclick="ownerCancelSavedBooking('${id}')">إلغاء</button>`:''}</div></div>`;
}
showPortalBookingsOwner=async function(){
 const host=document.querySelector('#portalBookingsOwner');if(!host)return;
 host.innerHTML='<p class="muted">جارٍ تحميل طلبات العميلات من Firebase…</p>';
 try{const snap=await bookingCollection.get();const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>safeStr(b.createdAt?.seconds||'').localeCompare(safeStr(a.createdAt?.seconds||'')));
  host.innerHTML=rows.length?rows.map(ownerBookingCard).join(''):'<div class="empty">لا توجد طلبات حجز في Firebase حتى الآن.</div>';
 }catch(err){host.textContent='تعذر تحميل الحجوزات: '+err.message}
};
window.ownerConfirmSavedBooking=async id=>{
 try{
  const ref=bookingCollection.doc(id),snapshot=await ref.get({source:'server'});
  if(!snapshot.exists)throw Error('الطلب غير موجود');
  const booking=snapshot.data();
  if(booking.packageUseRequested){
   const owned=await firestore.collection('clientPackageViews').doc(String(booking.clientUid)).get({source:'server'});
   const balance=(owned.data()?.balances||[]).find(x=>String(x.id)===String(booking.packageBalanceId));
   if(!balance||Number(balance.used||0)>=Number(balance.total||0)||(balance.expiresOn&&balance.expiresOn<today())||!(balance.eligibleServiceIds||[]).map(String).includes(String((booking.serviceIds||[])[0]))){
     throw Error('رصيد الباقة غير متاح أو غير مطابق؛ لا يمكن تأكيد موعدها');
   }
   if(!confirm('تأكيد موعد العميلة باستخدام باقتها؟ لن يُخصم الرصيد حتى تسجيل الخدمة في الكاشير.'))return;
   await ref.update({status:'confirmed',depositStatus:'not_required',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   await showPortalBookingsOwner();toast('تم تأكيد موعد الباقة دون تسجيل دفعة أو خصم رصيد');return;
  }
  if(!confirm('هل استلمتِ العربون وتريدين تأكيد الحجز؟'))return;
  await ref.update({status:'confirmed',depositStatus:'paid',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  await showPortalBookingsOwner();toast('تم تأكيد الحجز والعربون');
 }catch(err){toast('تعذر التأكيد: '+err.message)}
};
window.ownerCancelSavedBooking=async id=>{
 if(!confirm('هل تريدين إلغاء طلب الحجز؟'))return;
 try{await bookingCollection.doc(id).update({status:'cancelled',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await showPortalBookingsOwner();toast('تم إلغاء الطلب')}
 catch(err){toast('تعذر الإلغاء: '+err.message)}
};
window.ownerEditSavedBooking=async id=>{
 try{
  const ref=bookingCollection.doc(id),snap=await ref.get();if(!snap.exists){toast('الحجز غير موجود');return}
  const b=snap.data();const serviceName=prompt('الخدمة المطلوبة (اكتبي اسم الخدمة بعد التعديل)',b.serviceName||'');if(serviceName===null)return;
  const staffName=prompt('اسم الموظفة',b.staffName||'');if(staffName===null)return;
  const date=prompt('التاريخ YYYY-MM-DD',b.date||'');if(date===null)return;
  const time=prompt('الوقت HH:MM',b.time||'');if(time===null)return;
  if(!serviceName.trim()||!staffName.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time)){toast('راجعي الخدمة والموظفة والتاريخ والوقت');return}
  await ref.update({serviceName:serviceName.trim().slice(0,500),staffName:staffName.trim().slice(0,100),date,time,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await showPortalBookingsOwner();toast('تم تعديل الحجز');
 }catch(err){toast('تعذر تعديل الحجز: '+err.message)}
};
})();

window.ownerDeleteService=async id=>{
 if(!hasOwner())return;
 const service=db.services.find(s=>String(s.id)===String(id));if(!service)return;
 if(!confirm(`حذف خدمة «${service.name}» نهائيًا من قائمة الخدمات؟\nستبقى تفاصيل الحجوزات والفواتير السابقة كما هي.`))return;
 const backup=db.services.slice();db.services=db.services.filter(s=>String(s.id)!==String(id));
 try{const saved=await persist();if(saved===false)throw new Error('تعذر حفظ التغيير في Firebase');const published=await publishPortalCatalog();if(published===false)throw new Error('تعذر تحديث قائمة الخدمات المنشورة');renderOwner('services');toast('حُذفت الخدمة من الإدارة وبوابة العميلات')}
 catch(err){db.services=backup;const restored=await persist();renderOwner('services');toast('تعذر إكمال الحذف: '+err.message+(restored===false?' — يرجى مراجعة بيانات Firebase.':''))}
};
function addLoyaltySettings(){
 const content=document.querySelector('.owner-content');if(!content)return;
 const panel=document.createElement('section');panel.className='card';panel.innerHTML=`<h3>إعدادات استبدال نقاط الولاء</h3><div class="form-grid"><div class="field"><label>عدد النقاط المطلوبة للخصم</label><input id="redeemThreshold" type="number" min="1" step="1" value="${Number(db.settings.redeemPoints)||50}"></div><div class="field"><label>قيمة الخصم بالريال</label><input id="redeemValue" type="number" min="0.01" step="0.01" value="${Number(db.settings.redeemRiyals)||10}"></div><button class="btn full" type="button" onclick="saveLoyaltySettings()">حفظ إعدادات النقاط والخصم</button></div>`;
 content.prepend(panel);
}
function putBookingsFirst(){
 const content=document.querySelector('.owner-content'),panel=document.querySelector('#portalBookingsOwner');if(!content||!panel)return;
 const section=panel.closest('section');if(!section)return;
 section.classList.add('owner-portal-bookings');
 content.prepend(section);
 const heading=section.querySelector('.section-head h3');if(heading)heading.textContent='طلبات الحجز من العميلات — Firebase';
 const filters=document.createElement('div');filters.className='owner-bookings-filter';filters.innerHTML=[['all','كل الطلبات'],['pending','بانتظار العربون'],['confirmed','المؤكدة'],['cancelled','الملغاة']].map(([v,l])=>`<button type="button" data-booking-filter="${v}" class="${bookingFilter===v?'selected':''}">${l}</button>`).join('');
 section.insertBefore(filters,panel);
 filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{bookingFilter=b.dataset.bookingFilter;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));window.filterOwnerPortalBookings()});
}
window.filterOwnerPortalBookings=()=>{const panel=document.querySelector('#portalBookingsOwner');if(!panel)return;panel.querySelectorAll('[data-booking-status]').forEach(el=>el.classList.toggle('hidden',bookingFilter!=='all'&&el.dataset.bookingStatus!==bookingFilter))};
renderOwner=function(tab=ownerActiveTab){
 if(!hasOwner()){prior(tab);return}
 if(tab==='settingsHub'){
  ownerActiveTab=tab;document.querySelector('#app').innerHTML=ownerLayout(tab,settingsContent());changeOwnerAccent(ownerThemeColor());return;
 }
 prior(tab);
 if(!hasOwner())return;
 const app=document.querySelector('#app');
 // Extra modules originally replaced the owner shell. Re-house them without recreating their form handlers.
 if(!app.querySelector('.owner-shell')){
  const nodes=[...app.childNodes];app.innerHTML=ownerLayout(tab,'');const content=app.querySelector('.owner-content');nodes.forEach(n=>content.appendChild(n));
 }
 moveLooseContent();
 if(tab==='appointments')putBookingsFirst();
 if(tab==='services')relocateServices();
 if(tab==='loyaltyExt')addLoyaltySettings();
 const content=app.querySelector('.owner-content');
 if(tab==='dashboard')content?.querySelector('.owner-original-tools')?.remove();
 if(tab==='backup'){// backups now live in settings, preserve old deep links
  ownerActiveTab='settingsHub';app.innerHTML=ownerLayout('settingsHub',settingsContent('backup'));
 }
};
const oldShow=showPortalBookingsOwner;
showPortalBookingsOwner=async function(){
 await oldShow();
 const host=document.querySelector('#portalBookingsOwner');if(!host)return;
 host.querySelectorAll(':scope > .card').forEach(card=>{
  const label=card.querySelector('.badge')?.textContent.trim()||'';
  const status=label.includes('مؤكد')||label.toLowerCase().includes('confirmed')?'confirmed':label.includes('ملغ')||label.toLowerCase().includes('cancel')?'cancelled':'pending';
  card.dataset.bookingStatus=status;
 });
 window.filterOwnerPortalBookings();
};
})();

/* Daily workspace: historical records are never deleted. */
(function(){
 const bookingDate=b=>String(b.date||'').slice(0,10);
 const isOpen=b=>!['completed','cancelled','noShow','no-show'].includes(b.status);
 const invoiceDate=salonInvoiceLocalDate;
 let bookingView='active', historyDate=today(), portalCache=[];
 const legacyRender=renderOwner;
 const legacyChange=changeBooking;
 function ownerDailySummary(){
  const d=today(), bills=db.invoices.filter(i=>invoiceDate(i)===d), amount=bills.reduce((n,i)=>n+Number(i.total||0),0);
  const expenseToday=db.expenses.filter(e=>salonInvoiceLocalDate(e)===d).reduce((n,e)=>n+Number(e.amount||0),0);
  const local=db.bookings.filter(b=>bookingDate(b)===d&&isOpen(b));
  const kpis=document.querySelectorAll('.owner-kpi');
  if(kpis.length>=4){
    kpis[0].querySelector('strong').textContent=String(local.length+portalCache.filter(b=>bookingDate(b)===d&&isOpen(b)).length);
    kpis[1].querySelector('strong').textContent=money(amount);kpis[1].querySelector('small').textContent='مبيعات اليوم فقط';
    kpis[2].querySelector('strong').textContent=money(amount-expenseToday);kpis[2].querySelector('small').textContent='صافي اليوم التقديري';
    kpis[3].querySelector('strong').textContent=money(expenseToday);
    const label=kpis[3].querySelector('small');if(label)label.textContent='مصروفات اليوم فقط';
  }
  const recent=document.querySelector('.owner-mini-list');if(recent&&recent.closest('.owner-panel')?.textContent.includes('أحدث الفواتير'))recent.innerHTML=bills.slice(-5).reverse().map(i=>`<div><span>${esc(i.customerName||'عميلة')}</span><b>${money(i.total)}</b></div>`).join('')||'<p>لا توجد فواتير اليوم</p>';
 }
 function statusName(s){return ({pending:'بانتظار التأكيد',confirmed:'مؤكد',arrived:'وصلت العميلة',inProgress:'جارٍ تنفيذ الخدمة',completed:'تم تنفيذ الخدمة',cancelled:'ملغي',noShow:'لم تحضر'})[s]||s||'بانتظار التأكيد'}
 function relevant(b){const d=bookingDate(b);if(bookingView==='history')return d===historyDate;if(bookingView==='all')return true;return isOpen(b) || (d===today()&&b.status==='completed');}
 function actionButtons(b,portal){if(!isOpen(b))return '';
  const fn=portal?'dailyPortalStatus':'dailyLocalStatus',id=JSON.stringify(String(b.id));
  return `<div class="row" style="margin-top:9px">${b.status==='pending'?`<button class="btn secondary small" onclick='${fn}(${id},"confirmed")'>تأكيد الحجز</button>`:''}${['pending','confirmed'].includes(b.status)?`<button class="btn secondary small" onclick='${fn}(${id},"arrived")'>وصلت العميلة</button>`:''}${b.status==='arrived'?`<button class="btn secondary small" onclick='${fn}(${id},"inProgress")'>بدء الخدمة</button>`:''}${['arrived','inProgress'].includes(b.status)?`<button class="btn success small" onclick='${fn}(${id},"completed")'>تم تنفيذ الخدمة</button>`:''}<button class="btn danger small" onclick='${fn}(${id},"noShow")'>لم تحضر</button></div>`;
 }
 function renderBookingRows(){const target=document.querySelector('#dailyBookingRows');if(!target)return;
  const local=db.bookings.filter(relevant).map(b=>({b,portal:false})),remote=portalCache.filter(relevant).map(b=>({b,portal:true}));
  const rows=[...local,...remote].sort((x,y)=>(x.b.date+x.b.time).localeCompare(y.b.date+y.b.time));
  target.innerHTML=rows.map(({b,portal})=>`<div class="card" style="margin:10px 0"><div class="spread"><strong>${esc(b.customerName||b.clientName||clientName(b.clientId)||'عميلة')} — ${esc(b.date||'')} ${esc(b.time||'')}</strong><span class="badge">${esc(statusName(b.status))}</span></div><p>${esc(b.serviceName||serviceName(b.serviceId))} · ${esc(b.staffName||staffName(b.staffId))} · ${portal?'حجز بوابة العميلات':'حجز الإدارة'}</p>${actionButtons(b,portal)}</div>`).join('')||'<div class="empty">لا توجد حجوزات مطابقة</div>';
 }
 async function loadDailyBookings(){const host=document.querySelector('#dailyBookingRows');if(!host)return;try{const snap=await firestore.collection('portalBookings').get();portalCache=snap.docs.map(d=>({id:d.id,...d.data()}));renderBookingRows();}catch(e){renderBookingRows();const note=document.querySelector('#dailyBookingNotice');if(note)note.textContent='تعذر تحميل حجوزات بوابة العميلات: '+e.message;}}
 window.dailyBookingView=(mode)=>{bookingView=mode;document.querySelectorAll('[data-daily-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.dailyMode===mode));const date=document.querySelector('#dailyHistoryDate');if(date)date.hidden=mode!=='history';renderBookingRows()};
 window.dailyHistoryDate=v=>{historyDate=v;renderBookingRows()};
 window.dailyLocalStatus=(id,status)=>{const b=db.bookings.find(x=>String(x.id)===String(id));if(!b||!hasOwner())return;if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز إلى: '+statusName(status)+'؟'))return;legacyChange(id,status);renderBookingRows()};
 window.dailyPortalStatus=async(id,status)=>{if(!hasOwner())return;if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز إلى: '+statusName(status)+'؟'))return;try{await firestore.collection('portalBookings').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),...(status==='completed'?{completedAt:firebase.firestore.FieldValue.serverTimestamp()}:{})});await loadDailyBookings();toast('تم حفظ حالة الحجز')}catch(e){toast('تعذر حفظ الحالة: '+e.message)}};
 function dailyAppointments(){return `<div class="card"><h2>الحجوزات والمواعيد</h2><p class="muted">تظهر حجوزات اليوم والقادمة والمعلقة حتى تؤكد الموظفة إتمام الخدمة. لا تُحذف السجلات عند نهاية اليوم.</p><div class="row" style="margin:12px 0;flex-wrap:wrap"><button class="btn secondary small" data-daily-mode="active" onclick="dailyBookingView('active')">الحجوزات النشطة والقادمة</button><button class="btn secondary small" data-daily-mode="history" onclick="dailyBookingView('history')">البحث بالتاريخ</button><button class="btn secondary small" data-daily-mode="all" onclick="dailyBookingView('all')">كل السجلات</button><input id="dailyHistoryDate" type="date" value="${historyDate}" hidden onchange="dailyHistoryDate(this.value)"><button class="btn secondary small" onclick="ownerTab('appointments')">تحديث</button></div><div id="dailyBookingNotice" class="muted"></div><div id="dailyBookingRows"></div></div>`}
 function dailyInvoices(){const d=today(),list=db.invoices.filter(i=>invoiceDate(i)===d),total=list.reduce((n,i)=>n+Number(i.total||0),0);return `<div class="card"><h2>فواتير اليوم</h2><p class="muted">كل يوم يبدأ عرض جديد تلقائيًا، والفواتير السابقة محفوظة ويمكن الرجوع إليها بالتاريخ.</p><div class="stats"><div class="stat"><span>عدد فواتير اليوم</span><strong>${list.length}</strong></div><div class="stat"><span>مبيعات اليوم</span><strong>${money(total)}</strong></div></div><div class="row" style="margin:12px 0;flex-wrap:wrap"><label>من <input type="date" id="dailyInvoiceFrom" value="${d}"></label><label>إلى <input type="date" id="dailyInvoiceTo" value="${d}"></label><button class="btn secondary small" onclick="dailyInvoiceSearch()">بحث بالتاريخ</button><button class="btn secondary small" onclick="dailyInvoiceToday()">اليوم</button></div><div id="dailyInvoiceCount" class="muted">${list.length} فاتورة</div><div id="dailyInvoiceTable">${invoiceTable(list)}</div></div>`}
 window.dailyInvoiceSearch=()=>{const a=document.querySelector('#dailyInvoiceFrom')?.value||'',b=document.querySelector('#dailyInvoiceTo')?.value||'';if(a&&b&&a>b){toast('تاريخ البداية بعد النهاية');return}const list=db.invoices.filter(i=>(!a||invoiceDate(i)>=a)&&(!b||invoiceDate(i)<=b));document.querySelector('#dailyInvoiceTable').innerHTML=invoiceTable(list);document.querySelector('#dailyInvoiceCount').textContent=list.length+' فاتورة'};
 window.dailyInvoiceToday=()=>{document.querySelector('#dailyInvoiceFrom').value=today();document.querySelector('#dailyInvoiceTo').value=today();window.dailyInvoiceSearch()};
 renderOwner=function(tab=ownerActiveTab){
  legacyRender(tab);
  if(!hasOwner())return;
  const content=document.querySelector('.owner-content');if(!content)return;
  if(tab==='appointments'){content.innerHTML=dailyAppointments();bookingView='active';loadDailyBookings();}
  if(tab==='invoices')content.innerHTML=dailyInvoices();
  if(tab==='dashboard'){ownerDailySummary();firestore.collection('portalBookings').get().then(s=>{portalCache=s.docs.map(d=>({id:d.id,...d.data()}));if(ownerActiveTab==='dashboard')ownerDailySummary()}).catch(()=>{});}
 };
})();
</script>

<style id="owner-final-navigation-style">
.owner-sidebar{position:sticky!important;top:0!important;height:100dvh!important;max-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain}
.owner-menu{overflow:visible!important;flex:0 0 auto}
.owner-menu button{min-height:42px}
@media(max-width:700px){.owner-shell{display:grid!important;grid-template-columns:76px minmax(0,1fr)!important}.owner-sidebar{width:76px!important;position:sticky!important;top:0!important;height:100dvh!important;max-height:100dvh!important}.owner-menu{display:flex!important;flex-direction:column!important;overflow:visible!important;white-space:normal!important}.owner-menu button{width:100%!important;min-width:0!important}.owner-menu button span:not(.owner-menu-icon){display:none!important}.owner-main{min-width:0!important}}
</style>
<script>
(function(){
 'use strict';
 // Older extensions append their navigation below #app. Relocate only genuine panels,
 // and discard the duplicate strip (without removing any Firebase-backed records).
 function tidyOwnerNavigation(){
  if(typeof hasOwner!=='function'||!hasOwner())return;
  const app=document.getElementById('app');if(!app)return;
  const shell=app.querySelector(':scope > .owner-shell');
  if(!shell)return;
  const content=shell.querySelector('.owner-content');if(!content)return;
  for(const child of [...app.children]){
   if(child===shell)continue;
   const heading=child.querySelector('h3,h2');
   if(heading&&heading.textContent.trim()==='وحدات الإدارة الإضافية'){child.remove();continue}
   if(child.tagName==='BUTTON'&&child.textContent.includes('تخصيص التصميم')){child.remove();continue}
   content.appendChild(child);
  }
  // Remove obsolete navigation wherever a previous patch placed it.
  for(const el of [...content.querySelectorAll('.card')]){
   const heading=el.querySelector(':scope > h3,:scope > h2');
   if(heading?.textContent.trim()==='وحدات الإدارة الإضافية')el.remove();
  }
  for(const el of [...content.querySelectorAll('button')]){
   if(el.textContent.trim()==='🎨 تخصيص التصميم' && el.parentElement===content)el.remove();
  }
 }
 const before=window.renderOwner;
 window.renderOwner=function(tab){
  const result=before.apply(this,arguments);
  tidyOwnerNavigation();
  return result;
 };
 const app=document.getElementById('app');
 if(app){
  let active=false;
  new MutationObserver(()=>{
   if(active)return;
   active=true;
   try{tidyOwnerNavigation()}finally{active=false}
  }).observe(app,{childList:true,subtree:false});
 }
 tidyOwnerNavigation();
})();
</script>

function refreshSidebarSalonLogo(){const img=document.querySelector('.salon-side-logo img');if(img){const v=String(salonTheme?.logo||'');img.src=/^(https:\/\/|data:image\/)/.test(v)?v:SALON_DEFAULT_LOGO}}
const previousApplySalonTheme=applySalonTheme;
applySalonTheme=function(v){previousApplySalonTheme(v);refreshSidebarSalonLogo()};
const previousOwnerLayout=ownerLayout;
ownerLayout=function(tab,content){const result=previousOwnerLayout(tab,content);return result};
const previousRenderPortalClient=renderPortalClient;
renderPortalClient=function(){previousRenderPortalClient();const form=document.querySelector('#portalBooking');if(!form)return;
 const recalc=()=>{let count=0,price=0,duration=0;for(const item of portalCatalog.services||[]){const qty=Number(form.elements.namedItem('serviceQty_'+item.id)?.value||0);if(qty>0){count+=qty;price+=qty*salonEffectivePrice(item.originalPrice??item.price,item.sale);duration+=qty*Number(item.duration||30)}}const el=document.querySelector('#portalQuantitySummary');if(el)el.textContent='عدد الخدمات: '+count+' — الإجمالي: '+money(price)+' — المدة: '+duration+' دقيقة'};
 form.querySelectorAll('input[type=number][name^=serviceQty_]').forEach(input=>input.addEventListener('input',recalc));recalc();
};
/* Upload logo using the existing theme save button, without changing Firestore schema. */
document.addEventListener('submit',async e=>{
 const form=e.target;if(!form||!form.querySelector('input[name="logoFile"]'))return;
 const file=form.querySelector('input[name="logoFile"]').files?.[0];if(!file)return;
 e.preventDefault();e.stopImmediatePropagation();
 try{toast('جارٍ رفع الشعار...');const url=await uploadSalonImage(file,'logo');const data=new FormData(form);data.set('logo',url);const urlInput=form.querySelector('input[name="logo"]');if(urlInput)urlInput.value=url;
 // Resubmit to existing theme handler after successful upload.
 form.querySelector('input[name="logoFile"]').value='';form.requestSubmit();
 }catch(err){toast('تعذر رفع الشعار: '+err.message)}
},true);
</script>

<!-- Stabilization: make catalog publishing verifiable, client refreshable, and remove obsolete panels. -->
<style>
#salonClientRefreshCatalog{margin:10px 0;max-width:100%}
#salonClientCatalogWarning{margin:12px 0}
</style>
<script>
(function(){
 'use strict';
 const publishBeforeVerify=publishPortalCatalog;
 publishPortalCatalog=async function(){
  if(typeof hasOwner!=='function'||!hasOwner()){toast('النشر متاح للمالكة فقط');return false}
  const result=await publishBeforeVerify();
  if(!result)return false;
  try{
   // Read back the public document, not just the local salon state.
   const snap=await firestore.collection('portal').doc('catalog').get({source:'server'});
   const data=snap.exists?snap.data():null;
   const expected=(db.services||[]).filter(x=>x&&x.active!==false).length;
   const actual=(data?.services||[]).filter(x=>x.active!==false).length;
   if(!data||actual!==expected){toast('تنبيه: عدد الخدمات المنشورة لا يطابق الإدارة ('+actual+' من '+expected+'). أعيدي النشر أو افحصي الصلاحيات.');return false}

/* Unified searchable service picker and shopping basket. The original quantity

(function(){
 const beforeBasketRender=renderPortalClient;
 renderPortalClient=function(){
  beforeBasketRender.apply(this,arguments);
  if(portalRole!=='client')return;
  const form=document.querySelector('#portalBooking');if(!form)return;
  const grid=form.querySelector('.service-grid');if(!grid)return;

  document.querySelectorAll('#app .card').forEach(card=>{
   if(card!==form.closest('.card') && card.querySelector('#portalServiceCards'))card.remove();
  });
  const oldSearch=document.querySelector('#salonBookingServiceSearch')?.closest('.field');
  if(oldSearch)oldSearch.remove();

   field.max='10';field.min='0';field.value='0';field.required=false;
  }

  area.innerHTML=`<label for="salonCartSearch">ابحثي عن الخدمة وأضيفيها للسلة</label>
   <input type="search" id="salonCartSearch" autocomplete="off" placeholder="مثلاً: بدكير أو جل أو رموش" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:12px">
   <div id="salonCartResults" class="service-grid" style="margin-top:10px"></div>
   <p id="salonCartSearchHint" class="muted tiny">اكتبي اسم الخدمة لتظهر الخيارات.</p>`;
  grid.before(area);
  const advertised=all.filter(s=>!s.isPackage&&salonOfferIsActive(s.sale)).slice(0,16);
  if(advertised.length){
   const promos=document.createElement('section');promos.className='salon-visible-deals';promos.setAttribute('aria-label','الخدمات المخفضة');
   const head=document.createElement('h3');head.textContent='✦ عروض الخدمات الحالية';promos.append(head);
   const list=document.createElement('div');list.className='salon-visible-deals-list';promos.append(list);
   advertised.forEach(item=>{
    const card=document.createElement('button');card.type='button';card.className='salon-visible-deal-card';
    const occasion=document.createElement('span');occasion.className='salon-promo-occasion';occasion.textContent=String(item.sale?.occasion||'عرض خاص');card.append(occasion);
    const title=document.createElement('strong');title.textContent=lang==='en'?(item.nameEn||item.name):item.name;card.append(title);
    const prices=document.createElement('span');const original=document.createElement('s');original.textContent=money(item.originalPrice??item.price);const current=document.createElement('b');current.textContent=money(salonEffectivePrice(item.originalPrice??item.price,item.sale));prices.append(original,' ← ',current);card.append(prices);
    const badge=document.createElement('small');badge.textContent='خصم '+Number(item.sale.percent)+'% · اضغطي لاختيار الخدمة';card.append(badge);
    card.addEventListener('click',()=>{search.value=item.name||item.nameEn||'';search.dispatchEvent(new Event('input',{bubbles:true}));search.focus({preventScroll:true})});
    list.append(card);
   });
   area.before(promos);
  }
  const cart=document.createElement('div');cart.id='salonBookingCart';cart.className='field full card';
  cart.style.margin='10px 0';
  const summary=form.querySelector('#portalQuantitySummary');
  (summary||form.querySelector('button[type="submit"]')).before(cart);
  const search=area.querySelector('#salonCartSearch');
  const results=area.querySelector('#salonCartResults');
  const hint=area.querySelector('#salonCartSearchHint');
  const normal=v=>String(v||'').toLocaleLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
  const fieldOf=item=>Array.from(grid.querySelectorAll('input[name^="serviceQty_"]')).find(el=>el.name==='serviceQty_'+item.id);
  const qty=item=>Math.max(0,Number(fieldOf(item)?.value||0));
  const total=()=>all.reduce((n,x)=>n+qty(x),0);
  const change=(item,delta)=>{
   const el=fieldOf(item);if(!el)return;
   const next=qty(item)+delta;
   if(next<0||next>10){toast('الحد الأقصى 10 مرات للخدمة الواحدة');return}
   el.value=String(next);el.dispatchEvent(new Event('input',{bubbles:true}));
   drawResults();drawCart();
  };
  function drawResults(){
   results.replaceChildren();const q=normal(search.value);
   if(!q){hint.textContent='اكتبي اسم الخدمة لتظهر الخيارات.';return}
   const matches=all.filter(x=>normal((x.name||'')+' '+(x.nameEn||'')).includes(q)).slice(0,15);
   hint.textContent=matches.length?'اضغطي إضافة لإرسال الخدمة إلى سلة الحجز.':'لا توجد خدمات مطابقة.';
   matches.forEach(item=>{
    const line=document.createElement('div');line.className='service';line.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px';
    const title=document.createElement('div');
     const activePromo=salonOfferIsActive(item.sale);
     if(activePromo&&String(item.sale.occasion||'').trim()){const occasion=document.createElement('div');occasion.className='salon-promo-occasion';occasion.textContent='✦ '+String(item.sale.occasion).trim();title.append(occasion)}
     const name=document.createElement('strong');name.textContent=lang==='en'?(item.nameEn||item.name):item.name;title.append(name);
     if(activePromo){const badge=document.createElement('span');badge.className='salon-promo-badge';badge.textContent=(lang==='en'?'SALE ':'خصم ')+Number(item.sale.percent)+'%';title.append(' ',badge);
       const price=document.createElement('div');price.innerHTML='<s class="muted">'+money(item.originalPrice)+'</s> <b>'+money(salonEffectivePrice(item.originalPrice,item.sale))+'</b>';title.append(price);
     }else{const price=document.createElement('div');price.textContent=money(salonEffectivePrice(item.originalPrice??item.price,item.sale));title.append(price)}
     const time=document.createElement('small');time.textContent=' ('+(Number(item.duration)||30)+' '+(lang==='en'?'min':'دقيقة')+')';title.append(time);
    const add=document.createElement('button');add.type='button';add.className='btn';add.textContent='إضافة +';add.disabled=qty(item)>=10;add.onclick=()=>change(item,1);
    line.append(title,add);results.append(line);
   });
  }
  function drawCart(){
   cart.replaceChildren();const h=document.createElement('h3');h.textContent='🛍️ سلة خدمات الحجز';cart.append(h);
   let price=0,duration=0;const selected=all.filter(x=>qty(x)>0);
   if(!selected.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='السلة فارغة. ابحثي عن خدمة وأضيفيها.';cart.append(empty)}
   selected.forEach(item=>{
    const count=qty(item);price+=count*salonEffectivePrice(item.originalPrice??item.price,item.sale);duration+=count*(Number(item.duration)||30);
    const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)';
    const name=document.createElement('span');const unit=salonEffectivePrice(item.originalPrice??item.price,item.sale);name.textContent=(lang==='en'?(item.nameEn||item.name):item.name)+' ×'+count+' — '+money(unit*count);if(salonOfferIsActive(item.sale)){const mark=document.createElement('span');mark.className='salon-promo-badge';mark.textContent=' '+(lang==='en'?'SALE ':'خصم ')+Number(item.sale.percent)+'%';name.append(mark);if(String(item.sale.occasion||'').trim()){const caption=document.createElement('small');caption.className='salon-promo-cart-occasion';caption.textContent=' — '+String(item.sale.occasion).trim();name.append(caption)}}
    const controls=document.createElement('span');controls.style.cssText='display:flex;align-items:center;gap:10px';
    const minus=document.createElement('button');minus.type='button';minus.className='btn secondary';minus.textContent='−';minus.onclick=()=>change(item,-1);
    const n=document.createElement('strong');n.textContent=String(count);
    const plus=document.createElement('button');plus.type='button';plus.className='btn secondary';plus.textContent='+';plus.disabled=qty(item)>=10;plus.onclick=()=>change(item,1);
    controls.append(minus,n,plus);row.append(name,controls);cart.append(row);
   });
   const foot=document.createElement('p');foot.style.fontWeight='bold';foot.textContent='إجمالي عدد الخدمات: '+total()+' (الحد 10 لكل خدمة) — الإجمالي: '+money(price)+' — المدة: '+duration+' دقيقة';cart.append(foot);
   if(summary)summary.textContent='اختاري الموظفة والتاريخ والوقت بعد إضافة الخدمات إلى السلة.';
  }
  search.addEventListener('input',drawResults);
  const oldSubmit=form.onsubmit;
  form.onsubmit=function(e){
   const n=total();if(n<1){e.preventDefault();toast('أضيفي خدمة واحدة على الأقل إلى السلة');return false}
   if(typeof oldSubmit==='function')return oldSubmit.call(this,e);
  };
  drawResults();drawCart();
 };
})();

<script>
/* All bookings are read from portalBookings; employee UID is the sole scope. */
(function(){
'use strict';
const bookingRef=firestore.collection('portalBookings');

const ownerUid='AvRinM2frzLkDWH1CsH7CnIhFnK2';
let watchUid=null, stopWatch=null, bookingIssue='';
const myUid=()=>auth.currentUser?.uid||'';
const ownerVerified=()=>db.session?.type==='owner'&&firebaseReady&&myUid()===ownerUid;
const employeeVerified=()=>portalRole==='employee'&&portalUser?.active===true&&myUid()!=='';
const statusNames={pending:'بانتظار تأكيد المالكة',confirmed:'تم تأكيد الحجز',arrived:'وصلت العميلة',inProgress:'بدأت الخدمة',started:'بدأت الخدمة',completed:'تم الانتهاء',cancelled:'ملغي',noShow:'لم تحضر'};
function stopEmployeeListener(){if(stopWatch){try{stopWatch()}catch(e){console.warn(e)}stopWatch=null}watchUid=null;}
const legacyClear=clearSession;
clearSession=async function(){stopEmployeeListener();return legacyClear()};
loadPortalBookings=async function(){
 const account=myUid();if(!account){portalBookings=[];return portalBookings}
 if(portalRole!=='employee'&&portalRole!=='client'){portalBookings=[];return portalBookings}
 const field=portalRole==='employee'?'staffUid':'clientUid';
 const snap=await bookingRef.where(field,'==',account).get();
 portalBookings=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
 bookingIssue='';return portalBookings;
};
function watchEmployeeBookings(){
 const account=myUid();if(!employeeVerified()||!account)return;
 if(watchUid===account&&stopWatch)return;
 stopEmployeeListener();watchUid=account;
 stopWatch=bookingRef.where('staffUid','==',account).onSnapshot(snapshot=>{
  if(portalRole!=='employee'||myUid()!==account){stopEmployeeListener();return}
  const list=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
  portalBookings=list;bookingIssue='';
  const current=document.getElementById('employeeBookingBoard');
  if(current&&document.activeElement?.closest('#employeeRequestForm'))return;
  renderPortalEmployee();
 },error=>{
  bookingIssue=error.code==='permission-denied'?'يجب نشر قواعد Firestore المرفقة للسماح للموظفة بعرض حجوزاتها.':String(error.message||error);
  const el=document.getElementById('employeeBookingError');if(el)el.textContent=bookingIssue;
  stopEmployeeListener();
 });
}
renderPortalEmployee=function(){
 applyLang();document.querySelector('#homeBtn')?.classList.remove('hidden');

 };

 document.querySelector('#app').innerHTML=`${headerPanel(t('employeePortal'),p.name||'')}
  <section id="employeeBookingBoard"><div class="stats"><div class="stat"><span>${tr('حجوزات اليوم',"Today's bookings")}</span><strong>${todays.length}</strong></div><div class="stat"><span>${tr('الحجوزات النشطة','Active bookings')}</span><strong>${myBookings.filter(b=>!['completed','cancelled','noShow'].includes(b.status)).length}</strong></div>${rights.ownSalary===true?`<div class="stat"><span>${tr('الراتب','Salary')}</span><strong>${p.salaryVisible===true?money(p.salary):tr('غير محدد','Not set')}</strong></div>`:''}</div>

 root.querySelector('#employeeLogout').onclick=clearSession;
 const f=root.querySelector('#employeeRequestForm');if(f)f.onsubmit=async e=>{
  e.preventDefault();const d=new FormData(f),btn=f.querySelector('button[type=submit]');btn.disabled=true;

 };

window.ownerEditSavedBooking=async function(id){
 if(!ownerVerified())return;
 try{

  const time=prompt('الوقت HH:MM',b.time||'');if(time===null)return;
  if(!service.trim()||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)||!/^[0-9]{2}:[0-9]{2}$/.test(time))throw Error('تحققي من الخدمة والتاريخ والوقت');
  await ref.update({serviceName:service.trim().slice(0,500),staffName:matching[0].name,staffUid:matching[0].authUid,date,time,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});

 }catch(err){toast('تعذر تعديل الحجز: '+String(err.message||err))}
};
// Edit, suspend/reactivate and retire employee accounts without deleting Authentication identities.
const lastOwnerRender=renderOwner;
renderOwner=function(tab=ownerActiveTab){
 lastOwnerRender(tab);
 if(tab!=='staff'||!ownerVerified())return;
 const host=document.querySelector('#app .owner-content')||document.querySelector('#app');
 const section=document.createElement('section');section.className='card';section.style.margin='14px 0';
 section.innerHTML='<div class="spread"><h3>تعديل وإيقاف حساب الموظفة</h3><button type="button" class="btn secondary small" id="refreshEmployeeAccountPanel">تحديث</button></div><p class="muted tiny">التعديل والإيقاف مجانيان في Firestore. إيقاف الحساب يمنع دخول بوابة الموظفة ويخفيها عن حجز العميلات. حذف حساب Authentication النهائي يتم يدويًا من Firebase.</p><div id="employeeAccountEditorList">جارٍ تحميل الحسابات…</div>';
 host.prepend(section);
 const load=async()=>{
  const root=section.querySelector('#employeeAccountEditorList');if(!root?.isConnected)return;
  try{
   const snapshot=await profilesRef.get();const profiles=snapshot.docs.filter(d=>d.data().archived!==true);
   root.innerHTML=profiles.length?profiles.map(d=>{
    const p=d.data(),s=(db.staff||[]).find(x=>x.authUid===d.id||x.id===p.staffId);
    return `<div class="employee-account-card" data-account="${esc(d.id)}"><div class="spread"><div><b>${esc(p.name||s?.name||'موظفة')}</b><p class="muted tiny" dir="ltr">${esc(p.email||'')} | UID: ${esc(d.id)}</p></div><span class="badge ${p.active===true?'green':'red'}">${p.active===true?'مفعلة':'موقوفة'}</span></div>
     <div class="row"><button type="button" class="btn secondary small" data-account-action="edit">تعديل الحساب</button><button type="button" class="btn ${p.active===true?'danger':'success'} small" data-account-action="toggle">${p.active===true?'إيقاف الحساب':'إعادة التفعيل'}</button><button type="button" class="btn danger small" data-account-action="retire">حذف من قوائم الصالون</button></div>
     <form class="form-grid hidden" data-employee-edit><div class="field"><label>اسم الموظفة</label><input name="name" value="${esc(p.name||s?.name||'')}" maxlength="80" required></div><div class="field"><label>الإيميل المسجل في Authentication</label><input name="email" type="email" dir="ltr" value="${esc(p.email||'')}" required></div><div class="field"><label>رقم الجوال</label><input name="phone" type="tel" value="${esc(s?.phone||'')}" maxlength="20"></div><div class="row full"><button type="submit" class="btn">حفظ التعديل</button></div></form></div>`;
   }).join(''):'<p class="empty">لا توجد حسابات موظفات مرتبطة</p>';
  }catch(e){root.textContent='تعذر عرض الموظفات: '+(e.message||e)}
 };
 section.querySelector('#refreshEmployeeAccountPanel').onclick=load;
 section.querySelector('#employeeAccountEditorList').addEventListener('click',event=>{
  const button=event.target.closest('[data-account-action]');if(!button)return;
  const card=button.closest('[data-account]');if(!card)return;
  if(button.dataset.accountAction==='edit'){card.querySelector('form[data-employee-edit]')?.classList.toggle('hidden');return}

 });
 section.querySelector('#employeeAccountEditorList').addEventListener('submit',event=>{

 });

};

// Route the roster delete button through the same secure profile retirement path as the account editor.
// Authentication users remain intact for the owner to delete manually from Firebase Console.
window.deleteStaff=async function(staffId){
 if(!ownerVerified())return;
 const staff=(db.staff||[]).find(s=>String(s.id)===String(staffId));
 if(!staff){toast('لم أجد الموظفة');return}
 if(staff.authUid){await employeeAccountAction(String(staff.authUid),'retire',null,null);return}
 if(!confirm('هذه الموظفة غير مرتبطة بحساب Firebase. هل تريدين إزالتها من قائمة الصالون والعميلات مع إبقاء السجلات القديمة؟'))return;
 try{
  await saveQueue;
  const newStaff=db.staff.filter(s=>String(s.id)!==String(staffId));
  const clean=a=>(a||[]).map(({password,...rest})=>rest);
  const cloud={staff:clean(newStaff),updatedAt:new Date().toISOString(),schemaVersion:3};
  const newPublicStaff=newStaff.filter(s=>s.active!==false&&s.authUid).map(s=>({id:String(s.id),authUid:String(s.authUid),name:String(s.name||''),active:true}));
  const batch=firestore.batch();
  batch.set(salonDoc,cloud,{merge:true});
  batch.set(firestore.collection('portal').doc('catalog'),{staff:newPublicStaff},{merge:true});
  await batch.commit();db.staff=newStaff;toast('حُذفت الموظفة من قوائم الصالون والعميلات');renderOwner('staff');
 }catch(e){toast('تعذر إزالة الموظفة: '+String(e.message||e))}
};
async function employeeAccountAction(id,action,button,data){
 if(!ownerVerified()||!['toggle','retire','save'].includes(action))return;
 if(button)button.disabled=true;
 try{
  await saveQueue;
  const ref=profilesRef.doc(id),snap=await ref.get();if(!snap.exists)throw Error('حساب الموظفة غير موجود');
  const p=snap.data(),related=(db.staff||[]).find(x=>x.authUid===id||x.id===p.staffId);
  let roster=(db.staff||[]).map(x=>({...x}));let changes={updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  if(action==='toggle'){
   if(!confirm(p.active===true?'إيقاف دخول الموظفة وإخفاؤها من قائمة حجز العميلات؟':'إعادة تفعيل الحساب وإظهاره للعميلات؟'))return;
   const active=p.active!==true;changes={...changes,active,archived:false};roster=roster.map(x=>x.authUid===id||x.id===p.staffId?{...x,active}:x);
  }else if(action==='retire'){
   if(!confirm('حذف الموظفة من قوائم الصالون والعميلات وتعطيل صلاحيتها؟ حساب Firebase Authentication يبقى ويمكنك حذفه بنفسك.'))return;
   changes={...changes,active:false,archived:true,archivedAt:firebase.firestore.FieldValue.serverTimestamp()};
   roster=roster.filter(x=>x.authUid!==id&&x.id!==p.staffId);
  }else{
   const name=String(data?.get('name')||'').trim(),email=String(data?.get('email')||'').trim().toLowerCase(),phone=String(data?.get('phone')||'').trim();
   if(!name||name.length>80||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||phone.length>20)throw Error('راجعي الاسم والإيميل ورقم الجوال');
   if(email!==String(p.email||'').trim().toLowerCase()&&!confirm('تغيير الإيميل هنا لا يغيره في Firebase Authentication. يجب تغييره هناك أيضًا قبل تسجيل الدخول. متابعة؟'))return;
   const others=await profilesRef.get();if(others.docs.some(d=>d.id!==id&&d.data().archived!==true&&String(d.data().email||'').toLowerCase()===email))throw Error('الإيميل مرتبط بموظفة أخرى');
   changes={...changes,name,email};roster=roster.map(x=>x.authUid===id||x.id===p.staffId?{...x,name,email,phone}:x);
  }
  if(action!=='retire'&&!related)throw Error('لم أجد الموظفة في قائمة الصالون؛ استخدمي ربط UID والإيميل أولًا');
  const clean=a=>(a||[]).map(({password,...entry})=>entry);
  const cloud={staff:clean(roster),updatedAt:new Date().toISOString(),schemaVersion:3};
  const publicStaff=roster.filter(x=>x.active!==false&&!!x.authUid).map(x=>({id:String(x.id),authUid:String(x.authUid),name:String(x.name||''),active:true}));
  const batch=firestore.batch();batch.set(salonDoc,cloud,{merge:true});batch.set(ref,changes,{merge:true});batch.set(firestore.collection('portal').doc('catalog'),{staff:publicStaff},{merge:true});
  await batch.commit();db.staff=roster;
  toast(action==='toggle'?(p.active===true?'تم إيقاف حساب الموظفة':'تمت إعادة تفعيل الحساب'):action==='save'?'تم تعديل الحساب':'تم حذف الموظفة من قوائم الصالون');
  renderOwner('staff');
 }catch(e){toast('تعذر تحديث الحساب: '+(e.message||e))}finally{if(button?.isConnected)button.disabled=false}
}
})();

<script>

(function(){

 return {id:packageServiceId(b.id),name:(/^باقة\s/.test(b.nameAr)?b.nameAr:'باقة '+b.nameAr)+(included?' | '+included:''),nameEn:(b.nameEn||b.nameAr)+(x.rows.length?' | '+x.rows.map(r=>`${r.nameEn} x${r.quantity}`).join(', '):''),price:Number(b.price),duration:Math.max(1,x.duration),active:b.active!==false,isPackage:true,packageId:b.id,packageColor:validHex(b.color),packageDetails:included,packageDescription:b.description||'',loyaltyPoints:0,imageUrl:''};}

 return `<section class="card salon-package-editor"><h2>${editing?'تعديل الباقة':'إنشاء باقة جديدة'}</h2>

 <div class="field full"><label>وصف الباقة (اختياري)</label><textarea name="description" maxlength="350">${esc(current.description||'')}</textarea></div>
 <div class="field"><label>سعر الباقة النهائي (ر.س)</label><input type="number" name="price" min="0" max="100000" step="0.01" required value="${esc(String(current.price??''))}"></div>

 <div class="field salon-credit-config"><label>صلاحية رصيد الباقة</label><select name="validityMonths"><option value="1" ${Number(current.validityMonths??12)===1?'selected':''}>شهر</option><option value="3" ${Number(current.validityMonths??12)===3?'selected':''}>3 أشهر</option><option value="6" ${Number(current.validityMonths??12)===6?'selected':''}>6 أشهر</option><option value="12" ${Number(current.validityMonths??12)===12?'selected':''}>سنة</option><option value="24" ${Number(current.validityMonths??12)===24?'selected':''}>سنتان</option><option value="0" ${Number(current.validityMonths??12)===0?'selected':''}>بدون تاريخ انتهاء</option></select></div>
 <div class="field full"><label class="checkline"><input name="active" type="checkbox" ${current.active!==false?'checked':''}> نشطة وتظهر للعميلات</label></div>
 <div class="field full"><h3>الخدمات داخل الباقة</h3><p id="salonPackageItemsHelp" class="muted tiny">للعرض المستخدم مرة واحدة: اجعلي كمية الخدمة 1، أو اجمعي عدة خدمات لزيارة واحدة. السعر النهائي تحددينه أنتِ.</p>

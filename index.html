function ownerTab(tab){renderOwner(tab)}
function bookingTable(list,compact=false){if(!list.length)return `<div class="empty">${esc(t("noBookings"))}</div>`;return `<div class="table-wrap"><table><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("time"))}</th><th>${esc(t("customer"))}</th><th>${esc(t("service"))}</th><th>${esc(t("employee"))}</th><th>${esc(t("status"))}</th>${compact?"":"<th>"+esc(t("actions"))+"</th>"}</tr></thead><tbody>${list.map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.time)}</td><td>${esc(clientName(b.clientId)||b.customerName||"—")}<br><small>${esc(b.clientCode||"")}</small></td><td>${esc(b.serviceName||serviceName(b.serviceId))}<br><small>${b.serviceLocation==="home"?"خدمة منزلية":"في الصالون"}</small></td><td>${esc(staffName(b.staffId))}</td><td>${statusBadge(b.status)}</td>${compact?"":`<td><div class="row">${b.status==="pending"?`<button class="btn success small" onclick="changeBooking('${b.id}','confirmed')">${esc(t("markConfirmed"))}</button>`:""}${b.status==="confirmed"?`<button class="btn secondary small" onclick="changeBooking('${b.id}','inProgress')">${esc(t("startService"))}</button>`:""}${b.status==="inProgress"?`<button class="btn success small" onclick="changeBooking('${b.id}','completed')">${esc(t("complete"))}</button>`:""}${!["cancelled","completed","noShow"].includes(b.status)?`<button class="btn danger small" onclick="cancelBooking('${b.id}')">${esc(t("cancelBooking"))}</button>`:""}${b.status==="pending"||b.status==="confirmed"?`<button class="btn outline small" onclick="changeBooking('${b.id}','noShow')">${esc(t("markNoShow"))}</button>`:""}</div></td>`}</tr>`).join("")}</tbody></table></div>`}
function clientName(id){return db.clients.find(c=>c.id===id)?.name}
function staffName(id){return db.staff.find(s=>s.id===id)?.name||"—"}
function serviceName(id){const s=db.services.find(x=>x.id===id);return s?textService(s):"—"}
function changeBooking(id,status){if(db.session?.type!=="owner"&&db.session?.type!=="employee"){toast(t("noPermission"));return}const b=db.bookings.find(x=>x.id===id);if(!b)return;if(db.session.type==="employee"&&b.staffId!==db.session.id){toast(t("noPermission"));return}if(status==="cancelled"&&db.session.type!=="owner"){toast(t("onlyOwnerCancel"));return}b.status=status;b.updatedAt=new Date().toISOString();if(status==="completed"){const c=db.clients.find(x=>x.id===b.clientId);if(c)c.points+=db.invoices.some(i=>i.bookingId===b.id)?0:(b.serviceIds||[b.serviceId]).reduce((sum,id)=>sum+Math.max(0,Math.floor(Number(db.services.find(s=>s.id===id)?.loyaltyPoints)||0)),0);b.completedAt=new Date().toISOString()}persist();if(db.session.type==="owner")renderOwner(ownerActiveTab);else renderEmployee();toast(status==="completed"?t("serviceCompleted"):t("saved"))}
function cancelBooking(id){if(db.session?.type!=="owner"){toast(t("onlyOwnerCancel"));return}if(!confirm(t("confirmCancel")))return;changeBooking(id,"cancelled")}
function filterBookings(){const d=$("#bookingFilterDate").value;const list=db.bookings.filter(b=>!d||b.date===d).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$("#bookingsTable").innerHTML=bookingTable(list)}
function scheduleForm(){return `<div class="card"><h3>${esc(t("schedule"))}</h3><div class="form-grid" style="margin-top:14px"><div class="field"><label>${esc(t("date"))}</label><input id="blockDate" type="date" min="${today()}" max="2050-12-31" value="${today()}"></div><div class="field"><label>${esc(t("chooseEmployee"))}</label><select id="blockStaff"><option value="all">${esc(t("allStaff"))}</option>${activeStaff().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>${esc(t("startTime"))}</label><input id="blockStart" type="time" value="16:00"></div><div class="field"><label>${esc(t("endTime"))}</label><input id="blockEnd" type="time" value="18:00"></div><div class="field full"><label>${esc(t("reason"))}</label><input id="blockReason" maxlength="120"></div><div class="row full"><button class="btn" onclick="addBlock(false)">${esc(t("blockPeriod"))}</button><button class="btn danger" onclick="addBlock(true)">${esc(t("closeDay"))}</button></div></div></div><div class="section-head"><h3>${esc(t("blocked"))}</h3></div><div id="blocksList"></div><div class="notice" style="margin-top:14px">${esc(t("demoNotice"))}</div>`}
function addBlock(fullDay){const date=$("#blockDate").value,start=$("#blockStart").value,end=$("#blockEnd").value;if(!date){toast(t("dateRequired"));return}if(!fullDay&&(!start||!end||start>=end)){toast(t("invalidTime"));return}db.blocks.push({id:uid("blk"),date,fullDay,startTime:fullDay?"00:00":start,endTime:fullDay?"23:59":end,staffId:$("#blockStaff").value,reason:$("#blockReason").value.trim(),createdAt:new Date().toISOString()});persist();refreshBlocksList();toast(t("blockedSaved"))}
function refreshBlocksList(){const root=$("#blocksList");if(!root)return;const rows=db.blocks.slice().sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime));root.innerHTML=rows.length?rows.map(b=>`<div class="card spread" style="margin-bottom:8px"><div><b>${esc(b.date)}</b><div class="muted tiny">${b.fullDay?esc(t("closeDay")):`${esc(b.startTime)} – ${esc(b.endTime)}`} • ${esc(b.staffId==="all"?t("allStaff"):staffName(b.staffId))}</div><small>${esc(b.reason)}</small></div><button class="btn secondary small" onclick="reopenBlock('${b.id}')">${esc(t("reopen"))}</button></div>`).join(""):`<div class="empty">${esc(t("noData"))}</div>`}
function reopenBlock(id){if(db.session?.type!=="owner"){toast(t("noPermission"));return}db.blocks=db.blocks.filter(b=>b.id!==id);persist();refreshBlocksList();toast(t("reopened"))}
function isBlocked(date,time,staffId){return db.blocks.some(b=>b.date===date&&(b.staffId==="all"||b.staffId===staffId)&&(b.fullDay||(time>=b.startTime&&time<b.endTime)))}
function conflicts(date,time,staffId,duration,ignoreId){const start=timeToMin(time),end=start+(Number(duration)||30);return db.bookings.some(b=>b.id!==ignoreId&&b.date===date&&b.staffId===staffId&&!["cancelled","noShow"].includes(b.status)&&start<timeToMin(b.time)+(Number(b.duration)||30)&&end>timeToMin(b.time))}
function timeToMin(ti){const [h,m]=String(ti).split(":").map(Number);return h*60+(m||0)}
function clientPanel(){const c=currentUser();return `<div class="stats"><div class="stat"><span>${esc(t("code"))}</span><strong style="font-size:17px">${esc(c.code)}</strong></div><div class="stat"><span>${esc(t("loyalty"))}</span><strong>${c.points||0}</strong></div><div class="stat"><span>${esc(t("myBookings"))}</span><strong>${db.bookings.filter(b=>b.clientId===c.id&&!["cancelled","completed"].includes(b.status)).length}</strong></div><div class="stat"><span>${esc(t("services"))}</span><strong>${activeServices().length}</strong></div></div>
<div class="section-head"><h3>${esc(t("book"))}</h3></div><div class="card"><form id="bookingForm" class="form-grid"><div class="field"><label>${esc(t("chooseService"))}</label><select id="bookingService" multiple size="5" required>${activeServices().map(s=>`<option value="${s.id}">${esc(textService(s))} — ${money(s.price)} (${s.duration} ${esc(t("minutes"))})</option>`).join("")}</select><small>اختاري أكثر من خدمة (Ctrl على الكمبيوتر)</small></div><div class="field"><label>${esc(t("chooseEmployee"))}</label><select id="bookingStaff" required><option value="">${esc(t("choose"))}</option>${activeStaff().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>${esc(t("date"))}</label><input id="bookingDate" type="date" min="${today()}" max="2050-12-31" required></div><div class="field"><label>${esc(t("time"))}</label><select id="bookingTime" required><option value="">${esc(t("choose"))}</option>${["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"].map(x=>`<option value="${x}">${x}</option>`).join("")}</select></div><div class="field full"><label>${esc(t("notes"))}</label><textarea id="bookingNotes" rows="2" maxlength="300"></textarea></div><div class="notice full" id="slotHint">${esc(t("noSlots"))}</div><button class="btn full" type="submit">${esc(t("submitBooking"))}</button></form></div>
<div class="section-head"><h3>${esc(t("myBookings"))}</h3></div>${bookingTable(db.bookings.filter(b=>b.clientId===c.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),true)}
<div class="card" style="margin-top:14px"><div class="spread"><div><h3>${esc(t("loyalty"))}</h3><p class="muted tiny">${esc(t("points"))}: ${c.points||0} • كل خدمة مكتملة تكسب نقاطًا وفق قواعد النظام</p></div><button class="btn" onclick="redeemPoints()">${esc(t("redeem"))}</button></div></div>`;

function cashierTotals(){const threshold=Math.max(1,Number(db.settings.redeemPoints)||50),value=Math.max(0,Number(db.settings.redeemRiyals)||10),used=Math.max(0,Math.floor(Number($("#invoicePointsUse")?.value)||0)),loyaltyDiscount=Math.floor(used/threshold)*value;const subtotal=cashierCart.reduce((a,x)=>a+x.price*x.quantity,0),discount=Math.min(subtotal,Math.max(0,Number($("#invoiceDiscount")?.value)||0)+loyaltyDiscount),taxable=Math.max(0,subtotal-discount),tax=taxable*Math.max(0,Number($("#invoiceTaxRate")?.value)||0)/100;return {subtotal,discount,loyaltyDiscount,tax,total:taxable+tax}}

function invoiceEmployeeLabel(invoice){
 if(!invoice)return 'غير محددة';
 const key=String(invoice.staffId||invoice.employeeId||invoice.staffUid||'').trim();
 const current=(db.staff||[]).find(s=>key&&(String(s.id)===key||String(s.authUid||'')===key));
 const archives=db.staffArchive||{};
 const historic=key?(archives[key]||Object.values(archives).find(s=>String(s?.authUid||'')===key)):null;
 const booking=invoice.bookingId?(db.bookings||[]).find(b=>String(b.id)===String(invoice.bookingId)):null;
 const candidate=invoice.staffName||invoice.employeeName||current?.name||historic?.name||booking?.staffName||
  (booking?.staffId?(db.staff||[]).find(s=>String(s.id)===String(booking.staffId))?.name||archives[String(booking.staffId)]?.name:'');
 return String(candidate||'').trim()||'غير محددة';
}
function invoiceLineRows(invoice){

 const name=String(item?.staffName||staff?.name||'').trim();

function invoiceEmployeeRevenue(invoice,employeeId){
 const rows=invoiceLineRows(invoice),subtotal=rows.reduce((sum,x)=>sum+Math.max(0,Number(x.lineTotal??(Number(x.price||0)*Number(x.quantity||1)))),0);
 const total=Number(invoice.total)||0;
 if(subtotal<=0){return rows.some(x=>String(x.staffId||invoice.staffId||'')===String(employeeId))?total:0;}
 return rows.reduce((sum,x)=>{
   const id=String(x.staffId||invoice.staffId||'');if(id!==String(employeeId))return sum;
   return sum+total*Math.max(0,Number(x.lineTotal??(Number(x.price||0)*Number(x.quantity||1))))/subtotal;
 },0);

async function restoreBackup(){
 const file=$("#restoreFile")?.files?.[0];
 if(!file){toast(t("required"));return}
 if(db.session?.type!=="owner"||!firebaseReady||auth.currentUser?.uid!=="AvRinM2frzLkDWH1CsH7CnIhFnK2"){toast(t("noPermission"));return}
 if(file.size>20*1024*1024){toast("ملف النسخة كبير جدًا، تواصلي مع الدعم قبل الاستعادة");return}
 try{
  const backup=JSON.parse(await file.text());
  if(!backup||!Array.isArray(backup.bookings)||!Array.isArray(backup.clients)||!Array.isArray(backup.services)||!Array.isArray(backup.invoices))throw Error("Invalid backup");
  const snap=await salonDoc.get({source:"server"});
  if(!snap.exists)throw Error("بيانات الصالون غير موجودة في Firebase، لا يمكن الاستعادة بأمان");
  const remote=snap.data(),keys=["clients","services","bookings","staff","invoices","expenses","inventory","blocks","breaks","redemptions","reviews","packages"];
  const merged={...remote};let added=0;
  const archive=remote.staffArchive||{};
  for(const key of keys){
   const present=Array.isArray(remote[key])?remote[key]:[],old=Array.isArray(backup[key])?backup[key]:[];
   const known=new Set(present.filter(x=>x&&x.id!=null).map(x=>String(x.id)));
   const extras=[];
   for(const item of old){
    if(!item||typeof item!=="object"||item.id==null||known.has(String(item.id)))continue;
    // Never re-activate deliberately deleted employees from a backup.
    if(key==="staff"&&archive[String(item.id)])continue;
    const {password,...safe}=item;
    extras.push(safe);known.add(String(item.id));
   }
   merged[key]=[...present,...extras];added+=extras.length;
  }
  if(!added){toast("جميع سجلات النسخة موجودة مسبقًا، لم تتغير بيانات Firebase");return}
  if(!confirm("سيتم إضافة "+added+" سجل مفقود من النسخة الاحتياطية، دون تغيير السجلات الموجودة. هل توافقين؟"))return;
  // Recheck immediately before write to avoid restoring over a changed live database.
  const latest=await salonDoc.get({source:"server"});
  if(!latest.exists||String(latest.data()?.updatedAt||"")!==String(remote.updatedAt||""))throw Error("تغيرت البيانات منذ الفحص؛ أعيدي المحاولة لضمان عدم استبدال تغييرات حديثة");
  const patch={};for(const key of keys)if(merged[key].length>(Array.isArray(remote[key])?remote[key].length:0))patch[key]=merged[key];
  patch.updatedAt=new Date().toISOString();
  await salonDoc.set(patch,{merge:true});
  db={...initialState(),...remote,...patch,session:{type:"owner",id:auth.currentUser.uid}};
  if(patch.services||patch.staff){const published=await publishPortalCatalog();if(!published)toast("استعيدت البيانات، لكن أعيدي نشر الخدمات من إدارة الخدمات")}
  renderOwner("dashboard");toast("تمت إضافة "+added+" سجل مفقود بنجاح");
 }catch(e){console.error("Safe backup recovery failed",e);toast("لم تتم الاستعادة: "+String(e.message||e))}
}

async function readAssistantImages(){
 const status=$('#assistantOcrStatus'),btn=$('#assistantOcrBtn');
 if(!assistantImageFiles.length){toast('اختاري صورة أولًا');return}
 btn.disabled=true;
 try{
  status.textContent='جارٍ تحميل قارئ الصور…';
  if(!window.Tesseract){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('تعذر تحميل مكتبة قراءة الصور'));document.head.appendChild(sc)})}
  const worker=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent=`قراءة الصورة: ${Math.round((m.progress||0)*100)}%`}});
  try{
   const texts=[];
   for(let i=0;i<assistantImageFiles.length;i++){
    status.textContent=`قراءة الصورة ${i+1} من ${assistantImageFiles.length}…`;
    const result=await worker.recognize(assistantImageFiles[i]);texts.push(result.data.text.trim());
   }
   const input=$('#assistantInput');input.value=[input.value.trim(),...texts].filter(Boolean).join('\n');
   status.textContent='اكتملت القراءة. راجعي النص وعدّليه ثم اضغطي استخراج الفواتير للمراجعة.';
  }finally{await worker.terminate()}
 }catch(e){console.error(e);status.textContent='تعذرت قراءة الصور. تأكدي من الاتصال أو اكتبي البيانات يدويًا.';toast('تعذرت قراءة الصور')}
 finally{btn.disabled=false}
}
function normalizeAssistant(v){return String(v||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064b-\u065f]/g,'').trim()}
function parseAssistantInvoices(){
 assistantDraft=[];const lines=($('#assistantInput')?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
 for(const line of lines){
  const parts=line.split(/[،,|؛;]/).map(x=>x.trim()).filter(Boolean), phone=(line.match(/(?:\+?966|0)5\d{8}/)||[])[0]||'';
  const services=activeServices().filter(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name))||(s.nameEn&&normalizeAssistant(line).includes(normalizeAssistant(s.nameEn))));
  const employee=activeStaff().find(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name)));
  const payment=/شبك|بطاق|مدى|card/i.test(line)?'card':/تحويل/.test(line)?'transfer':/نقد|كاش|cash/i.test(line)?'cash':'';
  let name=parts.find(x=>!/(?:\+?966|0)5\d{8}/.test(x)&&!services.some(s=>normalizeAssistant(x).includes(normalizeAssistant(s.name)))&&!/شبك|بطاق|مدى|تحويل|نقد|كاش|cash|card/i.test(x)&&(!employee||!normalizeAssistant(x).includes(normalizeAssistant(employee.name))))||'';
  if(!name&&parts.length)name=parts[0].replace(phone,'').trim();
  assistantDraft.push({name,phone,services:services.map(s=>s.id),staffId:employee?.id||'',payment:payment||'cash',date:today(),error:!name||!phone||!services.length});
 }
 renderAssistantPreview();
}

}

 db.invoices.push({id:uid('inv'),number:db.invoiceCounter++,clientId:client.id,customerName:client.name,customerPhone:client.phone,staffId:r.staffId,staffName:activeStaff().find(s=>String(s.id)===String(r.staffId))?.name||'',items:items.map(x=>({...x,staffId:r.staffId||'',staffName:activeStaff().find(st=>String(st.id)===String(r.staffId))?.name||''})),serviceId:items[0].serviceId,serviceName:items.map(x=>x.name).join('، '),subtotal,discount:0,taxRate:0,tax:0,total:subtotal,payment:r.payment,pointsUsed:0,loyaltyDiscount:0,pointsAdded:earned,pointsEarned:earned,notes:'أدخلت من مساعد المالكة بعد المراجعة',date:r.date,createdAt:new Date().toISOString()});client.points=Number(client.points||0)+earned;

 }

}

function normalizeSaudiPhone(raw){
 const digits=String(raw||'').replace(/[^\d]/g,'');
 if(/^05\d{8}$/.test(digits))return '966'+digits.slice(1);
 if(/^5\d{8}$/.test(digits))return '966'+digits;
 if(/^9665\d{8}$/.test(digits))return digits;
 if(/^009665\d{8}$/.test(digits))return digits.slice(2);
 throw Error(lang==='ar'?'أدخلي رقم جوال سعودي صحيح':'Enter a valid Saudi mobile number');
}

function salonContactDigits(){

}

function setupExtension(tab){
 ensureExtensions();
 if(tab==='leases')$('#leaseForm').onsubmit=e=>{e.preventDefault();const name=$('#leaseName').value.trim(),start=$('#leaseStart').value,end=$('#leaseEnd').value,due=$('#leaseDue').value,count=Number($('#leaseCount').value),frequency=Number($('#leaseFrequency').value),amount=Number($('#leaseAmount').value);if(!name||end<start||count<1||!due){toast('راجعي بيانات العقد');return}const id=uid('lease');db.leases.push({id,name,landlord:$('#leaseLandlord').value,number:$('#leaseNumber').value,start,end});for(let i=0;i<count;i++){const d=new Date(due+'T12:00:00');d.setMonth(d.getMonth()+i*frequency);db.leasePayments.push({id:uid('rent'),leaseId:id,due:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,amount,paid:false})}extLog('إضافة عقد',name);persist();renderOwner(tab)};
 if(tab==='deposits')$('#depositForm').onsubmit=e=>{e.preventDefault();db.depositRecords.unshift({id:uid('dep'),client:$('#depClient').value.trim(),bookingId:$('#depBooking').value.trim(),amount:Number($('#depAmount').value),date:$('#depDate').value,reference:$('#depReference').value.trim(),status:'pending'});extLog('تسجيل عربون','بانتظار التحقق البنكي');persist();renderOwner(tab)};
 if(tab==='waitlist')$('#waitForm').onsubmit=e=>{e.preventDefault();db.waitlist.push({id:uid('wait'),name:$('#waitName').value.trim(),phone:$('#waitPhone').value.trim(),date:$('#waitDate').value,time:$('#waitTime').value,service:$('#waitService').value,priority:Number($('#waitPriority').value),status:'waiting'});extLog('قائمة الانتظار',$('#waitName').value);persist();renderOwner(tab)};
 if(tab==='loyaltyExt'){
  $('#loyaltyExtForm').onsubmit=e=>{e.preventDefault();db.settings.redeemPoints=Number($('#loyaltyThreshold').value);db.settings.redeemRiyals=Number($('#loyaltyValue').value);db.settings.loyaltyMaxDiscount=Number($('#loyaltyMax').value);extLog('تعديل سياسة الولاء','');persist();publishPortalCatalog();renderOwner(tab)};
  $('#loyaltyAdjustForm').onsubmit=e=>{e.preventDefault();const c=db.clients.find(x=>x.id===$('#loyaltyClient').value),delta=Number($('#loyaltyDelta').value),reason=$('#loyaltyReason').value.trim();if(!c||!Number.isInteger(delta)||!delta||!reason||Number(c.points||0)+delta<0){toast('الرصيد غير كافٍ أو المدخلات غير صحيحة');return}c.points=Number(c.points||0)+delta;db.loyaltyLedger.unshift({id:uid('points'),at:new Date().toISOString(),clientId:c.id,clientName:c.name,delta,reason,actor:auth.currentUser?.uid||'owner'});extLog('تعديل نقاط',c.name+' '+delta);persist();renderOwner(tab)}
 }
 if(tab==='staffRequests')loadStaffRequestsOwner();
}
function markLeasePaid(id){const p=db.leasePayments.find(x=>x.id===id);if(!p||!confirm('هل تم دفع الإيجار فعلًا؟'))return;p.paid=true;p.paidAt=new Date().toISOString();extLog('دفع إيجار',p.leaseId);persist();renderOwner('leases')}
function verifyDeposit(id){const d=db.depositRecords.find(x=>x.id===id);if(!d||!confirm('هل تحققتِ من وصول التحويل إلى الحساب البنكي؟'))return;d.status='received';d.verifiedAt=new Date().toISOString();extLog('التحقق من عربون',d.client);persist();renderOwner('deposits')}
function contactWaitlist(id){const w=db.waitlist.find(x=>x.id===id);if(!w)return;const n=w.phone.replace(/\D/g,'').replace(/^0/,'966');window.open('https://wa.me/'+n+'?text='+encodeURIComponent('مرحبًا '+w.name+'، تواصُل من صالون جودة الأظافر بخصوص موعد '+w.date+' '+w.time),'_blank','noopener,noreferrer')}
function closeWaitlist(id){const w=db.waitlist.find(x=>x.id===id);if(!w)return;w.status='contacted';extLog('التواصل مع الانتظار',w.name);persist();renderOwner('waitlist')}
async function loadStaffRequestsOwner(){const el=$('#cloudStaffRequests');if(!el)return;try{const snap=await firestore.collection('staffRequests').get();el.innerHTML=extTable(['الموظفة','النوع','التاريخ','الملاحظات','الحالة'],snap.docs.map(x=>extRow([esc(x.data().employeeName),esc(x.data().type),esc(x.data().date),esc(x.data().notes),esc(x.data().status)])))}catch(e){el.textContent='تعذر جلب الطلبات: '+e.message}}
const extensionRenderOwner=renderOwner;
renderOwner=function(tab=ownerActiveTab){ensureExtensions();if(['leases','deposits','waitlist','loyaltyExt','audit','staffRequests','financeExt'].includes(tab)){extensionRenderOwner('dashboard');ownerActiveTab=tab;const tabs=[['leases','الإيجارات والعقود'],['deposits','العربونات'],['waitlist','قائمة الانتظار'],['loyaltyExt','النقاط والولاء'],['financeExt','الملخص المالي'],['staffRequests','طلبات الموظفات'],['audit','سجل النشاط']];$('#app').innerHTML=headerPanel('إدارة الصالون','وحدات إضافية مرتبطة ببيانات المالكة في Firebase')+nav(tabs,tab)+extensionPanel(tab)+`<div class="row" style="margin-top:15px"><button class="btn secondary" onclick="renderOwner('dashboard')">العودة للوحة الرئيسية</button><button class="btn danger" onclick="clearSession()">تسجيل الخروج</button></div>`;setupExtension(tab);return}extensionRenderOwner(tab);if(db.session?.type==='owner'){const strip=document.createElement('div');strip.className='card';strip.style.margin='14px 0';strip.innerHTML='<h3>وحدات الإدارة الإضافية</h3><div class="nav">'+[['leases','الإيجارات والعقود'],['deposits','العربونات'],['waitlist','قائمة الانتظار'],['loyaltyExt','النقاط والولاء'],['financeExt','الملخص المالي'],['staffRequests','طلبات الموظفات'],['audit','سجل النشاط']].map(([k,n])=>`<button onclick="renderOwner('${k}')">${n}</button>`).join('')+'</div>';$('#app').append(strip)}};

/* Free Spark plan: owner manually copies UID and email from Firebase Authentication.

const accountOwnerRender=renderOwner;
renderOwner=function(tab=ownerActiveTab){

   <div class="field full" id="staffManualNewNameRow"><label for="staffManualNewName">${lang==='ar'?'اسم الموظفة الجديدة':'New employee name'}</label><input id="staffManualNewName" name="newName" maxlength="80" placeholder="مثال: شيري"></div>
   <div class="field"><label for="staffManualEmail">${lang==='ar'?'إيميل الموظفة في Firebase':'Employee email in Firebase'}</label><input id="staffManualEmail" name="email" type="email" maxlength="254" required autocomplete="off" placeholder="employee@example.com" dir="ltr"></div>
   <div class="field"><label for="staffManualUid">${lang==='ar'?'UID الموظفة في Firebase':'Employee UID in Firebase'}</label><input id="staffManualUid" name="authUid" type="text" maxlength="128" required autocomplete="off" spellcheck="false" placeholder="انسخي UID كما هو" dir="ltr"></div>

  <p id="staffManualLinkStatus" class="muted tiny" role="status" aria-live="polite"></p>
  <div class="section-head"><h3>${lang==='ar'?'حسابات الموظفات المرتبطة':'Linked employee accounts'}</h3><button type="button" class="btn secondary small" id="refreshSecureStaff">${lang==='ar'?'تحديث':'Refresh'}</button></div>

 const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
 for(const n of nodes){if(n.parentElement?.closest('script,style'))continue;const v=n.nodeValue,trim=v.trim();if(!trim)continue;const target=lang==='en'?interfaceTranslations[trim]:reverse[trim];if(target&&target!==trim)n.nodeValue=v.replace(trim,target)}
 for(const el of app.querySelectorAll('input[placeholder],textarea[placeholder]')){const p=el.getAttribute('placeholder');const target=lang==='en'?interfaceTranslations[p]:reverse[p];if(target)el.setAttribute('placeholder',target)}
}

function normalizeSalonServiceName(v){
 return String(v||'').normalize('NFKC').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ـًٌٍَُِّْ]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
}
function previewPriceList(){
 if(db.session?.type!=='owner')return;
 const known=new Set(db.services.map(x=>normalizeSalonServiceName(x.name)));
 const newCount=qualityNailPriceList.filter(x=>!known.has(normalizeSalonServiceName(x.name))).length;
 const updatedCount=qualityNailPriceList.length-newCount;
 if(!confirm(`القائمة تحتوي على ${qualityNailPriceList.length} خدمة.\n${newCount} خدمة جديدة و${updatedCount} خدمة موجودة ستُحدّث أسعارها وترجمتها.\n\nالمدد تقديرية وقابلة للتعديل. ستبقى الخدمات المخفية مخفية. هل تريدين المتابعة؟`))return;
 for(const entry of qualityNailPriceList){
  const current=db.services.find(x=>normalizeSalonServiceName(x.name)===normalizeSalonServiceName(entry.name));
  if(current){
   current.nameEn=entry.nameEn;
   current.price=entry.price;
   current.category=entry.category;
   if(!Number(current.duration)||current.duration<5)current.duration=entry.duration;
  }else{
   db.services.push({id:uid('svc'),...entry,active:true,loyaltyPoints:0,materials:[]});
  }
 }
 persist();
 renderOwner('services');

auth.onAuthStateChanged(async user=>{
 if(loginInProgress)return;
 if(!user){firebaseReady=false;db.session=null;db=initialState();portalUser=null;portalBookings=[];renderHome();return}
 try{
  if(user.uid==="AvRinM2frzLkDWH1CsH7CnIhFnK2"){
   const snap=await salonDoc.get();firebaseReady=true;localStorage.removeItem(STORAGE_KEY);
   if(snap.exists){const remote=snap.data(),base=initialState();db={...base,...remote,settings:{...base.settings,...remote.settings},session:{type:"owner",id:user.uid}};salonCloudBaseline=JSON.parse(JSON.stringify(remote))}
   else{firebaseReady=false;db.session=null;toast("بيانات الصالون غير موجودة في Firebase؛ لن ننشئ بيانات فارغة تلقائيًا");renderHome();return}
   renderOwner("dashboard");return;
  }
  const client=await firestore.collection("clientProfiles").doc(user.uid).get();
  if(loginInProgress)return;
  if(client.exists){portalUser=client.data();portalRole="client";await loadPortalCatalog();try{await loadPortalBookings()}catch(err){console.warn('Bookings unavailable',err);portalBookings=[]}renderPortalClient();return}
  // Auth account may have survived a failed Firestore profile write.
  // Let its real owner finish the profile instead of creating another Auth user.
  if(salonClientPhoneFromAuthEmail(user.email)){
   salonShowClientProfileRecovery(user);
   return;
  }
  const employee=await firestore.collection("employeeProfiles").doc(user.uid).get();
  if(loginInProgress)return;
  if(employee.exists&&employee.data().active===true&&String(employee.data().email||'').trim().toLowerCase()===String(user.email||'').trim().toLowerCase()){portalUser=employee.data();portalRole="employee";await loadPortalCatalog();try{await loadPortalBookings()}catch(err){console.warn('Employee bookings unavailable',err);portalBookings=[];toast('تم الدخول، لكن تعذر جلب الحجوزات. تأكدي من نشر قواعد Firestore المرفقة.')}renderPortalEmployee();return}
  if(loginInProgress)return;
  if(employee.exists&&employee.data().active===true&&String(employee.data().email||'').trim().toLowerCase()!==String(user.email||'').trim().toLowerCase()){
   toast('إيميل حساب Firebase لا يطابق الإيميل المرتبط بـ UID الموظفة. راجعي ربط الحساب من لوحة المالكة.');
   renderHome();return;
  }
  // A newly created Auth account may precede its Firestore profile. Do not sign it out automatically.
  toast("لم يُعثر على ملف الحساب بعد. أعيدي المحاولة بعد قليل أو سجّلي الدخول من جديد.");
 }catch(e){console.error(e);if(loginInProgress)return;toast("تعذر تحميل الحساب. راجعي قواعد Firestore: "+e.message);if(!portalUser)renderHome()}
});

iv><div class="full"><h3>إظهار العبارات والإعلانات في</h3><div class="row">${[['client','العميلات'],['employee','الموظفات'],['owner','المالكة']].map(([k,v])=>`<label class="checkline"><input type="checkbox" name="audience_${k}" ${salonTheme.showFor[k]?'checked':''}>${v}</label>`).join('')}</div></div><div class="full theme-preview" id="salonThemePreview"><strong>معاينة التصميم</strong><p>هنا يظهر شكل الألوان والعبارات قبل النشر</p><button type="button" class="btn">زر تجريبي</button></div><div class="row full"><button type="button" class="btn secondary" id="themePreviewButton">معاينة</button><button type="button" class="btn outline" id="themeResetButton">استعادة التصميم الافتراضي</button><button type="submit" class="btn success">حفظ ونشر لجميع الأجهزة</button></div><div id="themeSaveStatus" class="full tiny" aria-live="polite"></div></form></div>`

  const recent=document.querySelector('.owner-mini-list');if(recent&&recent.closest('.owner-panel')?.textContent.includes('أحدث الفواتير'))recent.innerHTML=bills.slice(-5).reverse().map(i=>`<div><span>${esc(i.customerName||'عميلة')}</span><b>${money(i.total)}</b></div>`).join('')||'<p>لا توجد فواتير اليوم</p>';
 }
 function statusName(s){return ({pending:'بانتظار التأكيد',confirmed:'مؤكد',arrived:'وصلت العميلة',inProgress:'جارٍ تنفيذ الخدمة',completed:'تم تنفيذ الخدمة',cancelled:'ملغي',noShow:'لم تحضر'})[s]||s||'بانتظار التأكيد'}
 function relevant(b){const d=bookingDate(b);if(bookingView==='history')return d===historyDate;if(bookingView==='all')return true;return isOpen(b) || (d===today()&&b.status==='completed');}
 function actionButtons(b,portal){if(!isOpen(b))return '';
  const fn=portal?'dailyPortalStatus':'dailyLocalStatus',id=JSON.stringify(String(b.id));
  return `<div class="row" style="margin-top:9px">${b.status==='pending'?`<button class="btn secondary small" onclick='${fn}(${id},"confirmed")'>تأكيد الحجز</button>`:''}${['pending','confirmed'].includes(b.status)?`<button class="btn secondary small" onclick='${fn}(${id},"arrived")'>وصلت العميلة</button>`:''}${b.status==='arrived'?`<button class="btn secondary small" onclick='${fn}(${id},"inProgress")'>بدء الخدمة</button>`:''}${['arrived','inProgress'].includes(b.status)?`<button class="btn success small" onclick='${fn}(${id},"completed")'>تم تنفيذ الخدمة</button>`:''}<button class="btn danger small" onclick='${fn}(${id},"noShow")'>لم تحضر</button></div>`;
 }
 function renderBookingRows(){const target=document.querySelector('#dailyBookingRows');if(!target)return;
  const local=db.bookings.filter(relevant).map(b=>({b,portal:false})),remote=portalCache.filter(relevant).map(b=>({b,portal:true}));
  const rows=[...local,...remote].sort((x,y)=>(x.b.date+x.b.time).localeCompare(y.b.date+y.b.time));
  target.innerHTML=rows.map(({b,portal})=>`<div class="card" style="margin:10px 0"><div class="spread"><strong>${esc(b.customerName||b.clientName||clientName(b.clientId)||'عميلة')} — ${esc(b.date||'')} ${esc(b.time||'')}</strong><span class="badge">${esc(statusName(b.status))}</span></div><p>${esc(b.serviceName||serviceName(b.serviceId))} · ${esc(b.staffName||staffName(b.staffId))} · ${portal?'حجز بوابة العميلات':'حجز الإدارة'}</p>${actionButtons(b,portal)}</div>`).join('')||'<div class="empty">لا توجد حجوزات مطابقة</div>';
 }
 async function loadDailyBookings(){const host=document.querySelector('#dailyBookingRows');if(!host)return;try{const snap=await firestore.collection('portalBookings').get();portalCache=snap.docs.map(d=>({id:d.id,...d.data()}));renderBookingRows();}catch(e){renderBookingRows();const note=document.querySelector('#dailyBookingNotice');if(note)note.textContent='تعذر تحميل حجوزات بوابة العميلات: '+e.message;}}
 window.dailyBookingView=(mode)=>{bookingView=mode;document.querySelectorAll('[data-daily-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.dailyMode===mode));const date=document.querySelector('#dailyHistoryDate');if(date)date.hidden=mode!=='history';renderBookingRows()};
 window.dailyHistoryDate=v=>{historyDate=v;renderBookingRows()};
 window.dailyLocalStatus=(id,status)=>{const b=db.bookings.find(x=>String(x.id)===String(id));if(!b||!hasOwner())return;if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز إلى: '+statusName(status)+'؟'))return;legacyChange(id,status);renderBookingRows()};
 window.dailyPortalStatus=async(id,status)=>{if(!hasOwner())return;if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز إلى: '+statusName(status)+'؟'))return;try{await firestore.collection('portalBookings').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),...(status==='completed'?{completedAt:firebase.firestore.FieldValue.serverTimestamp()}:{})});await loadDailyBookings();toast('تم حفظ حالة الحجز')}catch(e){toast('تعذر حفظ الحالة: '+e.message)}};
 function dailyAppointments(){return `<div class="card"><h2>الحجوزات والمواعيد</h2><p class="muted">تظهر حجوزات اليوم والقادمة والمعلقة حتى تؤكد الموظفة إتمام الخدمة. لا تُحذف السجلات عند نهاية اليوم.</p><div class="row" style="margin:12px 0;flex-wrap:wrap"><button class="btn secondary small" data-daily-mode="active" onclick="dailyBookingView('active')">الحجوزات النشطة والقادمة</button><button class="btn secondary small" data-daily-mode="history" onclick="dailyBookingView('history')">البحث بالتاريخ</button><button class="btn secondary small" data-daily-mode="all" onclick="dailyBookingView('all')">كل السجلات</button><input id="dailyHistoryDate" type="date" value="${historyDate}" hidden onchange="dailyHistoryDate(this.value)"><button class="btn secondary small" onclick="ownerTab('appointments')">تحديث</button></div><div id="dailyBookingNotice" class="muted"></div><div id="dailyBookingRows"></div></div>`}
 function dailyInvoices(){const d=today(),list=db.invoices.filter(i=>invoiceDate(i)===d),total=list.reduce((n,i)=>n+Number(i.total||0),0);return `<div class="card"><h2>فواتير اليوم</h2><p class="muted">كل يوم يبدأ عرض جديد تلقائيًا، والفواتير السابقة محفوظة ويمكن الرجوع إليها بالتاريخ.</p><div class="stats"><div class="stat"><span>عدد فواتير اليوم</span><strong>${list.length}</strong></div><div class="stat"><span>مبيعات اليوم</span><strong>${money(total)}</strong></div></div><div class="row" style="margin:12px 0;flex-wrap:wrap"><label>من <input type="date" id="dailyInvoiceFrom" value="${d}"></label><label>إلى <input type="date" id="dailyInvoiceTo" value="${d}"></label><button class="btn secondary small" onclick="dailyInvoiceSearch()">بحث بالتاريخ</button><button class="btn secondary small" onclick="dailyInvoiceToday()">اليوم</button></div><div id="dailyInvoiceCount" class="muted">${list.length} فاتورة</div><div id="dailyInvoiceTable">${invoiceTable(list)}</div></div>`}
 window.dailyInvoiceSearch=()=>{const a=document.querySelector('#dailyInvoiceFrom')?.value||'',b=document.querySelector('#dailyInvoiceTo')?.value||'';if(a&&b&&a>b){toast('تاريخ البداية بعد النهاية');return}const list=db.invoices.filter(i=>(!a||invoiceDate(i)>=a)&&(!b||invoiceDate(i)<=b));document.querySelector('#dailyInvoiceTable').innerHTML=invoiceTable(list);document.querySelector('#dailyInvoiceCount').textContent=list.length+' فاتورة'};
 window.dailyInvoiceToday=()=>{document.querySelector('#dailyInvoiceFrom').value=today();document.querySelector('#dailyInvoiceTo').value=today();window.dailyInvoiceSearch()};
 renderOwner=function(tab=ownerActiveTab){
  legacyRender(tab);
  if(!hasOwner())return;
  const content=document.querySelector('.owner-content');if(!content)return;
  if(tab==='appointments'){content.innerHTML=dailyAppointments();bookingView='active';loadDailyBookings();}
  if(tab==='invoices')content.innerHTML=dailyInvoices();
  if(tab==='dashboard'){ownerDailySummary();firestore.collection('portalBookings').get().then(s=>{portalCache=s.docs.map(d=>({id:d.id,...d.data()}));if(ownerActiveTab==='dashboard')ownerDailySummary()}).catch(()=>{});}
 };
})();
</script>

<style id="owner-final-navigation-style">
.owner-sidebar{position:sticky!important;top:0!important;height:100dvh!important;max-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain}
.owner-menu{overflow:visible!important;flex:0 0 auto}
.owner-menu button{min-height:42px}
@media(max-width:700px){.owner-shell{display:grid!important;grid-template-columns:76px minmax(0,1fr)!important}.owner-sidebar{width:76px!important;position:sticky!important;top:0!important;height:100dvh!important;max-height:100dvh!important}.owner-menu{display:flex!important;flex-direction:column!important;overflow:visible!important;white-space:normal!important}.owner-menu button{width:100%!important;min-width:0!important}.owner-menu button span:not(.owner-menu-icon){display:none!important}.owner-main{min-width:0!important}}
</style>
<script>
(function(){
 'use strict';
 // Older extensions append their navigation below #app. Relocate only genuine panels,
 // and discard the duplicate strip (without removing any Firebase-backed records).
 function tidyOwnerNavigation(){
  if(typeof hasOwner!=='function'||!hasOwner())return;
  const app=document.getElementById('app');if(!app)return;
  const shell=app.querySelector(':scope > .owner-shell');
  if(!shell)return;
  const content=shell.querySelector('.owner-content');if(!content)return;
  for(const child of [...app.children]){
   if(child===shell)continue;
   const heading=child.querySelector('h3,h2');
   if(heading&&heading.textContent.trim()==='وحدات الإدارة الإضافية'){child.remove();continue}
   if(child.tagName==='BUTTON'&&child.textContent.includes('تخصيص التصميم')){child.remove();continue}
   content.appendChild(child);
  }
  // Remove obsolete navigation wherever a previous patch placed it.
  for(const el of [...content.querySelectorAll('.card')]){
   const heading=el.querySelector(':scope > h3,:scope > h2');
   if(heading?.textContent.trim()==='وحدات الإدارة الإضافية')el.remove();
  }
  for(const el of [...content.querySelectorAll('button')]){
   if(el.textContent.trim()==='🎨 تخصيص التصميم' && el.parentElement===content)el.remove();
  }
 }
 const before=window.renderOwner;
 window.renderOwner=function(tab){
  const result=before.apply(this,arguments);
  tidyOwnerNavigation();
  return result;
 };
 const app=document.getElementById('app');
 if(app){
  let active=false;
  new MutationObserver(()=>{
   if(active)return;
   active=true;
   try{tidyOwnerNavigation()}finally{active=false}
  }).observe(app,{childList:true,subtree:false});
 }
 tidyOwnerNavigation();
})();
</script>

function refreshSidebarSalonLogo(){const img=document.querySelector('.salon-side-logo img');if(img){const v=String(salonTheme?.logo||'');img.src=/^(https:\/\/|data:image\/)/.test(v)?v:SALON_DEFAULT_LOGO}}
const previousApplySalonTheme=applySalonTheme;
applySalonTheme=function(v){previousApplySalonTheme(v);refreshSidebarSalonLogo()};
const previousOwnerLayout=ownerLayout;
ownerLayout=function(tab,content){const result=previousOwnerLayout(tab,content);return result};
const previousRenderPortalClient=renderPortalClient;
renderPortalClient=function(){previousRenderPortalClient();const form=document.querySelector('#portalBooking');if(!form)return;
 const recalc=()=>{let count=0,price=0,duration=0;for(const item of portalCatalog.services||[]){const qty=Number(form.elements.namedItem('serviceQty_'+item.id)?.value||0);if(qty>0){count+=qty;price+=qty*salonEffectivePrice(item.originalPrice??item.price,item.sale);duration+=qty*Number(item.duration||30)}}const el=document.querySelector('#portalQuantitySummary');if(el)el.textContent='عدد الخدمات: '+count+' — الإجمالي: '+money(price)+' — المدة: '+duration+' دقيقة'};
 form.querySelectorAll('input[type=number][name^=serviceQty_]').forEach(input=>input.addEventListener('input',recalc));recalc();
};
/* Upload logo using the existing theme save button, without changing Firestore schema. */
document.addEventListener('submit',async e=>{
 const form=e.target;if(!form||!form.querySelector('input[name="logoFile"]'))return;
 const file=form.querySelector('input[name="logoFile"]').files?.[0];if(!file)return;
 e.preventDefault();e.stopImmediatePropagation();
 try{toast('جارٍ رفع الشعار...');const url=await uploadSalonImage(file,'logo');const data=new FormData(form);data.set('logo',url);const urlInput=form.querySelector('input[name="logo"]');if(urlInput)urlInput.value=url;
 // Resubmit to existing theme handler after successful upload.
 form.querySelector('input[name="logoFile"]').value='';form.requestSubmit();
 }catch(err){toast('تعذر رفع الشعار: '+err.message)}
},true);
</script>

<!-- Stabilization: make catalog publishing verifiable, client refreshable, and remove obsolete panels. -->
<style>
#salonClientRefreshCatalog{margin:10px 0;max-width:100%}
#salonClientCatalogWarning{margin:12px 0}
</style>
<script>
(function(){
 'use strict';
 const publishBeforeVerify=publishPortalCatalog;
 publishPortalCatalog=async function(){
  if(typeof hasOwner!=='function'||!hasOwner()){toast('النشر متاح للمالكة فقط');return false}
  const result=await publishBeforeVerify();
  if(!result)return false;
  try{
   // Read back the public document, not just the local salon state.
   const snap=await firestore.collection('portal').doc('catalog').get({source:'server'});
   const data=snap.exists?snap.data():null;
   const expected=(db.services||[]).filter(x=>x&&x.active!==false).length;
   const actual=(data?.services||[]).filter(x=>x.active!==false).length;
   if(!data||actual!==expected){toast('تنبيه: عدد الخدمات المنشورة لا يطابق الإدارة ('+actual+' من '+expected+'). أعيدي النشر أو افحصي الصلاحيات.');return false}
   const staffCount=(data.staff||[]).filter(x=>x.active!==false).length;
   if(!staffCount)toast('تم نشر الخدمات، لكن لا توجد موظفات نشطات. فعّلي موظفة حتى يمكن للعميلات الحجز.');
   else toast('تأكد النشر في Firebase: '+actual+' خدمة و'+staffCount+' موظفة نشطة.');
   return true;
  }catch(err){console.error('Catalog readback failed',err);toast('تم إرسال النشر لكن تعذر التحقق منه: '+(err.message||err));return false}
 };
 const renderBeforeStabilize=renderPortalClient;
 renderPortalClient=function(){
  renderBeforeStabilize();
  if(portalRole!=='client')return;
  const form=document.querySelector('#portalBooking');if(!form)return;
  // One booking button only, even when older extension scripts have run.
  const submitButtons=[...form.querySelectorAll('button[type="submit"]')];
  submitButtons.slice(1).forEach(x=>x.remove());
  if(submitButtons[0])submitButtons[0].textContent='إرسال طلب الحجز';
  const grid=form.querySelector('.service-grid');
  if(grid){
   const warning=document.createElement('p');warning.id='salonClientCatalogWarning';warning.className='notice';
   const services=(portalCatalog.services||[]).filter(x=>x.active!==false);
   const staff=(portalCatalog.staff||[]).filter(x=>x.active!==false);
   if(!services.length){warning.textContent='لا توجد خدمات منشورة حاليًا. يرجى التواصل مع الصالون أو تحديث الخدمات.';grid.before(warning)}
   else if(!staff.length){warning.textContent='الخدمات متوفرة لكن لا توجد موظفة متاحة للحجز. يرجى التواصل مع الصالون.';grid.before(warning)}
  }
  const refresh=document.createElement('button');refresh.id='salonClientRefreshCatalog';refresh.type='button';refresh.className='btn secondary';refresh.textContent='↻ تحديث الخدمات والموظفات';
  refresh.onclick=async()=>{refresh.disabled=true;try{await loadPortalCatalog();renderPortalClient();toast('تم تحديث الخدمات من Firebase')}catch(e){toast('تعذر تحميل الخدمات: '+e.message)}finally{refresh.disabled=false}};
  form.before(refresh);
 };
 const renderOwnerBeforeCleanup=renderOwner;
 renderOwner=function(tab){
  const result=renderOwnerBeforeCleanup.apply(this,arguments);
  if(typeof hasOwner!=='function'||!hasOwner())return result;
  const content=document.querySelector('#app .owner-content');if(!content)return result;
  // Discounts belong to Offers, not Services; do not discard the settings.
  if(tab==='services'){
   [...content.querySelectorAll('.card')].forEach(card=>{
    const heading=card.querySelector('h2,h3');
    if(heading&&heading.textContent.trim()==='الخصم الجماعي على الخدمات')card.remove();
   });
  }
  return result;
 };
})();

/* Unified searchable service picker and shopping basket. The original quantity
   fields remain in the booking form, preserving the existing Firestore schema. */
(function(){
 const beforeBasketRender=renderPortalClient;
 renderPortalClient=function(){
  beforeBasketRender.apply(this,arguments);
  if(portalRole!=='client')return;
  const form=document.querySelector('#portalBooking');if(!form)return;
  const grid=form.querySelector('.service-grid');if(!grid)return;
  const all=(portalCatalog.services||[]).filter(x=>x.active!==false);
  // Legacy extensions appended a second catalog after the booking form.
  document.querySelectorAll('#app .card').forEach(card=>{
   if(card!==form.closest('.card') && card.querySelector('#portalServiceCards'))card.remove();
  });
  const oldSearch=document.querySelector('#salonBookingServiceSearch')?.closest('.field');
  if(oldSearch)oldSearch.remove();
  grid.style.display='none';
  for(const field of grid.querySelectorAll('input[name^="serviceQty_"]')){
   field.max='10';field.min='0';field.value='0';field.required=false;
  }
  const area=document.createElement('div');area.className='field full';area.id='salonCartPicker';
  area.innerHTML=`<label for="salonCartSearch">ابحثي عن الخدمة وأضيفيها للسلة</label>
   <input type="search" id="salonCartSearch" autocomplete="off" placeholder="مثلاً: بدكير أو جل أو رموش" style="width:100%;padding:13px;border:1px solid var(--line);border-radius:12px">
   <div id="salonCartResults" class="service-grid" style="margin-top:10px"></div>
   <p id="salonCartSearchHint" class="muted tiny">اكتبي اسم الخدمة لتظهر الخيارات.</p>`;
  grid.before(area);
  const cart=document.createElement('div');cart.id='salonBookingCart';cart.className='field full card';
  cart.style.margin='10px 0';
  const summary=form.querySelector('#portalQuantitySummary');
  (summary||form.querySelector('button[type="submit"]')).before(cart);
  const search=area.querySelector('#salonCartSearch');
  const results=area.querySelector('#salonCartResults');
  const hint=area.querySelector('#salonCartSearchHint');
  const normal=v=>String(v||'').toLocaleLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
  const fieldOf=item=>Array.from(grid.querySelectorAll('input[name^="serviceQty_"]')).find(el=>el.name==='serviceQty_'+item.id);
  const qty=item=>Math.max(0,Number(fieldOf(item)?.value||0));
  const total=()=>all.reduce((n,x)=>n+qty(x),0);
  const change=(item,delta)=>{
   const el=fieldOf(item);if(!el)return;
   const next=qty(item)+delta;
   if(next<0||next>10){toast('الحد الأقصى 10 مرات للخدمة الواحدة');return}
   el.value=String(next);el.dispatchEvent(new Event('input',{bubbles:true}));
   drawResults();drawCart();
  };
  function drawResults(){
   results.replaceChildren();const q=normal(search.value);
   if(!q){hint.textContent='اكتبي اسم الخدمة لتظهر الخيارات.';return}
   const matches=all.filter(x=>normal((x.name||'')+' '+(x.nameEn||'')).includes(q)).slice(0,15);
   hint.textContent=matches.length?'اضغطي إضافة لإرسال الخدمة إلى سلة الحجز.':'لا توجد خدمات مطابقة.';
   matches.forEach(item=>{
    const line=document.createElement('div');line.className='service';line.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px';
    const title=document.createElement('div');
     const name=document.createElement('strong');name.textContent=lang==='en'?(item.nameEn||item.name):item.name;title.append(name);
     const activePromo=salonOfferIsActive(item.sale);
     if(activePromo){const badge=document.createElement('span');badge.className='salon-promo-badge';badge.textContent=(lang==='en'?'SALE ':'خصم ')+Number(item.sale.percent)+'%';title.append(' ',badge);
       const price=document.createElement('div');price.innerHTML='<s class="muted">'+money(item.originalPrice)+'</s> <b>'+money(salonEffectivePrice(item.originalPrice,item.sale))+'</b>';title.append(price);
     }else{const price=document.createElement('div');price.textContent=money(salonEffectivePrice(item.originalPrice??item.price,item.sale));title.append(price)}
     const time=document.createElement('small');time.textContent=' ('+(Number(item.duration)||30)+' '+(lang==='en'?'min':'دقيقة')+')';title.append(time);
    const add=document.createElement('button');add.type='button';add.className='btn';add.textContent='إضافة +';add.disabled=qty(item)>=10;add.onclick=()=>change(item,1);
    line.append(title,add);results.append(line);
   });
  }
  function drawCart(){
   cart.replaceChildren();const h=document.createElement('h3');h.textContent='🛍️ سلة خدمات الحجز';cart.append(h);
   let price=0,duration=0;const selected=all.filter(x=>qty(x)>0);
   if(!selected.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='السلة فارغة. ابحثي عن خدمة وأضيفيها.';cart.append(empty)}
   selected.forEach(item=>{
    const count=qty(item);price+=count*salonEffectivePrice(item.originalPrice??item.price,item.sale);duration+=count*(Number(item.duration)||30);
    const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)';
    const name=document.createElement('span');const unit=salonEffectivePrice(item.originalPrice??item.price,item.sale);name.textContent=(lang==='en'?(item.nameEn||item.name):item.name)+' ×'+count+' — '+money(unit*count);if(salonOfferIsActive(item.sale)){const mark=document.createElement('span');mark.className='salon-promo-badge';mark.textContent=' '+(lang==='en'?'SALE ':'خصم ')+Number(item.sale.percent)+'%';name.append(mark)}
    const controls=document.createElement('span');controls.style.cssText='display:flex;align-items:center;gap:10px';
    const minus=document.createElement('button');minus.type='button';minus.className='btn secondary';minus.textContent='−';minus.onclick=()=>change(item,-1);
    const n=document.createElement('strong');n.textContent=String(count);
    const plus=document.createElement('button');plus.type='button';plus.className='btn secondary';plus.textContent='+';plus.disabled=qty(item)>=10;plus.onclick=()=>change(item,1);
    controls.append(minus,n,plus);row.append(name,controls);cart.append(row);
   });
   const foot=document.createElement('p');foot.style.fontWeight='bold';foot.textContent='إجمالي عدد الخدمات: '+total()+' (الحد 10 لكل خدمة) — الإجمالي: '+money(price)+' — المدة: '+duration+' دقيقة';cart.append(foot);
   if(summary)summary.textContent='اختاري الموظفة والتاريخ والوقت بعد إضافة الخدمات إلى السلة.';
  }
  search.addEventListener('input',drawResults);
  const oldSubmit=form.onsubmit;
  form.onsubmit=function(e){
   const n=total();if(n<1){e.preventDefault();toast('أضيفي خدمة واحدة على الأقل إلى السلة');return false}
   if(typeof oldSubmit==='function')return oldSubmit.call(this,e);
  };
  drawResults();drawCart();
 };
})();
</script>

<script>
/* All bookings are read from portalBookings; employee UID is the sole scope. */
(function(){
'use strict';
const bookingRef=firestore.collection('portalBookings');
const profilesRef=firestore.collection('employeeProfiles');
const ownerUid='AvRinM2frzLkDWH1CsH7CnIhFnK2';
let watchUid=null, stopWatch=null, bookingIssue='';
const myUid=()=>auth.currentUser?.uid||'';
const ownerVerified=()=>db.session?.type==='owner'&&firebaseReady&&myUid()===ownerUid;
const employeeVerified=()=>portalRole==='employee'&&portalUser?.active===true&&myUid()!=='';
const statusNames={pending:'بانتظار تأكيد المالكة',confirmed:'تم تأكيد الحجز',arrived:'وصلت العميلة',inProgress:'بدأت الخدمة',started:'بدأت الخدمة',completed:'تم الانتهاء',cancelled:'ملغي',noShow:'لم تحضر'};
function stopEmployeeListener(){if(stopWatch){try{stopWatch()}catch(e){console.warn(e)}stopWatch=null}watchUid=null;}
const legacyClear=clearSession;
clearSession=async function(){stopEmployeeListener();return legacyClear()};
loadPortalBookings=async function(){
 const account=myUid();if(!account){portalBookings=[];return portalBookings}
 if(portalRole!=='employee'&&portalRole!=='client'){portalBookings=[];return portalBookings}
 const field=portalRole==='employee'?'staffUid':'clientUid';
 const snap=await bookingRef.where(field,'==',account).get();
 portalBookings=snap.docs.map(doc=>({id:doc.id,...doc.data()}));
 bookingIssue='';return portalBookings;
};
function watchEmployeeBookings(){
 const account=myUid();if(!employeeVerified()||!account)return;
 if(watchUid===account&&stopWatch)return;
 stopEmployeeListener();watchUid=account;
 stopWatch=bookingRef.where('staffUid','==',account).onSnapshot(snapshot=>{
  if(portalRole!=='employee'||myUid()!==account){stopEmployeeListener();return}
  const list=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
  portalBookings=list;bookingIssue='';
  const current=document.getElementById('employeeBookingBoard');
  if(current&&document.activeElement?.closest('#employeeRequestForm'))return;
  renderPortalEmployee();
 },error=>{
  bookingIssue=error.code==='permission-denied'?'يجب نشر قواعد Firestore المرفقة للسماح للموظفة بعرض حجوزاتها.':String(error.message||error);
  const el=document.getElementById('employeeBookingError');if(el)el.textContent=bookingIssue;
  stopEmployeeListener();
 });
}
renderPortalEmployee=function(){
 applyLang();document.querySelector('#homeBtn')?.classList.remove('hidden');
 const en=lang==='en';
 const tr=(ar,eng)=>en?eng:ar;
 const statusWords={
  pending:tr('بانتظار تأكيد المالكة','Awaiting owner confirmation'),
  confirmed:tr('تم تأكيد الحجز','Booking confirmed'),
  arrived:tr('وصلت العميلة','Client arrived'),
  inProgress:tr('بدأت الخدمة','Service started'),
  started:tr('بدأت الخدمة','Service started'),
  completed:tr('تم الانتهاء','Service completed'),
  cancelled:tr('ملغي','Cancelled'),
  noShow:tr('لم تحضر','No-show')
 };
 if(!employeeVerified()){
  document.querySelector('#app').innerHTML=`<div class="card"><h3>${tr('حساب الموظفة غير مفعل','Employee account inactive')}</h3><p>${tr('تأكدي من الربط بالإيميل وUID لدى المالكة.','Ask the owner to verify your email and UID link.')}</p><button type="button" class="btn" id="employeeLogout">${t('logout')}</button></div>`;
  document.querySelector('#employeeLogout').onclick=clearSession;return;
 }
 const p=portalUser,rights=p.permissions||{},account=myUid();
 const myBookings=(portalBookings||[]).filter(b=>String(b.staffUid||'')===account&&b.status!=='pending').sort((a,b)=>(String(a.date||'')+String(a.time||'')).localeCompare(String(b.date||'')+String(b.time||'')));
 const todays=myBookings.filter(b=>b.date===today()&&!['cancelled','noShow'].includes(b.status));
 const pending=myBookings.filter(b=>!['completed','cancelled','noShow'].includes(b.status)&&b.date!==today());
 const history=myBookings.filter(b=>['completed','cancelled','noShow'].includes(b.status)&&b.date!==today()).slice(-40).reverse();
 const serviceLabel=b=>{
  const ids=Array.isArray(b.serviceIds)?b.serviceIds:[];
  if(en&&ids.length){
   const catalog=portalCatalog.services||[];
   const translated=ids.map(id=>catalog.find(s=>String(s.id)===String(id)));
   if(translated.every(Boolean))return translated.map(s=>s.nameEn||s.name).join(', ');
  }
  return b.serviceName||'—';
 };
 const card=b=>{
  const stage=b.status||'pending',name=b.clientName||tr('غير مسجل','Not recorded'),nameEn=b.clientNameEn||'',phone=b.clientPhone||'';
  const next=stage==='confirmed'?'arrived':stage==='arrived'?'inProgress':stage==='inProgress'?'completed':null;
  const label=next==='arrived'?tr('وصلت العميلة','Client arrived'):next==='inProgress'?tr('بدء الخدمة','Start service'):tr('تم الانتهاء من الخدمة','Complete service');
  return `<article class="employee-booking-card"><div class="spread"><strong>${esc(b.date||'')} — ${esc(b.time||'')}</strong><span class="badge ${stage==='completed'?'green':stage==='confirmed'?'green':''}">${esc(statusWords[stage]||stage)}</span></div>
   <p><b>${tr('اسم العميلة بالعربي:','Client name (Arabic):')}</b> ${esc(name)}</p>
   <p><b>${tr('اسم العميلة بالإنجليزي:','Client name (English):')}</b> <span dir="ltr">${esc(nameEn||tr('غير مسجل للحجوزات القديمة','Not recorded for this booking'))}</span></p>
   <p><b>${tr('رقم الجوال:','Mobile number:')}</b> <span dir="ltr">${esc(phone||tr('غير متوفر','Not available'))}</span></p>
   <p><b>${tr('الخدمات:','Services:')}</b> ${esc(serviceLabel(b))}</p><p><b>${tr('المكان:','Location:')}</b> ${tr(b.location==='home'?'خدمة منزلية':'داخل الصالون',b.location==='home'?'Home service':'At the salon')}</p>
   ${b.notes?`<p><b>${tr('ملاحظات:','Notes:')}</b> ${esc(b.notes)}</p>`:''}
   ${next?`<div class="row"><button type="button" class="btn ${next==='completed'?'success':''}" data-employee-booking="${esc(b.id)}" data-employee-next="${next}">${label}</button></div>`:''}</article>`;
 };
 const notice=bookingIssue?(en&&bookingIssue.includes('قواعد Firestore')?'Please publish the Firestore rules allowing employees to view their assigned bookings.':bookingIssue):tr('تظهر الحجوزات تلقائيًا عند تأكيدها من المالكة.','Bookings appear automatically when confirmed by the owner.');
 document.querySelector('#app').innerHTML=`${headerPanel(t('employeePortal'),p.name||'')}
  <section id="employeeBookingBoard"><div class="stats"><div class="stat"><span>${tr('حجوزات اليوم',"Today's bookings")}</span><strong>${todays.length}</strong></div><div class="stat"><span>${tr('الحجوزات النشطة','Active bookings')}</span><strong>${myBookings.filter(b=>!['completed','cancelled','noShow'].includes(b.status)).length}</strong></div>${rights.ownSalary===true?`<div class="stat"><span>${tr('الراتب','Salary')}</span><strong>${p.salaryVisible===true?money(p.salary):tr('غير محدد','Not set')}</strong></div>`:''}</div>
  <p class="notice ${bookingIssue?'bad':'good'}" id="employeeBookingError" role="status">${esc(notice)}</p>
  <div class="section-head"><h3>${tr('حجوزات اليوم',"Today's bookings")}</h3></div>${todays.map(card).join('')||`<p class="empty">${tr('لا توجد حجوزات لهذا اليوم','No bookings for today')}</p>`}
  <div class="section-head"><h3>${tr('الحجوزات القادمة والمعلقة','Upcoming and pending bookings')}</h3></div>${pending.map(card).join('')||`<p class="empty">${tr('لا توجد حجوزات قادمة أو معلقة','No upcoming or pending bookings')}</p>`}
  <div class="section-head"><h3>${tr('الحجوزات السابقة المكتملة','Previous completed bookings')}</h3></div>${history.map(card).join('')||`<p class="empty">${tr('لا توجد حجوزات مكتملة سابقة','No previous completed bookings')}</p>`}
  <div class="row"><button type="button" class="btn secondary" id="refreshEmployeeBookings">${tr('تحديث الحجوزات','Refresh bookings')}</button><button type="button" class="btn danger" id="employeeLogout">${t('logout')}</button></div>
  ${rights.leaveRequest!==false?`<section class="card" style="margin-top:14px"><h3>${tr('طلب إجازة أو تبديل وردية','Leave or shift-change request')}</h3><form id="employeeRequestForm" class="form-grid"><div class="field"><label>${tr('نوع الطلب','Request type')}</label><select name="type"><option value="leave">${tr('إجازة','Leave')}</option><option value="shift">${tr('تبديل وردية','Shift change')}</option></select></div><div class="field"><label>${t('date')}</label><input name="date" type="date" min="${today()}" required></div><div class="field full"><label>${t('notes')}</label><textarea name="notes" maxlength="300"></textarea></div><button type="submit" class="btn full">${tr('إرسال الطلب','Submit request')}</button></form></section>`:''}
  </section>`;
 const root=document.querySelector('#employeeBookingBoard');
 root.onclick=e=>{const btn=e.target.closest('button[data-employee-next]');if(btn)setEmployeeBookingStatus(btn.dataset.employeeBooking,btn.dataset.employeeNext,btn)};
 root.querySelector('#refreshEmployeeBookings').onclick=async()=>{try{await loadPortalBookings();renderPortalEmployee();toast(tr('تم تحديث حجوزاتك','Bookings refreshed'))}catch(err){bookingIssue=err.code==='permission-denied'?tr('تحققي من نشر قواعد Firestore الجديدة','Check the new Firestore rules'):String(err.message||err);renderPortalEmployee()}};
 root.querySelector('#employeeLogout').onclick=clearSession;
 const f=root.querySelector('#employeeRequestForm');if(f)f.onsubmit=async e=>{
  e.preventDefault();const d=new FormData(f),btn=f.querySelector('button[type=submit]');btn.disabled=true;
  try{await firestore.collection('staffRequests').add({employeeUid:account,employeeName:String(p.name||''),type:String(d.get('type')),date:String(d.get('date')),notes:String(d.get('notes')||''),status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});f.reset();toast(tr('تم حفظ الطلب','Request submitted'))}
  catch(err){toast(tr('تعذر إرسال الطلب: ','Could not submit request: ')+err.message)}finally{if(btn.isConnected)btn.disabled=false}
 };
 try{if(typeof syncSalonTheme==='function')syncSalonTheme()}catch(e){console.warn('Theme:',e)}
 watchEmployeeBookings();
};
setEmployeeBookingStatus=async function(id,next,button){
 if(!employeeVerified()||!['arrived','inProgress','completed'].includes(next))return;
 const item=(portalBookings||[]).find(b=>String(b.id)===String(id)&&String(b.staffUid)===myUid());
 const transitions={confirmed:'arrived',arrived:'inProgress',inProgress:'completed'};
 if(!item||transitions[item.status]!==next){toast(lang==='en'?'Invalid status sequence. Refresh your bookings.':'تسلسل مراحل الخدمة غير صحيح؛ حدّثي حجوزاتك.');return}
 if(next==='completed'&&!confirm(lang==='en'?'Confirm service completion?':'تأكيد انتهاء الخدمة؟'))return;
 if(button)button.disabled=true;
 try{await bookingRef.doc(id).update({status:next});await loadPortalBookings();renderPortalEmployee();toast(lang==='en'?'Booking status saved':'تم حفظ حالة الحجز')}
 catch(err){toast((lang==='en'?'Could not update booking: ':'تعذر تحديث الحجز: ')+(err.code==='permission-denied'?(lang==='en'?'Publish the updated Firestore rules.':'تحتاجين نشر قواعد Firestore الجديدة.'):err.message));if(button?.isConnected)button.disabled=false}
};
// The owner may confirm only appointments assigned to a Firebase-linked active employee.
window.ownerConfirmSavedBooking=async function(id){
 if(!ownerVerified())return;
 try{
  const ref=bookingRef.doc(id),snapshot=await ref.get();if(!snapshot.exists)throw Error('الحجز غير موجود');
  const b=snapshot.data();
  const staff=(db.staff||[]).find(s=>s.active!==false&&s.authUid&&(String(s.authUid)===String(b.staffUid)||String(s.id)===String(b.staffUid)));
  if(!staff)throw Error('الموظفة غير مربوطة بحساب Firebase نشط. اربطي UID والإيميل أولًا، ثم أكدي الحجز.');
  const p=await profilesRef.doc(staff.authUid).get();if(!p.exists||p.data().active!==true||p.data().archived===true)throw Error('حساب الموظفة موقوف أو غير مربوط. فعّليه من حسابات الموظفات.');
  if(!confirm('هل استلمتِ العربون وتريدين تأكيد الحجز للموظفة '+staff.name+'؟'))return;
  await ref.update({status:'confirmed',depositStatus:'paid',staffUid:staff.authUid,staffName:staff.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  if(typeof showPortalBookingsOwner==='function')await showPortalBookingsOwner();
  toast('تم تأكيد الحجز وأصبح ظاهرًا للموظفة');
 }catch(err){toast('تعذر تأكيد الحجز: '+String(err.message||err))}
};
// Also fix the confirmation button in the main "الحجوزات والمواعيد" daily view.
window.dailyPortalStatus=async function(id,status){
 if(!ownerVerified())return;
 try{
  if(status==='confirmed'){
   const ref=bookingRef.doc(id),snap=await ref.get();if(!snap.exists)throw Error('الحجز غير موجود');
   const b=snap.data(),staff=(db.staff||[]).find(s=>s.active!==false&&s.authUid&&(String(s.id)===String(b.staffUid)||String(s.authUid)===String(b.staffUid)));
   if(!staff)throw Error('يجب ربط حساب الموظفة بالإيميل وUID أولًا');
   const prof=await profilesRef.doc(staff.authUid).get();
   if(!prof.exists||prof.data().active!==true||prof.data().archived===true)throw Error('حساب الموظفة غير مفعل');
   if(!confirm('تأكيد الحجز وإرساله إلى حساب الموظفة '+staff.name+'؟'))return;
   await ref.update({status:'confirmed',staffUid:staff.authUid,staffName:staff.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }else{
   if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز؟'))return;
   await bookingRef.doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  }
  if(typeof ownerTab==='function'&&ownerActiveTab==='appointments')ownerTab('appointments');
  toast('تم حفظ تحديث الحجز، وسيظهر للموظفة إذا كان مؤكدًا');
 }catch(e){toast('تعذر تحديث الحجز: '+String(e.message||e))}
};
window.confirmPortalBooking=window.ownerConfirmSavedBooking;
// Staff changes from booking editing must also update staffUid (not only staffName).
window.ownerEditSavedBooking=async function(id){
 if(!ownerVerified())return;
 try{
  const ref=bookingRef.doc(id),snap=await ref.get();if(!snap.exists)throw Error('الحجز غير موجود');const b=snap.data();
  const service=prompt('اسم الخدمة',b.serviceName||'');if(service===null)return;
  const available=(db.staff||[]).filter(s=>s.active!==false&&s.authUid);
  const staffName=prompt('اسم الموظفة (المربوط حسابها في Firebase):\n'+available.map(s=>'• '+s.name).join('\n'),b.staffName||'');if(staffName===null)return;
  const matching=available.filter(s=>s.name.trim().toLowerCase()===staffName.trim().toLowerCase());
  if(matching.length!==1)throw Error('اختاري اسم موظفة واحدة من القائمة، وتحققي من ربط UID لها');
  const date=prompt('التاريخ YYYY-MM-DD',b.date||'');if(date===null)return;
  const time=prompt('الوقت HH:MM',b.time||'');if(time===null)return;
  if(!service.trim()||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)||!/^[0-9]{2}:[0-9]{2}$/.test(time))throw Error('تحققي من الخدمة والتاريخ والوقت');
  await ref.update({serviceName:service.trim().slice(0,500),staffName:matching[0].name,staffUid:matching[0].authUid,date,time,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  if(typeof showPortalBookingsOwner==='function')await showPortalBookingsOwner();toast('تم تعديل الحجز وربطه بحساب الموظفة الصحيح');
 }catch(err){toast('تعذر تعديل الحجز: '+String(err.message||err))}
};
// Edit, suspend/reactivate and retire employee accounts without deleting Authentication identities.
const lastOwnerRender=renderOwner;
renderOwner=function(tab=ownerActiveTab){
 lastOwnerRender(tab);
 if(tab!=='staff'||!ownerVerified())return;
 const host=document.querySelector('#app .owner-content')||document.querySelector('#app');
 const section=document.createElement('section');section.className='card';section.style.margin='14px 0';
 section.innerHTML='<div class="spread"><h3>تعديل وإيقاف حساب الموظفة</h3><button type="button" class="btn secondary small" id="refreshEmployeeAccountPanel">تحديث</button></div><p class="muted tiny">التعديل والإيقاف مجانيان في Firestore. إيقاف الحساب يمنع دخول بوابة الموظفة ويخفيها عن حجز العميلات. حذف حساب Authentication النهائي يتم يدويًا من Firebase.</p><div id="employeeAccountEditorList">جارٍ تحميل الحسابات…</div>';
 host.prepend(section);
 const load=async()=>{
  const root=section.querySelector('#employeeAccountEditorList');if(!root?.isConnected)return;
  try{
   const snapshot=await profilesRef.get();const profiles=snapshot.docs.filter(d=>d.data().archived!==true);
   root.innerHTML=profiles.length?profiles.map(d=>{
    const p=d.data(),s=(db.staff||[]).find(x=>x.authUid===d.id||x.id===p.staffId);
    return `<div class="employee-account-card" data-account="${esc(d.id)}"><div class="spread"><div><b>${esc(p.name||s?.name||'موظفة')}</b><p class="muted tiny" dir="ltr">${esc(p.email||'')} | UID: ${esc(d.id)}</p></div><span class="badge ${p.active===true?'green':'red'}">${p.active===true?'مفعلة':'موقوفة'}</span></div>
     <div class="row"><button type="button" class="btn secondary small" data-account-action="edit">تعديل الحساب</button><button type="button" class="btn ${p.active===true?'danger':'success'} small" data-account-action="toggle">${p.active===true?'إيقاف الحساب':'إعادة التفعيل'}</button><button type="button" class="btn danger small" data-account-action="retire">حذف من قوائم الصالون</button></div>
     <form class="form-grid hidden" data-employee-edit><div class="field"><label>اسم الموظفة</label><input name="name" value="${esc(p.name||s?.name||'')}" maxlength="80" required></div><div class="field"><label>الإيميل المسجل في Authentication</label><input name="email" type="email" dir="ltr" value="${esc(p.email||'')}" required></div><div class="field"><label>رقم الجوال</label><input name="phone" type="tel" value="${esc(s?.phone||'')}" maxlength="20"></div><div class="row full"><button type="submit" class="btn">حفظ التعديل</button></div></form></div>`;
   }).join(''):'<p class="empty">لا توجد حسابات موظفات مرتبطة</p>';
  }catch(e){root.textContent='تعذر عرض الموظفات: '+(e.message||e)}
 };
 section.querySelector('#refreshEmployeeAccountPanel').onclick=load;
 section.querySelector('#employeeAccountEditorList').addEventListener('click',event=>{
  const button=event.target.closest('[data-account-action]');if(!button)return;
  const card=button.closest('[data-account]');if(!card)return;
  if(button.dataset.accountAction==='edit'){card.querySelector('form[data-employee-edit]')?.classList.toggle('hidden');return}
  employeeAccountAction(card.dataset.account,button.dataset.accountAction,button,null);
 });
 section.querySelector('#employeeAccountEditorList').addEventListener('submit',event=>{
  const form=event.target.closest('form[data-employee-edit]');if(!form)return;event.preventDefault();
  const card=form.closest('[data-account]');employeeAccountAction(card.dataset.account,'save',form.querySelector('button[type=submit]'),new FormData(form));
 });
 load();
};

// Route the roster delete button through the same secure profile retirement path as the account editor.
// Authentication users remain intact for the owner to delete manually from Firebase Console.
window.deleteStaff=async function(staffId){
 if(!ownerVerified())return;
 const staff=(db.staff||[]).find(s=>String(s.id)===String(staffId));
 if(!staff){toast('لم أجد الموظفة');return}
 if(staff.authUid){await employeeAccountAction(String(staff.authUid),'retire',null,null);return}
 if(!confirm('هذه الموظفة غير مرتبطة بحساب Firebase. هل تريدين إزالتها من قائمة الصالون والعميلات مع إبقاء السجلات القديمة؟'))return;
 try{
  await saveQueue;
  const newStaff=db.staff.filter(s=>String(s.id)!==String(staffId));
  const clean=a=>(a||[]).map(({password,...rest})=>rest);
  const cloud={...db,clients:clean(db.clients),staff:clean(newStaff),session:null,updatedAt:new Date().toISOString(),schemaVersion:3};
  const newPublicStaff=newStaff.filter(s=>s.active!==false&&s.authUid).map(s=>({id:String(s.id),authUid:String(s.authUid),name:String(s.name||''),active:true}));
  const batch=firestore.batch();
  batch.set(salonDoc,cloud);
  batch.set(firestore.collection('portal').doc('catalog'),{staff:newPublicStaff},{merge:true});
  await batch.commit();db.staff=newStaff;toast('حُذفت الموظفة من قوائم الصالون والعميلات');renderOwner('staff');
 }catch(e){toast('تعذر إزالة الموظفة: '+String(e.message||e))}
};
async function employeeAccountAction(id,action,button,data){
 if(!ownerVerified()||!['toggle','retire','save'].includes(action))return;
 if(button)button.disabled=true;
 try{
  await saveQueue;
  const ref=profilesRef.doc(id),snap=await ref.get();if(!snap.exists)throw Error('حساب الموظفة غير موجود');
  const p=snap.data(),related=(db.staff||[]).find(x=>x.authUid===id||x.id===p.staffId);
  let roster=(db.staff||[]).map(x=>({...x}));let changes={updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  if(action==='toggle'){
   if(!confirm(p.active===true?'إيقاف دخول الموظفة وإخفاؤها من قائمة حجز العميلات؟':'إعادة تفعيل الحساب وإظهاره للعميلات؟'))return;
   const active=p.active!==true;changes={...changes,active,archived:false};roster=roster.map(x=>x.authUid===id||x.id===p.staffId?{...x,active}:x);
  }else if(action==='retire'){
   if(!confirm('حذف الموظفة من قوائم الصالون والعميلات وتعطيل صلاحيتها؟ حساب Firebase Authentication يبقى ويمكنك حذفه بنفسك.'))return;
   changes={...changes,active:false,archived:true,archivedAt:firebase.firestore.FieldValue.serverTimestamp()};
   roster=roster.filter(x=>x.authUid!==id&&x.id!==p.staffId);
  }else{
   const name=String(data?.get('name')||'').trim(),email=String(data?.get('email')||'').trim().toLowerCase(),phone=String(data?.get('phone')||'').trim();
   if(!name||name.length>80||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||phone.length>20)throw Error('راجعي الاسم والإيميل ورقم الجوال');
   if(email!==String(p.email||'').trim().toLowerCase()&&!confirm('تغيير الإيميل هنا لا يغيره في Firebase Authentication. يجب تغييره هناك أيضًا قبل تسجيل الدخول. متابعة؟'))return;
   const others=await profilesRef.get();if(others.docs.some(d=>d.id!==id&&d.data().archived!==true&&String(d.data().email||'').toLowerCase()===email))throw Error('الإيميل مرتبط بموظفة أخرى');
   changes={...changes,name,email};roster=roster.map(x=>x.authUid===id||x.id===p.staffId?{...x,name,email,phone}:x);
  }
  if(action!=='retire'&&!related)throw Error('لم أجد الموظفة في قائمة الصالون؛ استخدمي ربط UID والإيميل أولًا');
  const clean=a=>(a||[]).map(({password,...entry})=>entry);
  const cloud={...db,staff:clean(roster),clients:clean(db.clients),session:null,updatedAt:new Date().toISOString(),schemaVersion:3};
  const publicStaff=roster.filter(x=>x.active!==false&&!!x.authUid).map(x=>({id:String(x.id),authUid:String(x.authUid),name:String(x.name||''),active:true}));
  const batch=firestore.batch();batch.set(salonDoc,cloud);batch.set(ref,changes,{merge:true});batch.set(firestore.collection('portal').doc('catalog'),{staff:publicStaff},{merge:true});
  await batch.commit();db.staff=roster;
  toast(action==='toggle'?(p.active===true?'تم إيقاف حساب الموظفة':'تمت إعادة تفعيل الحساب'):action==='save'?'تم تعديل الحساب':'تم حذف الموظفة من قوائم الصالون');
  renderOwner('staff');
 }catch(e){toast('تعذر تحديث الحساب: '+(e.message||e))}finally{if(button?.isConnected)button.disabled=false}
}
})();
</script>

function isBlocked(date,time,staffId){return db.blocks.some(b=>b.date===date&&(b.staffId==="all"||b.staffId===staffId)&&(b.fullDay||(time>=b.startTime&&time<b.endTime)))}

function renderClient(){if(db.session?.type!=="client"||!currentUser()){renderHome();return}$("#homeBtn").classList.remove("hidden");applyLang();$("#app").innerHTML=headerPanel(t("clientPortal"),`${currentUser().name} • ${currentUser().code}`)+clientPanel()+`<div class="section-head"><button class="btn danger" onclick="clearSession()">${esc(t("logout"))}</button></div>`;$("#bookingDate").addEventListener("change",updateSlotHint);$("#bookingStaff").addEventListener("change",updateSlotHint);$("#bookingService").addEventListener("change",updateSlotHint);$("#bookingForm").addEventListener("submit",createBooking)}
function updateSlotHint(){const date=$("#bookingDate").value,staff=$("#bookingStaff").value,services=Array.from($("#bookingService").selectedOptions).map(o=>db.services.find(s=>s.id===o.value)).filter(Boolean);const duration=services.reduce((n,s)=>n+(Number(s.duration)||30),0);const time=$("#bookingTime").value;let msg="";if(date&&date<today())msg=t("datePast");else if(date&&db.blocks.some(b=>b.date===date&&b.fullDay&&(b.staffId==="all"||b.staffId===staff)))msg=t("dayClosed");else if(date&&time&&staff&&(isBlocked(date,time,staff)||conflicts(date,time,staff,duration||30)))msg=t("timeTaken");else msg="";$("#slotHint").textContent=msg||t("noSlots");$("#slotHint").className="notice full"+(msg?" bad":"")}
function createBooking(e){e.preventDefault();const c=currentUser(),services=Array.from($("#bookingService").selectedOptions).map(o=>db.services.find(s=>s.id===o.value&&s.active!==false)).filter(Boolean),staff=db.staff.find(s=>s.id===$("#bookingStaff").value&&s.active!==false),date=$("#bookingDate").value,time=$("#bookingTime").value;if(!c||!services.length||!staff||!date||!time){toast(t("required"));return}if(date<today()){toast(t("datePast"));return}const duration=services.reduce((n,s)=>n+(Number(s.duration)||30),0),start=timeToMin(time),end=start+duration;const blocked=db.blocks.some(b=>b.date===date&&(b.staffId==="all"||b.staffId===staff.id)&&(b.fullDay||(start<timeToMin(b.endTime)&&end>timeToMin(b.startTime))));if(blocked||conflicts(date,time,staff.id,duration)){toast(t("timeTaken"));return}const name=services.map(s=>textService(s)).join("، "),price=services.reduce((n,s)=>n+(Number(s.price)||0),0);const b={id:uid("book"),clientId:c.id,clientCode:c.code,customerName:c.name,phone:c.phone,serviceId:services[0].id,serviceIds:services.map(s=>s.id),serviceName:name,staffId:staff.id,date,time,duration,price,notes:$("#bookingNotes").value.trim(),status:"pending",createdAt:new Date().toISOString()};db.bookings.push(b);persist();const msg=`طلب حجز - ${db.settings.salonName}\nكود العميلة: ${c.code}\nالاسم: ${c.name}\nالخدمات: ${name}\nالموظفة: ${staff.name}\nالتاريخ: ${date}\nالوقت: ${time}\nالمدة: ${duration} دقيقة\nالسعر: ${money(price)}\nرقم الطلب: ${b.id}`;renderClient();window.open(`https://wa.me/${db.settings.whatsapp||WA_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener,noreferrer");toast(t("bookingSuccess"))}

function clientsPanel(){return `<div class="card"><div class="spread"><div><h3>إدارة العميلات</h3><p class="muted">عرض وتعديل بيانات العميلات ونقاط الولاء.</p></div><input id="clientSearch" placeholder="ابحثي بالاسم أو الجوال أو الكود" oninput="filterClients()" style="max-width:360px;padding:10px;border:1px solid var(--line);border-radius:10px"></div><form id="clientAddForm" class="form-grid" style="margin-top:14px"><div class="field"><label>اسم العميلة</label><input name="name" required maxlength="100"></div><div class="field"><label>رقم الجوال</label><input name="phone" required maxlength="20"></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email"></div><div class="field"><label>النقاط الافتتاحية</label><input name="points" type="number" min="0" step="1" value="0"></div><button class="btn full">إضافة عميلة</button></form></div><div class="section-head"><h3>سجل العميلات (${db.clients.length})</h3></div><div id="clientsTable">${clientsTable(db.clients)}</div>`}
function clientsTable(list){if(!list.length)return `<div class="empty">لا توجد عميلات بعد. يمكنك إضافتهن من النموذج أعلاه.</div>`;return `<div class="table-wrap"><table><thead><tr><th>الكود</th><th>اسم العميلة</th><th>الجوال</th><th>البريد</th><th>النقاط</th><th>عدد الفواتير</th><th>الإجراءات</th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.code||"—")}</td><td>${esc(c.name)}</td><td>${esc(c.phone||"—")}</td><td>${esc(c.email||"—")}</td><td><b>${Number(c.points)||0}</b></td><td>${db.invoices.filter(i=>i.clientId===c.id).length}</td><td><div class="row"><button class="btn secondary small" onclick="editClient('${c.id}')">تعديل</button><button class="btn small" onclick="adjustClientPoints('${c.id}')">تعديل النقاط</button></div></td></tr>`).join("")}</tbody></table></div>`}
function setupClients(){const f=$("#clientAddForm");if(!f)return;f.addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(f),phone=String(fd.get("phone")).trim();if(db.clients.some(c=>c.phone===phone)){toast("رقم الجوال مسجل مسبقًا");return}const c={id:uid("cl"),code:"CL-"+db.counter++,name:String(fd.get("name")).trim(),phone,email:String(fd.get("email")).trim(),points:Math.max(0,Math.floor(Number(fd.get("points"))||0)),createdAt:new Date().toISOString()};db.clients.push(c);persist();renderOwner("clients");toast("تمت إضافة العميلة")})}
function filterClients(){const q=( $("#clientSearch").value||"").trim().toLowerCase();$("#clientsTable").innerHTML=clientsTable(db.clients.filter(c=>[c.name,c.phone,c.email,c.code].some(v=>String(v||"").toLowerCase().includes(q))))}
function editClient(id){const c=db.clients.find(x=>x.id===id);if(!c)return;const name=prompt("اسم العميلة",c.name);if(name===null)return;const phone=prompt("رقم الجوال",c.phone||"");if(phone===null)return;const email=prompt("البريد الإلكتروني",c.email||"");if(email===null)return;c.name=name.trim();c.phone=phone.trim();c.email=email.trim();persist();renderOwner("clients")}
function adjustClientPoints(id){const c=db.clients.find(x=>x.id===id);if(!c)return;const n=prompt(`نقاط ${c.name} الحالية ${Number(c.points)||0}. أدخلي العدد الجديد للنقاط:`,String(c.points||0));if(n===null)return;if(!Number.isInteger(Number(n))||Number(n)<0){toast("أدخلي عدد نقاط صحيحًا");return}c.points=Number(n);persist();renderOwner("clients");toast("تم تحديث النقاط")}


function ownerBookingPanel(){return `<div class="card"><h2>تسجيل حجز جديد</h2><p class="muted">الحجز مستقل عن الكاشير ولا يصدر فاتورة أو يضيف نقاط ولاء حتى يتم الدفع.</p><form id="ownerBookingForm" class="form-grid"><div class="field"><label>اختيار العميلة</label><select id="obClient"><option value="">عميلة جديدة</option>${db.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.phone)}</option>`).join("")}</select></div><div class="field"><label>اسم العميلة</label><input id="obName" maxlength="100" required></div><div class="field"><label>رقم الجوال</label><input id="obPhone" maxlength="20" required></div><div class="field full"><label>الخدمات (اختاري أكثر من خدمة)</label><div class="service-grid">${activeServices().map(s=>`<label class="service checkline"><input type="checkbox" class="ob-service" value="${esc(s.id)}"> <span>${esc(textService(s))} — ${money(s.price)} — ${Number(s.duration)||30} دقيقة</span></label>`).join("")}</div></div><div class="field"><label>الموظفة</label><select id="obStaff" required><option value="">اختاري الموظفة</option>${activeStaff().map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></div><div class="field"><label>التاريخ</label><input type="date" id="obDate" min="${today()}" max="2050-12-31" value="${today()}" required></div><div class="field"><label>الوقت</label><input type="time" id="obTime" value="16:00" required></div><div class="field"><label>مكان الخدمة</label><select id="obLocation"><option value="salon">في الصالون</option><option value="home" ${db.settings.homeServiceEnabled===true?"":"disabled"}>خدمة منزلية ${db.settings.homeServiceEnabled===true?"":"(غير مفعلة)"}</option></select></div><div class="field full hidden" id="obAddressWrap"><label>عنوان الخدمة المنزلية</label><input id="obAddress" maxlength="250"></div><div class="field full"><label>ملاحظات</label><textarea id="obNotes" rows="2" maxlength="300"></textarea></div><div class="notice good full" id="obSummary">اختاري الخدمات لعرض السعر والمدة.</div><button class="btn full" type="submit">حفظ الحجز</button></form></div>`}
function setupOwnerBooking(){const client=$("#obClient"),name=$("#obName"),phone=$("#obPhone");client.addEventListener("change",()=>{const c=db.clients.find(x=>x.id===client.value);name.value=c?.name||"";phone.value=c?.phone||"";name.readOnly=!!c;phone.readOnly=!!c});$("#obLocation").addEventListener("change",()=>$("#obAddressWrap").classList.toggle("hidden",$("#obLocation").value!=="home"));$$(".ob-service").forEach(x=>x.addEventListener("change",()=>{const services=$$(".ob-service:checked").map(el=>db.services.find(s=>s.id===el.value)).filter(Boolean);$("#obSummary").textContent=`${services.length} خدمات — ${money(services.reduce((a,s)=>a+Number(s.price||0),0))} — ${services.reduce((a,s)=>a+(Number(s.duration)||30),0)} دقيقة`;}));$("#ownerBookingForm").addEventListener("submit",saveOwnerBooking)}
function saveOwnerBooking(e){e.preventDefault();if(db.session?.type!=="owner")return;const services=$$(".ob-service:checked").map(el=>db.services.find(s=>s.id===el.value&&s.active!==false)).filter(Boolean),staff=db.staff.find(x=>x.id===$("#obStaff").value&&x.active!==false),date=$("#obDate").value,time=$("#obTime").value,location=$("#obLocation").value,address=$("#obAddress").value.trim(),name=$("#obName").value.trim(),phone=$("#obPhone").value.trim();if(!services.length||!staff||!date||!time||!name||!phone){toast("أكملي البيانات واختاري خدمة واحدة على الأقل");return}if(date<today()){toast(t("datePast"));return}if(location==="home"&&db.settings.homeServiceEnabled!==true){toast("الخدمة المنزلية غير مفعلة");return}if(location==="home"&&!address){toast("أدخلي عنوان الخدمة المنزلية");return}const duration=services.reduce((a,s)=>a+(Number(s.duration)||30),0),start=timeToMin(time),end=start+duration;if(end>1440){toast("مدة الخدمات تتجاوز نهاية اليوم");return}const blocked=db.blocks.some(b=>b.date===date&&(b.staffId==="all"||b.staffId===staff.id)&&(b.fullDay||(start<timeToMin(b.endTime)&&end>timeToMin(b.startTime))));if(blocked||conflicts(date,time,staff.id,duration)){toast("الموعد يتعارض مع حجز أو وقت مغلق");return}let client=db.clients.find(c=>c.id===$("#obClient").value);if(!client){client=db.clients.find(c=>String(c.phone||"").replace(/\s/g,"")===phone.replace(/\s/g,""));if(!client){client={id:uid("cl"),code:"CL-"+db.counter++,name,phone,points:0,createdAt:new Date().toISOString()};db.clients.push(client)}}const b={id:uid("book"),clientId:client.id,clientCode:client.code,customerName:client.name,phone:client.phone,serviceId:services[0].id,serviceIds:services.map(s=>s.id),serviceName:services.map(s=>textService(s)).join("، "),staffId:staff.id,date,time,duration,price:services.reduce((a,s)=>a+Number(s.price||0),0),serviceLocation:location,homeAddress:location==="home"?address:"",notes:$("#obNotes").value.trim(),status:"pending",createdAt:new Date().toISOString()};db.bookings.push(b);persist();renderOwner("appointments");toast("تم حفظ الحجز بنجاح")}
function cashierPanel(){cashierCart=[];return `<div class="cashier-layout"><section class="card"><div class="spread"><div><h2>الكاشير</h2><p class="muted">أضيفي الخدمات وسجّلي العميلة أو ابحثي عن عميلة مسجلة.</p></div><span class="badge green">نظام الفواتير</span></div><form id="invoiceForm" class="form-grid"><div class="field"><label>البحث عن خدمة</label><input id="serviceSearchCashier" placeholder="اكتبي اسم الخدمة…" autocomplete="off"></div><div class="field"><label>اختاري الخدمة</label><select id="invoiceService"><option value="">اختاري خدمة للإضافة</option>${activeServices().map(s=>`<option value="${s.id}">${esc(textService(s))} — ${money(s.price)}</option>`).join("")}</select></div><div class="full" id="cashierSearchResults"></div>
<div class="card full" style="background:#fff8fb"><div class="spread"><h3 style="margin:0">بيانات العميلة</h3><div class="row"><button type="button" id="customerModeNew" class="btn small" onclick="setCashierCustomerMode('new')">تسجيل عميلة جديدة</button><button type="button" id="customerModeExisting" class="btn secondary small" onclick="setCashierCustomerMode('existing')">البحث عن عميلة</button></div></div><div id="newCustomerFields" class="form-grid" style="margin-top:12px"><div class="field"><label>اسم العميلة</label><input id="newClientName" maxlength="100" placeholder="الاسم الكامل"></div><div class="field"><label>رقم الجوال</label><input id="newClientPhone" maxlength="20" inputmode="tel" placeholder="05xxxxxxxx"></div><div class="field full"><label>البريد الإلكتروني (اختياري)</label><input id="newClientEmail" type="email"></div></div><div id="existingCustomerFields" class="field hidden" style="margin-top:12px"><label>ابحثي بالاسم أو رقم الجوال</label><input id="invoiceClientSearch" placeholder="اكتبي الاسم أو الجوال"><select id="invoiceClient" style="margin-top:8px"><option value="">اختاري العميلة المسجلة</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.phone||c.code||"")})</option>`).join("")}</select><small id="selectedClientInfo" class="muted"></small></div></div>
<div class="field"><label>الموظفة</label><select id="invoiceStaff"><option value="">بدون تحديد</option>${activeStaff().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>طريقة الدفع</label><select id="invoicePayment"><option value="cash">نقدًا</option><option value="card">شبكة</option><option value="transfer">تحويل</option><option value="points">نقاط الولاء</option><option value="mixed">مختلط</option></select></div><div class="field"><label>تاريخ الفاتورة</label><input id="invoiceDate" type="date" min="2024-01-01" max="2050-12-31" value="${today()}" required></div><div class="field"><label>الخصم (ريال)</label><input id="invoiceDiscount" type="number" min="0" step=".01" value="0"></div><div class="field"><label>الضريبة %</label><input id="invoiceTaxRate" type="number" min="0" max="100" step=".01" value="0"></div><div class="field"><label>نقاط إضافية للعميلة</label><input id="invoicePointsAdd" type="number" min="0" step="1" value="0"></div><div class="field"><label>النقاط المستخدمة (كل ${Number(db.settings.redeemPoints)||50} نقطة = خصم ${money(Number(db.settings.redeemRiyals)||10)})</label><input id="invoicePointsUse" type="number" min="0" step="1" value="0"></div><div class="field full"><label>ملاحظات الفاتورة</label><textarea id="invoiceNotes" rows="2" maxlength="500"></textarea></div>
<div class="full"><div class="spread"><b>الخدمات في الفاتورة</b><button type="button" class="btn secondary small" onclick="clearCashierCart()">تفريغ الخدمات</button></div><div id="cashierCartRows" class="card" style="margin-top:8px;background:#fff">لم تتم إضافة خدمات بعد.</div></div><div class="card full" style="background:#fbf2f6"><div class="spread"><span>المجموع قبل الخصم والضريبة</span><b id="cashierSubtotal">0.00 ر.س</b></div><div class="spread"><span>الخصم</span><b id="cashierDiscountView">0.00 ر.س</b></div><div class="spread"><span>الضريبة</span><b id="cashierTaxView">0.00 ر.س</b></div><div class="spread" style="margin-top:8px"><span>الإجمالي النهائي</span><strong class="invoice-total" id="cashierTotal">0.00 ر.س</strong></div></div><button class="btn full" type="submit">إصدار وحفظ الفاتورة${""}</button></form></section><aside><div class="card"><h3>اختصارات الكاشير</h3><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn secondary" onclick="ownerTab('clients')">العميلات</button><button class="btn secondary" onclick="ownerTab('services')">إدارة الخدمات</button><button class="btn secondary" onclick="ownerTab('expenses')">المصروفات</button><button class="btn secondary" onclick="ownerTab('invoices')">سجل الفواتير</button></div><p class="muted tiny" style="margin-top:12px">سجل الفواتير موجود في صفحة مستقلة ويمكن البحث بالتاريخ والشهر والسنة.</p></div><div class="section-head"><h3>ملخص اليوم</h3></div><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><span>فواتير اليوم</span><strong>${db.invoices.filter(i=>(i.date||String(i.createdAt||"").slice(0,10))===today()).length}</strong></div><div class="stat"><span>إيراد اليوم</span><strong>${money(db.invoices.filter(i=>(i.date||String(i.createdAt||"").slice(0,10))===today()).reduce((a,i)=>a+Number(i.total||0),0))}</strong></div></div></aside></div>`}
function setCashierCustomerMode(mode){const isNew=mode==="new";const n=$("#newCustomerFields"),e=$("#existingCustomerFields");if(!n||!e)return;n.classList.toggle("hidden",!isNew);e.classList.toggle("hidden",isNew);$("#customerModeNew").className="btn small "+(isNew?"":"secondary");$("#customerModeExisting").className="btn small "+(!isNew?"":"secondary");$("#newClientName").required=isNew;$("#newClientPhone").required=isNew;$("#invoiceClient").required=!isNew;}
function toggleCashierBookingFields(show){$("#cashierBookingFields")?.classList.toggle("hidden",!show);const ids=["cashierBookingDate","cashierBookingTime","cashierBookingType","cashierBookingStaff"];ids.forEach(id=>{const el=$("#"+id);if(el)el.required=!!show});}
function toggleHomeAddress(type){const wrap=$("#cashierHomeAddressWrap");if(!wrap)return;wrap.classList.toggle("hidden",type!=="home");$("#cashierHomeAddress").required=type==="home";}
function setupCashier(){const service=$("#invoiceService"),search=$("#serviceSearchCashier");if(!service)return;setCashierCustomerMode("new");service.addEventListener("change",()=>{if(service.value)addCashierService(service.value)});search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase(),matches=activeServices().filter(s=>(s.name+" "+(s.nameEn||"")).toLowerCase().includes(q));$("#cashierSearchResults").innerHTML=q?`<div class="service-grid">${matches.map(s=>`<button type="button" class="service" onclick="addCashierService('${s.id}')"><b>${esc(textService(s))}</b><div class="price">${money(s.price)}</div><small>${s.duration} دقيقة</small></button>`).join("")||"لا توجد خدمات مطابقة"}</div>`:""});["invoiceDiscount","invoiceTaxRate"].forEach(id=>$("#"+id).addEventListener("input",updateCashierTotals));const clientSearch=$("#invoiceClientSearch");clientSearch.addEventListener("input",()=>{const q=clientSearch.value.trim().toLowerCase();Array.from($("#invoiceClient").options).forEach((o,i)=>{if(i===0){o.hidden=false;return}const c=db.clients.find(x=>x.id===o.value);o.hidden=!!q&&!((c?.name||"").toLowerCase().includes(q)||(c?.phone||"").toLowerCase().includes(q)||(c?.code||"").toLowerCase().includes(q))});});$("#invoiceClient").addEventListener("change",()=>{const c=db.clients.find(x=>x.id===$("#invoiceClient").value);$("#selectedClientInfo").textContent=c?`الكود: ${c.code||"—"} • النقاط: ${Number(c.points)||0}`:""});$("#invoiceForm").addEventListener("submit",submitInvoice);renderCashierCart()}
function addCashierService(id){const svc=db.services.find(s=>s.id===id&&s.active!==false);if(!svc)return;const found=cashierCart.find(x=>x.serviceId===id);if(found)found.quantity++;else cashierCart.push({serviceId:svc.id,name:textService(svc),price:Number(svc.price)||0,quantity:1,duration:Number(svc.duration)||30});const sel=$("#invoiceService");if(sel)sel.value="";const search=$("#serviceSearchCashier");if(search)search.value="";const results=$("#cashierSearchResults");if(results)results.innerHTML="";renderCashierCart()}
function removeCashierService(id){cashierCart=cashierCart.filter(x=>x.serviceId!==id);renderCashierCart()}
function changeCartPrice(id,value){const item=cashierCart.find(x=>x.serviceId===id);if(item){item.price=Math.max(0,Number(value)||0);updateCashierTotals()}}
function changeCartQty(id,value){const item=cashierCart.find(x=>x.serviceId===id);if(item){item.quantity=Math.max(1,Math.floor(Number(value)||1));renderCashierCart()}}
function clearCashierCart(){cashierCart=[];renderCashierCart()}
function cashierTotals(){const threshold=Math.max(1,Number(db.settings.redeemPoints)||50),value=Math.max(0,Number(db.settings.redeemRiyals)||10),used=Math.max(0,Math.floor(Number($("#invoicePointsUse")?.value)||0)),loyaltyDiscount=Math.floor(used/threshold)*value;const subtotal=cashierCart.reduce((a,x)=>a+x.price*x.quantity,0),discount=Math.min(subtotal,Math.max(0,Number($("#invoiceDiscount")?.value)||0)+loyaltyDiscount),taxable=Math.max(0,subtotal-discount),tax=taxable*Math.max(0,Number($("#invoiceTaxRate")?.value)||0)/100;return {subtotal,discount,loyaltyDiscount,tax,total:taxable+tax}}
function renderCashierCart(){const root=$("#cashierCartRows");if(!root)return;root.innerHTML=cashierCart.length?cashierCart.map(x=>`<div class="cart-row"><div><b>${esc(x.name)}</b><div class="tiny muted">${money(x.price)} لكل خدمة • ${Math.max(0,Number(db.services.find(s=>s.id===x.serviceId)?.loyaltyPoints)||0)} نقطة</div></div><input aria-label="سعر الخدمة" type="number" min="0" step=".01" value="${x.price}" onchange="changeCartPrice('${x.serviceId}',this.value)"><input aria-label="الكمية" type="number" min="1" step="1" value="${x.quantity}" onchange="changeCartQty('${x.serviceId}',this.value)"><button type="button" class="btn danger small" onclick="removeCashierService('${x.serviceId}')">حذف</button></div>`).join(""):`<div class="empty">ابحثي عن خدمة ثم أضيفيها إلى الفاتورة.</div>`;updateCashierTotals()}
function updateCashierTotals(){const out=$("#cashierSubtotal");if(!out)return;const x=cashierTotals();out.textContent=money(x.subtotal);$("#cashierDiscountView").textContent=money(x.discount);$("#cashierTaxView").textContent=money(x.tax);$("#cashierTotal").textContent=money(x.total)}
function submitInvoice(e){e.preventDefault();if(!cashierCart.length){toast("أضيفي خدمة واحدة على الأقل");return}const mode=$("#newCustomerFields").classList.contains("hidden")?"existing":"new";let client=null;if(mode==="new"){const name=$("#newClientName").value.trim(),phone=$("#newClientPhone").value.trim(),email=$("#newClientEmail").value.trim();if(!name||!phone){toast("أدخلي اسم العميلة ورقم جوالها");return}const duplicate=db.clients.find(c=>String(c.phone||"").replace(/\s/g,"")===phone.replace(/\s/g,""));if(duplicate){toast("رقم الجوال مسجل مسبقًا. اختاري البحث عن عميلة");setCashierCustomerMode("existing");$("#invoiceClientSearch").value=phone;$("#invoiceClient").value=duplicate.id;return}client={id:uid("cl"),code:"CL-"+db.counter++,name,phone,email,points:0,createdAt:new Date().toISOString()}}else{client=db.clients.find(c=>c.id===$("#invoiceClient").value)||null;if(!client){toast("اختاري العميلة المسجلة أو بدّلي إلى تسجيل عميلة جديدة");return}}const staffId=$("#invoiceStaff").value,payment=$("#invoicePayment").value,totals=cashierTotals(),pointsUse=Math.max(0,Math.floor(Number($("#invoicePointsUse").value)||0)),pointsAdd=Math.max(0,Math.floor(Number($("#invoicePointsAdd").value)||0));if(pointsUse&&(!Number.isInteger(pointsUse/(Math.max(1,Number(db.settings.redeemPoints)||50))))) {toast("يجب استبدال النقاط بمضاعفات الحد المحدد في إعدادات الولاء");return}if(pointsUse&&(!client||Number(client.points||0)<pointsUse)){toast("رصيد نقاط العميلة غير كافٍ");return}let booking=null;
if(mode==="new")db.clients.push(client);const items=cashierCart.map(x=>({...x,lineTotal:x.price*x.quantity}));const earnedPoints=items.reduce((sum,item)=>sum+Math.max(0,Math.floor(Number(db.services.find(s=>s.id===item.serviceId)?.loyaltyPoints)||0))*item.quantity,0);const invoice={id:uid("inv"),number:db.invoiceCounter++,clientId:client?.id||"",customerName:client?.name||"عميلة نقدية",customerPhone:client?.phone||"",staffId,items,serviceId:items[0]?.serviceId||"",serviceName:items.map(x=>`${x.name} ×${x.quantity}`).join("، "),subtotal:totals.subtotal,discount:totals.discount,taxRate:Number($("#invoiceTaxRate").value)||0,tax:totals.tax,total:totals.total,payment,pointsUsed:pointsUse,loyaltyDiscount:totals.loyaltyDiscount,pointsAdded:pointsAdd+earnedPoints,pointsEarned:earnedPoints,notes:$("#invoiceNotes").value.trim(),date:$("#invoiceDate").value,createdAt:new Date().toISOString(),bookingId:booking?.id||""};db.invoices.push(invoice);if(client){client.points=Math.max(0,Number(client.points||0)-pointsUse+pointsAdd+earnedPoints);client.updatedAt=new Date().toISOString()}for(const item of items){const svc=db.services.find(s=>s.id===item.serviceId);for(const mat of svc?.materials||[]){const stock=db.inventory.find(i=>i.id===mat.itemId);if(stock)stock.quantity=Math.max(0,Number(stock.quantity)-Number(mat.qty||0)*item.quantity)}}persist();cashierCart=[];renderOwner("cashier");toast("تم إصدار الفاتورة وحفظها")}
function invoiceTable(list=db.invoices){if(!list.length)return `<div class="empty">لا توجد فواتير مطابقة.</div>`;return `<div class="table-wrap"><table><thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>العميلة</th><th>الخدمات</th><th>الدفع</th><th>الإجمالي</th><th>الإجراءات</th></tr></thead><tbody>${list.slice().sort((a,b)=>(b.date||String(b.createdAt||"").slice(0,10)).localeCompare(a.date||String(a.createdAt||"").slice(0,10))).map(i=>`<tr><td>#${i.number}</td><td>${esc(i.date||String(i.createdAt||"").slice(0,10))}</td><td>${esc(i.customerName||clientName(i.clientId)||"—")}<br><small>${esc(i.customerPhone||"")}</small></td><td>${esc(i.serviceName||"—")}</td><td>${esc(i.payment||"cash")}</td><td>${money(i.total)}</td><td><div class="row"><button class="btn secondary small" onclick="editInvoice('${i.id}')">تعديل</button><button class="btn small" onclick="printInvoice('${i.id}')">طباعة</button><button class="btn danger small" onclick="deleteInvoice('${i.id}')">حذف</button></div></td></tr>`).join("")}</tbody></table></div>`}
function yearOptions(selected){return Array.from({length:27},(_,i)=>2024+i).map(y=>`<option value="${y}" ${Number(selected)===y?"selected":""}>${y}</option>`).join("")}
function monthOptions(selected){return Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${String(m).padStart(2,"0")}" ${String(selected).padStart(2,"0")===String(m).padStart(2,"0")?"selected":""}>${m}</option>`).join("")}
function invoicesPanel(){return `<div class="card"><div class="spread"><div><h2>سجل الفواتير</h2><p class="muted">ابحثي عن الفواتير بالتاريخ فقط، ويمكنك تحديد يوم واحد أو فترة.</p></div><button class="btn secondary" type="button" onclick="window.print()">طباعة النتائج</button></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>من تاريخ</label><input id="invoiceHistoryFrom" type="date" min="2024-01-01" max="2050-12-31"></div><div class="field"><label>إلى تاريخ</label><input id="invoiceHistoryTo" type="date" min="2024-01-01" max="2050-12-31"></div><div class="row full"><button class="btn" type="button" id="invoiceHistorySearchBtn">بحث عن الفواتير</button><button class="btn secondary" type="button" id="invoiceHistoryResetBtn">إظهار الكل</button></div><p class="muted tiny full" id="invoiceHistoryMessage" aria-live="polite">اختاري تاريخًا واحدًا للبحث عن يوم محدد، أو تاريخين للبحث عن فترة.</p></div></div><div class="stats" style="margin:14px 0"><div class="stat"><span>عدد النتائج</span><strong id="invoiceHistoryCount">${db.invoices.length}</strong></div><div class="stat"><span>إجمالي الفواتير</span><strong id="invoiceHistoryTotal">${money(db.invoices.reduce((a,i)=>a+Number(i.total||0),0))}</strong></div></div><div id="invoiceHistoryTable">${invoiceTable()}</div>`}
function setupInvoiceFilters(){const searchBtn=$("#invoiceHistorySearchBtn"),resetBtn=$("#invoiceHistoryResetBtn");if(searchBtn)searchBtn.addEventListener("click",filterInvoiceHistory);if(resetBtn)resetBtn.addEventListener("click",resetInvoiceHistory)}
function filterInvoiceHistory(){const root=$("#invoiceHistoryTable");if(!root)return;const from=$("#invoiceHistoryFrom").value,to=$("#invoiceHistoryTo").value,msg=$("#invoiceHistoryMessage");if(!from&&!to){msg.textContent="اختاري تاريخًا أولًا، أو اضغطي إظهار الكل لعرض جميع الفواتير.";toast("اختاري تاريخًا للبحث");return}if(from&&to&&from>to){msg.textContent="تاريخ البداية يجب أن يكون قبل تاريخ النهاية.";toast("تحققي من ترتيب التاريخين");return}const start=from||to,end=to||from;const list=db.invoices.filter(i=>{const date=String(i.date||i.createdAt||"").slice(0,10);return date>=start&&date<=end});root.innerHTML=invoiceTable(list);$("#invoiceHistoryCount").textContent=list.length;$("#invoiceHistoryTotal").textContent=money(list.reduce((a,i)=>a+Number(i.total||0),0));msg.textContent=list.length?`تم العثور على ${list.length} فاتورة في الفترة المحددة.`:"لا توجد فواتير في التاريخ المحدد."}
function resetInvoiceHistory(){const root=$("#invoiceHistoryTable");if(!root)return;$("#invoiceHistoryFrom").value="";$("#invoiceHistoryTo").value="";root.innerHTML=invoiceTable();$("#invoiceHistoryCount").textContent=db.invoices.length;$("#invoiceHistoryTotal").textContent=money(db.invoices.reduce((a,i)=>a+Number(i.total||0),0));$("#invoiceHistoryMessage").textContent="تم عرض جميع الفواتير."}
function editInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const items=(i.items||[{serviceId:i.serviceId,name:i.serviceName,price:Number(i.total)||0,quantity:1}]);const servicesText=items.map(x=>`${x.name}|${x.price}|${x.quantity}`).join("\n");const customer=prompt("اسم العميلة",i.customerName||clientName(i.clientId)||"");if(customer===null)return;const phone=prompt("رقم جوال العميلة",i.customerPhone||"");if(phone===null)return;const date=prompt("تاريخ الفاتورة YYYY-MM-DD",i.date||String(i.createdAt||"").slice(0,10));if(date===null)return;const svcText=prompt("الخدمات — كل سطر: اسم الخدمة|السعر|الكمية",servicesText);if(svcText===null)return;const payment=prompt("طريقة الدفع: cash / card / transfer / points / mixed",i.payment||"cash");if(payment===null)return;const discount=prompt("الخصم بالريال",String(i.discount||0));if(discount===null)return;const taxRate=prompt("نسبة الضريبة %",String(i.taxRate||0));if(taxRate===null)return;const pointsUsed=prompt("النقاط المستخدمة",String(i.pointsUsed||0));if(pointsUsed===null)return;const pointsAdded=prompt("النقاط المضافة",String(i.pointsAdded||0));if(pointsAdded===null)return;const notes=prompt("ملاحظات الفاتورة",i.notes||"");if(notes===null)return;const staffOptions=db.staff.map(s=>`${s.id}:${s.name}`).join("\n");const staffId=prompt("معرّف الموظفة (اتركيه فارغًا بدون موظفة):\n"+staffOptions,i.staffId||"");if(staffId===null)return;const parsed=svcText.split(/\n/).map(line=>{const a=line.split("|");return {name:(a[0]||"").trim(),price:Number(a[1]),quantity:Math.floor(Number(a[2])||1)}}).filter(x=>x.name&&Number.isFinite(x.price)&&x.price>=0&&x.quantity>0);if(!parsed.length||!date||!Number.isFinite(Number(discount))||Number(discount)<0||!Number.isFinite(Number(taxRate))||Number(taxRate)<0||!Number.isInteger(Number(pointsUsed))||Number(pointsUsed)<0||!Number.isInteger(Number(pointsAdded))||Number(pointsAdded)<0){toast("تحققي من بيانات الفاتورة");return}const subtotal=parsed.reduce((a,x)=>a+x.price*x.quantity,0),d=Math.min(subtotal,Number(discount)),tax=(subtotal-d)*Number(taxRate)/100;const previousClient=db.clients.find(x=>x.id===i.clientId);if(previousClient){previousClient.points=Math.max(0,Number(previousClient.points||0)+(Number(i.pointsUsed)||0)-(Number(i.pointsAdded)||0))}const matchedClient=db.clients.find(x=>String(x.phone||"").trim()===phone.trim());i.clientId=matchedClient?.id||"";i.customerName=customer.trim();i.customerPhone=phone.trim();i.date=date;i.items=parsed.map(x=>({...x,lineTotal:x.price*x.quantity}));i.serviceName=parsed.map(x=>`${x.name} ×${x.quantity}`).join("، ");i.subtotal=subtotal;i.discount=d;i.taxRate=Number(taxRate);i.tax=tax;i.total=subtotal-d+tax;i.payment=payment;i.pointsUsed=Number(pointsUsed);i.pointsAdded=Number(pointsAdded);i.notes=notes;i.staffId=staffId.trim();i.updatedAt=new Date().toISOString();const c=db.clients.find(x=>x.id===i.clientId);if(c){c.points=Math.max(0,Number(c.points||0)-i.pointsUsed+i.pointsAdded)}persist();renderOwner(ownerActiveTab==="invoices"?"invoices":"cashier");toast("تم تعديل جميع بيانات الفاتورة")}
function deleteInvoice(id){if(!confirm("هل تريدين حذف الفاتورة نهائيًا؟"))return;db.invoices=db.invoices.filter(i=>i.id!==id);persist();renderOwner(ownerActiveTab==="invoices"?"invoices":"cashier")}
function printInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const w=window.open("","_blank","width=700,height=700");if(!w){toast("اسمحي بالنوافذ المنبثقة للطباعة");return}w.document.write(`<html lang="${lang}" dir="${lang==="ar"?"rtl":"ltr"}"><meta charset="utf-8"><title>Invoice #${i.number}</title><style>body{font-family:Arial;padding:32px}h1{color:#7c405c}table{width:100%;border-collapse:collapse}td{padding:12px;border-bottom:1px solid #ddd}</style><h1>${esc(db.settings.salonName)}</h1><h2>فاتورة مبسطة / Invoice #${i.number}</h2><table><tr><td>العميلة / Client</td><td>${esc(i.customerName||clientName(i.clientId)||"—")} ${esc(i.customerPhone||"")}</td></tr><tr><td>الخدمة / Service</td><td>${esc(i.serviceName)}</td></tr><tr><td>التاريخ / Date</td><td>${esc(i.date||String(i.createdAt||"").slice(0,10))}</td></tr><tr><td>الدفع / Payment</td><td>${esc(i.payment)}</td></tr><tr><td>الإجمالي / Total</td><td>${money(i.total)}</td></tr></table><p>شكرًا لزيارتكم / Thank you</p><script>window.print()<\/script></html>`);w.document.close()}
function inventoryPanel(){return `<div class="card"><h3>${esc(t("inventoryTitle"))}</h3><form id="inventoryForm" class="form-grid"><div class="field"><label>${esc(t("itemName"))}</label><input name="name" required maxlength="100"></div><div class="field"><label>${esc(t("quantity"))}</label><input name="quantity" type="number" min="0" step=".01" required></div><div class="field"><label>${esc(t("minQuantity"))}</label><input name="minQuantity" type="number" min="0" step=".01" value="3" required></div><div class="field"><label>${esc(t("unitCost"))}</label><input name="unitCost" type="number" min="0" step=".01" value="0" required></div><button class="btn full">${esc(t("addItem"))}</button></form></div><div class="section-head"><h3>${esc(t("inventory"))}</h3></div>${db.inventory.length?`<div class="grid">${db.inventory.map(i=>`<div class="card"><div class="spread"><h3>${esc(i.name)}</h3><span class="badge ${Number(i.quantity)<=Number(i.minQuantity)?"red":"green"}">${Number(i.quantity)<=Number(i.minQuantity)?esc(t("lowStock")):"OK"}</span></div><p>${esc(t("quantity"))}: <b>${i.quantity}</b></p><div class="progress"><i style="width:${Math.min(100,Math.max(3,Number(i.quantity)/(Math.max(Number(i.minQuantity)*3,1))*100))}%"></i></div><p class="muted tiny">${esc(t("unitCost"))}: ${money(i.unitCost)}</p><div class="row"><button class="btn secondary small" onclick="adjustStock('${i.id}',1)">+1</button><button class="btn secondary small" onclick="adjustStock('${i.id}',-1)">−1</button><button class="btn danger small" onclick="deleteInventory('${i.id}')">${esc(t("delete"))}</button></div></div>`).join("")}</div>`:`<div class="empty">${esc(t("noData"))}</div>`}`}
function setupInventory(){const f=$("#inventoryForm");if(!f)return;f.addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(f);db.inventory.push({id:uid("itm"),name:String(fd.get("name")).trim(),quantity:Number(fd.get("quantity")),minQuantity:Number(fd.get("minQuantity")),unitCost:Number(fd.get("unitCost"))});persist();renderOwner("inventory");toast(t("saved"))})}
function adjustStock(id,delta){const i=db.inventory.find(x=>x.id===id);if(!i)return;i.quantity=Math.max(0,Number(i.quantity)+delta);persist();renderOwner("inventory")}
function deleteInventory(id){if(!confirm(t("confirmDelete")))return;db.inventory=db.inventory.filter(x=>x.id!==id);persist();renderOwner("inventory")}

function servicesPanel(){return `<div class="card"><h3>إعدادات استبدال نقاط الولاء</h3><div class="form-grid"><div class="field"><label>عدد النقاط المطلوبة للخصم</label><input id="redeemThreshold" type="number" min="1" step="1" value="${Number(db.settings.redeemPoints)||50}"></div><div class="field"><label>قيمة الخصم بالريال</label><input id="redeemValue" type="number" min="0.01" step="0.01" value="${Number(db.settings.redeemRiyals)||10}"></div><button class="btn full" type="button" onclick="saveLoyaltySettings()">حفظ إعدادات النقاط والخصم</button></div></div><div class="card" style="margin-top:14px"><h3>${esc(t("serviceTitle"))}</h3><form id="serviceForm" class="form-grid"><div class="field"><label>${esc(t("serviceName"))} (عربي)</label><input name="name" required maxlength="80"></div><div class="field"><label>${esc(t("serviceName"))} (English)</label><input name="nameEn" maxlength="80"></div><div class="field"><label>${esc(t("servicePrice"))}</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>${esc(t("serviceDuration"))}</label><input name="duration" type="number" min="5" step="5" value="30" required></div><div class="field"><label>نقاط الولاء المكتسبة عند شراء الخدمة</label><input name="loyaltyPoints" type="number" min="0" step="1" value="0" required></div><div class="field full"><label>رابط صورة الخدمة (https://) — اختياري</label><input name="imageUrl" type="url" placeholder="https://example.com/service.jpg"><small class="muted">الصورة تظهر للعميلة في صفحة الحجز ودليل الخدمات. استخدمي رابط صورة منشورة على الإنترنت.</small></div><button class="btn full">${esc(t("addService"))}</button></form></div><div class="section-head"><h3>${esc(t("services"))}</h3></div><div class="service-grid">${db.services.map(s=>`<article class="service"><div class="spread"><span class="badge">${s.active===false?"مخفية":"نشطة"}</span><button class="btn danger small" onclick="toggleService('${s.id}')">${s.active===false?"تفعيل":"إخفاء"}</button></div>${servicePicture(s)}<h3>${esc(textService(s))}</h3><p>${s.duration} ${esc(t("minutes"))} • نقاط الخدمة: ${Math.max(0,Number(s.loyaltyPoints)||0)}</p><div class="spread" style="margin-top:10px"><span class="price">${money(s.price)}</span><div class="row"><button class="btn secondary small" onclick="setServicePhoto('${s.id}')">📷 صورة الخدمة</button><button class="btn secondary small" onclick="editService('${s.id}')">${esc(t("edit"))}</button></div></div></article>`).join("")}</div>`}
function saveLoyaltySettings(){const pts=Number($("#redeemThreshold").value),sar=Number($("#redeemValue").value);if(!Number.isInteger(pts)||pts<1||!Number.isFinite(sar)||sar<=0){toast("تحققي من عدد النقاط وقيمة الخصم");return}db.settings.redeemPoints=pts;db.settings.redeemRiyals=sar;persist();toast("تم حفظ إعدادات الاستبدال") }

async function readAssistantImages(){
 const status=$('#assistantOcrStatus'),btn=$('#assistantOcrBtn');
 if(!assistantImageFiles.length){toast('اختاري صورة أولًا');return}
 btn.disabled=true;
 try{
  status.textContent='جارٍ تحميل قارئ الصور…';
  if(!window.Tesseract){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('تعذر تحميل مكتبة قراءة الصور'));document.head.appendChild(sc)})}
  const worker=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m.status==='recognizing text')status.textContent=`قراءة الصورة: ${Math.round((m.progress||0)*100)}%`}});
  try{
   const texts=[];
   for(let i=0;i<assistantImageFiles.length;i++){
    status.textContent=`قراءة الصورة ${i+1} من ${assistantImageFiles.length}…`;
    const result=await worker.recognize(assistantImageFiles[i]);texts.push(result.data.text.trim());

  }finally{await worker.terminate()}
 }catch(e){console.error(e);status.textContent='تعذرت قراءة الصور. تأكدي من الاتصال أو اكتبي البيانات يدويًا.';toast('تعذرت قراءة الصور')}
 finally{btn.disabled=false}
}
function normalizeAssistant(v){return String(v||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064b-\u065f]/g,'').trim()}
function parseAssistantInvoices(){

  const parts=line.split(/[،,|؛;]/).map(x=>x.trim()).filter(Boolean), phone=(line.match(/(?:\+?966|0)5\d{8}/)||[])[0]||'';
  const services=activeServices().filter(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name))||(s.nameEn&&normalizeAssistant(line).includes(normalizeAssistant(s.nameEn))));
  const employee=activeStaff().find(s=>normalizeAssistant(line).includes(normalizeAssistant(s.name)));

<script>

 return `<div class="card" style="margin:14px 0"><h2>🎨 تخصيص التصميم لكل الواجهات</h2><p class="muted">اختاري أي لون بنفسك. التغييرات لا تُنشر إلا بعد الضغط على حفظ ونشر.</p><form id="salonThemeForm" class="form-grid"><div class="full"><h3>الألوان</h3><div class="theme-colors">${fields.map(([k,label])=>`<label>${label}<input type="color" name="color_${k}" value="${esc(salonTheme.colors[k])}"></label>`).join('')}</div></div><div class="field full"><label>استدارة زوايا البطاقات</label><input name="radius" type="range" min="6" max="32" value="${Number(salonTheme.radius)||18}"></div><div class="field full"><label>رابط الشعار (HTTPS)</label><input name="logo" type="url" placeholder="https://..." value="${esc(salonTheme.logo||'')}"><small>ارفعي الشعار إلى رابط صورة آمن ثم ضعي رابطه هنا؛ لا يتم رفع الصور إلى Firebase Storage من هذه الصفحة.</small></div><div class="field"><label>عبارة الترحيب بالعربية</label><input name="welcomeAr" maxlength="160" value="${esc(salonTheme.welcomeAr||'')}"></div><div class="field"><label>Welcome text in English</label><input name="welcomeEn" maxlength="160" value="${esc(salonTheme.welcomeEn||'')}"></div><div class="field"><label>وصف الصالون بالعربية</label><input name="subtitleAr" maxlength="120" value="${esc(salonTheme.subtitleAr||'')}"></div><div class="field"><label>Salon subtitle in English</label><input name="subtitleEn" maxlength="120" value="${esc(salonTheme.subtitleEn||'')}"></div><div class="field"><label>إعلان أو تنبيه بالعربية</label><textarea name="announcementAr" maxlength="450" rows="3">${esc(salonTheme.announcementAr||'')}</textarea></div><div class="field"><label>Announcement in English</label><textarea name="announcementEn" maxlength="450" rows="3">${esc(salonTheme.announcementEn||'')}</textarea></div><div class="full"><h3>إظهار العبارات والإعلانات في</h3><div class="row">${[['client','العميلات'],['employee','الموظفات'],['owner','المالكة']].map(([k,v])=>`<label class="checkline"><input type="checkbox" name="audience_${k}" ${salonTheme.showFor[k]?'checked':''}>${v}</label>`).join('')}</div></div><div class="full theme-preview" id="salonThemePreview"><strong>معاينة التصميم</strong><p>هنا يظهر شكل الألوان والعبارات قبل النشر</p><button type="button" class="btn">زر تجريبي</button></div><div class="row full"><button type="button" class="btn secondary" id="themePreviewButton">معاينة</button><button type="button" class="btn outline" id="themeResetButton">استعادة التصميم الافتراضي</button><button type="submit" class="btn success">حفظ ونشر لجميع الأجهزة</button></div><div id="themeSaveStatus" class="full tiny" aria-live="polite"></div></form></div>`
}

 form.onsubmit=async e=>{e.preventDefault();const status=host.querySelector('#themeSaveStatus');const data=getThemeFormData(form);if(data.logo&&!/^https:\/\//.test(data.logo)){status.textContent='رابط الشعار يجب أن يبدأ بـ https://';return}status.textContent='جارٍ النشر…';try{await salonThemeRef.set(data);applySalonTheme(data);status.textContent='تم النشر في Firebase. ستظهر التغييرات على الأجهزة التي تسمح لها قواعد Firestore بقراءة إعدادات التصميم.';toast('تم نشر التصميم')}catch(err){status.textContent='فشل النشر: '+err.message;toast('تحققي من قواعد Firestore')}};
}

 const date=safeStr(data.get('date')),time=safeStr(data.get('time')),location=safeStr(data.get('location')||'salon');
 const address=safeStr(data.get('address')).trim().slice(0,200),notes=safeStr(data.get('notes')).trim().slice(0,300);
 if(!services.length||services.length>10||!staff||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<today()||!/^\d{2}:\d{2}$/.test(time)){toast('اختاري الخدمات والموظفة والتاريخ والوقت الصحيح');return}
 if(location==='home'&&(!portalCatalog.settings?.homeServiceEnabled||!address)){toast('أدخلي عنوان الخدمة المنزلية');return}
 const duration=services.reduce((n,x)=>n+(Number(x.duration)||30),0);
 if(timeToMin(time)+duration>1440){toast('وقت الحجز يتجاوز نهاية اليوم');return}
 const price=services.reduce((n,x)=>n+Math.max(0,Number(x.price)||0),0);
 const record={clientUid:auth.currentUser.uid,clientName:safeStr(portalUser.name).slice(0,100),clientPhone:safeStr(portalUser.phone).slice(0,20),staffUid:safeStr(staff.authUid||staff.id),staffName:safeStr(staff.name),serviceIds:services.map(x=>safeStr(x.id)),serviceName:services.map(x=>safeStr(x.name)).join('، ').slice(0,500),price,duration,date,time,location,address,notes,redeemRequested:data.get('redeem')==='on',status:'pending',depositStatus:'unpaid',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
 if(button)button.disabled=true;
 try{
  const ref=await bookingCollection.add(record);
  try{await loadPortalBookings()}catch(err){console.warn('Booking saved, list refresh failed',err)}
  salonClientPage='bookings';renderPortalClient();
  const url=bookingWhatsApp(record,ref.id);
  const notice=document.createElement('div');notice.className='card';notice.style.margin='12px 0';notice.innerHTML='<h3>✅ تم حفظ طلب الحجز لدى الإدارة</h3><p>رقم الطلب: '+esc(ref.id)+'</p><p>الحالة: بانتظار دفع العربون وتأكيد الصالون. يمكنك إرسال التفاصيل أيضًا عبر واتساب.</p>';
  const link=document.createElement('a');link.className='btn success';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='إرسال تفاصيل الحجز إلى واتساب الإدارة';notice.append(link);
  const target=document.querySelector('#salonClientPagePanel')||document.querySelector('#app');target.prepend(notice);
  toast('تم حفظ الحجز في Firebase بنجاح');
 }catch(err){console.error('Booking Firestore error',err);toast('لم يُحفظ الحجز: '+(err.code==='permission-denied'?'قواعد Firebase ترفض الطلب. تأكدي من نشر قواعد portalBookings.':err.message));}
 finally{if(button&&button.isConnected)button.disabled=false}
};
function ownerBookingCard(b){
 const id=esc(b.id),pending=b.status==='pending',closed=['cancelled','completed'].includes(b.status);
 return `<div class="card" style="margin:10px 0"><div class="spread"><b>${esc(b.clientName||'عميلة')} — ${esc(b.date)} ${esc(b.time)}</b>${statusBadge(b.status||'pending')}</div><p>${esc(b.serviceName||'')} — ${money(b.price)} — ${esc(b.staffName||'')}</p><p>الجوال: ${esc(b.clientPhone||'—')} · المكان: ${b.location==='home'?'منزل':'الصالون'} · العربون: ${b.depositStatus==='paid'?'مدفوع':'غير مدفوع'}</p><p class="muted tiny">رقم الطلب: ${id}${b.notes?' · ملاحظات: '+esc(b.notes):''}</p><div class="row">${!closed?`<button class="btn success small" onclick="ownerConfirmSavedBooking('${id}')">${pending?'تأكيد بعد العربون':'تحديث تأكيد العربون'}</button><button class="btn secondary small" onclick="ownerEditSavedBooking('${id}')">تعديل الحجز</button><button class="btn danger small" onclick="ownerCancelSavedBooking('${id}')">إلغاء</button>`:''}</div></div>`;
}
showPortalBookingsOwner=async function(){
 const host=document.querySelector('#portalBookingsOwner');if(!host)return;
 host.innerHTML='<p class="muted">جارٍ تحميل طلبات العميلات من Firebase…</p>';
 try{const snap=await bookingCollection.get();const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>safeStr(b.createdAt?.seconds||'').localeCompare(safeStr(a.createdAt?.seconds||'')));
  host.innerHTML=rows.length?rows.map(ownerBookingCard).join(''):'<div class="empty">لا توجد طلبات حجز في Firebase حتى الآن.</div>';
 }catch(err){host.textContent='تعذر تحميل الحجوزات: '+err.message}
};
window.ownerConfirmSavedBooking=async id=>{
 if(!confirm('هل استلمتِ العربون وتريدين تأكيد الحجز؟'))return;
 try{await bookingCollection.doc(id).update({status:'confirmed',depositStatus:'paid',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await showPortalBookingsOwner();toast('تم تأكيد الحجز والعربون')}
 catch(err){toast('تعذر التأكيد: '+err.message)}
};
window.ownerCancelSavedBooking=async id=>{
 if(!confirm('هل تريدين إلغاء طلب الحجز؟'))return;
 try{await bookingCollection.doc(id).update({status:'cancelled',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await showPortalBookingsOwner();toast('تم إلغاء الطلب')}
 catch(err){toast('تعذر الإلغاء: '+err.message)}
};
window.ownerEditSavedBooking=async id=>{
 try{
  const ref=bookingCollection.doc(id),snap=await ref.get();if(!snap.exists){toast('الحجز غير موجود');return}
  const b=snap.data();const serviceName=prompt('الخدمة المطلوبة (اكتبي اسم الخدمة بعد التعديل)',b.serviceName||'');if(serviceName===null)return;
  const staffName=prompt('اسم الموظفة',b.staffName||'');if(staffName===null)return;
  const date=prompt('التاريخ YYYY-MM-DD',b.date||'');if(date===null)return;
  const time=prompt('الوقت HH:MM',b.time||'');if(time===null)return;
  if(!serviceName.trim()||!staffName.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^\d{2}:\d{2}$/.test(time)){toast('راجعي الخدمة والموظفة والتاريخ والوقت');return}
  await ref.update({serviceName:serviceName.trim().slice(0,500),staffName:staffName.trim().slice(0,100),date,time,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await showPortalBookingsOwner();toast('تم تعديل الحجز');
 }catch(err){toast('تعذر تعديل الحجز: '+err.message)}
};
})();
</script>

<style id="owner-layout-fixes">

.owner-sidebar{height:100dvh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#9b718a #242435}
.owner-side-bottom{position:relative;flex-shrink:0}
.owner-content{min-width:0;overflow-wrap:anywhere}
.owner-content>section,.owner-content>.card{margin-block:14px}
.owner-content .owner-original-tools{display:none!important}
.owner-content .owner-settings-row{display:none!important}
.owner-menu button{flex-shrink:0}
.owner-bookings-filter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.owner-bookings-filter button{border:1px solid #e7d7e0;background:white;border-radius:12px;padding:9px 14px}
.owner-bookings-filter button.selected{background:var(--owner-accent);color:#fff}
.owner-settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.owner-settings-grid .card{cursor:pointer;text-align:right}
.owner-settings-grid .card:hover{border-color:var(--owner-accent)}
.owner-menu-title{padding:14px 12px 3px;font-size:11px;color:#c5b5ca}
@media(max-width:760px){.owner-shell{grid-template-columns:74px minmax(0,1fr)}.owner-brand div,.owner-menu button span:last-child,.owner-side-bottom{display:none}.owner-menu button{justify-content:center;padding:12px 4px}.owner-menu-icon{font-size:21px}.owner-content{padding:12px!important}}
</style>
<script>
/* Consolidated owner navigation. Keeps the existing Firestore collections and data. */
(function(){
'use strict';
const extra=[['leases','الإيجارات والعقود','▤'],['deposits','العربونات','◈'],['waitlist','قائمة الانتظار','◷'],['loyaltyExt','النقاط والولاء','✦'],['financeExt','الملخص المالي','▥'],['staffRequests','طلبات الموظفات','♙'],['audit','سجل النشاط','▧'],['marketing','رسائل العميلات','✉'],['settingsHub','الإعدادات','⚙']];
// The existing owner layout reads this menu; extend it instead of creating bottom-page navigation.
for(const item of extra){if(!OWNER_MENU.some(x=>x[0]===item[0]))OWNER_MENU.push(item)}
const prior=renderOwner;
let bookingFilter='all';
function settingsContent(section){
 if(!section)return `<div class="section-head"><h2>⚙ الإعدادات</h2></div><div class="owner-settings-grid">${[['design','🎨 تخصيص التصميم','الشعار والخطوط والعبارات والألوان'],['theme','🖌 تعديل الثيم','اللون الوردي وألوان الواجهة'],['backup','💾 النسخ الاحتياطي','تنزيل نسخة أو استعادتها بعد التأكيد'],['system','⚙ إعدادات النظام','اسم الصالون، واتساب ومكان الحجز']].map(([id,n,d])=>`<button type="button" class="card" onclick="openOwnerSettingsSection('${id}')"><h3>${n}</h3><p>${d}</p></button>`).join('')}</div>`;
 if(section==='backup')return `<div class="section-head"><h2>النسخ الاحتياطي</h2></div>${backupPanel()}`;
 if(section==='system')return `<div class="card"><h2>إعدادات النظام</h2><p>إعدادات الصالون والحجوزات والصلاحيات الأساسية.</p><button class="btn" onclick="ownerSettings()">فتح إعدادات النظام</button></div>`;
 return `<div class="card"><h2>${section==='theme'?'تعديل الثيم':'تخصيص التصميم'}</h2><p>يمكنك تعديل الألوان والشعار والعبارات مع معاينة التصميم وحفظه.</p><button class="btn" onclick="openSalonThemeSettings()">فتح محرر التصميم والثيم</button></div>`;
}
window.openOwnerSettingsSection=section=>{if(!hasOwner())return;ownerActiveTab='settingsHub';renderOwner('settingsHub');const c=document.querySelector('.owner-content');if(c)c.innerHTML=settingsContent(section)};
function moveLooseContent(){
 const app=document.querySelector('#app'),content=app?.querySelector('.owner-content');if(!content)return;
 // Prior patches appended forms and booking lists after the owner shell, causing a blank screen and misplaced panels.
 for(const node of [...app.children]){if(node!==app.querySelector('.owner-shell'))content.appendChild(node)}
 // Remove redundant footer navigation; all destinations are now in the independently scrollable sidebar.
 content.querySelectorAll('.card').forEach(el=>{if(el.querySelector('h3')?.textContent.trim()==='وحدات الإدارة الإضافية')el.remove()});
 content.querySelectorAll('button').forEach(b=>{if(b.textContent.trim()==='🎨 تخصيص التصميم'&&b.parentElement===content)b.remove()});
}
function relocateServices(){
 const content=document.querySelector('.owner-content');if(!content)return;
 const cards=[...content.querySelectorAll('.card')];
 for(const card of cards){const title=card.querySelector('h3')?.textContent.trim()||'';
  if(title==='خيارات مكان الحجز')card.remove(); // available under System Settings
  if(title==='إعدادات استبدال نقاط الولاء')card.remove(); // available under Loyalty
 }
 const grid=content.querySelector('.service-grid');if(!grid)return;
 for(const service of db.services){
  const button=[...grid.querySelectorAll('button')].find(b=>b.getAttribute('onclick')===`editService('${service.id}')`);
  if(!button||button.parentElement.querySelector('[data-delete-service]'))continue;
  const del=document.createElement('button');del.className='btn danger small';del.type='button';del.dataset.deleteService=service.id;del.textContent='حذف';del.onclick=()=>window.ownerDeleteService(service.id);button.parentElement.appendChild(del);
 }
}
window.ownerDeleteService=async id=>{
 if(!hasOwner())return;
 const service=db.services.find(s=>String(s.id)===String(id));if(!service)return;
 if(!confirm(`حذف خدمة «${service.name}» نهائيًا من قائمة الخدمات؟\nستبقى تفاصيل الحجوزات والفواتير السابقة كما هي.`))return;
 const backup=db.services.slice();db.services=db.services.filter(s=>String(s.id)!==String(id));
 try{await persist();const published=await publishPortalCatalog();if(published===false)throw new Error('تعذر تحديث قائمة الخدمات المنشورة');renderOwner('services');toast('حُذفت الخدمة من الإدارة وبوابة العميلات')}
 catch(err){db.services=backup;await persist();renderOwner('services');toast('تعذر حذف الخدمة ونشرها: '+err.message)}
};
function addLoyaltySettings(){
 const content=document.querySelector('.owner-content');if(!content)return;
 const panel=document.createElement('section');panel.className='card';panel.innerHTML=`<h3>إعدادات استبدال نقاط الولاء</h3><div class="form-grid"><div class="field"><label>عدد النقاط المطلوبة للخصم</label><input id="redeemThreshold" type="number" min="1" step="1" value="${Number(db.settings.redeemPoints)||50}"></div><div class="field"><label>قيمة الخصم بالريال</label><input id="redeemValue" type="number" min="0.01" step="0.01" value="${Number(db.settings.redeemRiyals)||10}"></div><button class="btn full" type="button" onclick="saveLoyaltySettings()">حفظ إعدادات النقاط والخصم</button></div>`;
 content.prepend(panel);
}
function putBookingsFirst(){
 const content=document.querySelector('.owner-content'),panel=document.querySelector('#portalBookingsOwner');if(!content||!panel)return;
 const section=panel.closest('section');if(!section)return;
 section.classList.add('owner-portal-bookings');
 content.prepend(section);
 const heading=section.querySelector('.section-head h3');if(heading)heading.textContent='طلبات الحجز من العميلات — Firebase';
 const filters=document.createElement('div');filters.className='owner-bookings-filter';filters.innerHTML=[['all','كل الطلبات'],['pending','بانتظار العربون'],['confirmed','المؤكدة'],['cancelled','الملغاة']].map(([v,l])=>`<button type="button" data-booking-filter="${v}" class="${bookingFilter===v?'selected':''}">${l}</button>`).join('');
 section.insertBefore(filters,panel);
 filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{bookingFilter=b.dataset.bookingFilter;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));window.filterOwnerPortalBookings()});
}
window.filterOwnerPortalBookings=()=>{const panel=document.querySelector('#portalBookingsOwner');if(!panel)return;panel.querySelectorAll('[data-booking-status]').forEach(el=>el.classList.toggle('hidden',bookingFilter!=='all'&&el.dataset.bookingStatus!==bookingFilter))};
renderOwner=function(tab=ownerActiveTab){
 if(!hasOwner()){prior(tab);return}
 if(tab==='settingsHub'){
  ownerActiveTab=tab;document.querySelector('#app').innerHTML=ownerLayout(tab,settingsContent());changeOwnerAccent(ownerThemeColor());return;
 }
 prior(tab);
 if(!hasOwner())return;
 const app=document.querySelector('#app');
 // Extra modules originally replaced the owner shell. Re-house them without recreating their form handlers.
 if(!app.querySelector('.owner-shell')){
  const nodes=[...app.childNodes];app.innerHTML=ownerLayout(tab,'');const content=app.querySelector('.owner-content');nodes.forEach(n=>content.appendChild(n));
 }
 moveLooseContent();
 if(tab==='appointments')putBookingsFirst();
 if(tab==='services')relocateServices();
 if(tab==='loyaltyExt')addLoyaltySettings();
 const content=app.querySelector('.owner-content');
 if(tab==='dashboard')content?.querySelector('.owner-original-tools')?.remove();
 if(tab==='backup'){// backups now live in settings, preserve old deep links
  ownerActiveTab='settingsHub';app.innerHTML=ownerLayout('settingsHub',settingsContent('backup'));
 }
};
const oldShow=showPortalBookingsOwner;
showPortalBookingsOwner=async function(){
 await oldShow();
 const host=document.querySelector('#portalBookingsOwner');if(!host)return;
 host.querySelectorAll(':scope > .card').forEach(card=>{
  const label=card.querySelector('.badge')?.textContent.trim()||'';
  const status=label.includes('مؤكد')||label.toLowerCase().includes('confirmed')?'confirmed':label.includes('ملغ')||label.toLowerCase().includes('cancel')?'cancelled':'pending';
  card.dataset.bookingStatus=status;
 });
 window.filterOwnerPortalBookings();
};
})();

/* Daily workspace: historical records are never deleted. */
(function(){
 const bookingDate=b=>String(b.date||'').slice(0,10);
 const isOpen=b=>!['completed','cancelled','noShow','no-show'].includes(b.status);
 const invoiceDate=i=>String(i.date||i.createdAt||'').slice(0,10);
 let bookingView='active', historyDate=today(), portalCache=[];
 const legacyRender=renderOwner;
 const legacyChange=changeBooking;
 function ownerDailySummary(){
  const d=today(), bills=db.invoices.filter(i=>invoiceDate(i)===d), amount=bills.reduce((n,i)=>n+Number(i.total||0),0);
  const local=db.bookings.filter(b=>bookingDate(b)===d&&isOpen(b));
  const kpis=document.querySelectorAll('.owner-kpi');
  if(kpis.length>=3){kpis[0].querySelector('strong').textContent=String(local.length+portalCache.filter(b=>bookingDate(b)===d&&isOpen(b)).length);kpis[1].querySelector('strong').textContent=money(amount);kpis[1].querySelector('small').textContent='مبيعات اليوم فقط';}
  const recent=document.querySelector('.owner-mini-list');if(recent&&recent.closest('.owner-panel')?.textContent.includes('أحدث الفواتير'))recent.innerHTML=bills.slice(-5).reverse().map(i=>`<div><span>${esc(i.customerName||'عميلة')}</span><b>${money(i.total)}</b></div>`).join('')||'<p>لا توجد فواتير اليوم</p>';
 }
 function statusName(s){return ({pending:'بانتظار التأكيد',confirmed:'مؤكد',arrived:'وصلت العميلة',inProgress:'جارٍ تنفيذ الخدمة',completed:'تم تنفيذ الخدمة',cancelled:'ملغي',noShow:'لم تحضر'})[s]||s||'بانتظار التأكيد'}
 function relevant(b){const d=bookingDate(b);if(bookingView==='history')return d===historyDate;if(bookingView==='all')return true;return isOpen(b) || (d===today()&&b.status==='completed');}
 function actionButtons(b,portal){if(!isOpen(b))return '';
  const fn=portal?'dailyPortalStatus':'dailyLocalStatus',id=JSON.stringify(String(b.id));
  return `<div class="row" style="margin-top:9px">${b.status==='pending'?`<button class="btn secondary small" onclick='${fn}(${id},"confirmed")'>تأكيد الحجز</button>`:''}${['pending','confirmed'].includes(b.status)?`<button class="btn secondary small" onclick='${fn}(${id},"arrived")'>وصلت العميلة</button>`:''}${b.status==='arrived'?`<button class="btn secondary small" onclick='${fn}(${id},"inProgress")'>بدء الخدمة</button>`:''}${['arrived','inProgress'].includes(b.status)?`<button class="btn success small" onclick='${fn}(${id},"completed")'>تم تنفيذ الخدمة</button>`:''}<button class="btn danger small" onclick='${fn}(${id},"noShow")'>لم تحضر</button></div>`;
 }
 function renderBookingRows(){const target=document.querySelector('#dailyBookingRows');if(!target)return;
  const local=db.bookings.filter(relevant).map(b=>({b,portal:false})),remote=portalCache.filter(relevant).map(b=>({b,portal:true}));
  const rows=[...local,...remote].sort((x,y)=>(x.b.date+x.b.time).localeCompare(y.b.date+y.b.time));
  target.innerHTML=rows.map(({b,portal})=>`<div class="card" style="margin:10px 0"><div class="spread"><strong>${esc(b.customerName||b.clientName||clientName(b.clientId)||'عميلة')} — ${esc(b.date||'')} ${esc(b.time||'')}</strong><span class="badge">${esc(statusName(b.status))}</span></div><p>${esc(b.serviceName||serviceName(b.serviceId))} · ${esc(b.staffName||staffName(b.staffId))} · ${portal?'حجز بوابة العميلات':'حجز الإدارة'}</p>${actionButtons(b,portal)}</div>`).join('')||'<div class="empty">لا توجد حجوزات مطابقة</div>';
 }
 async function loadDailyBookings(){const host=document.querySelector('#dailyBookingRows');if(!host)return;try{const snap=await firestore.collection('portalBookings').get();portalCache=snap.docs.map(d=>({id:d.id,...d.data()}));renderBookingRows();}catch(e){renderBookingRows();const note=document.querySelector('#dailyBookingNotice');if(note)note.textContent='تعذر تحميل حجوزات بوابة العميلات: '+e.message;}}
 window.dailyBookingView=(mode)=>{bookingView=mode;document.querySelectorAll('[data-daily-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.dailyMode===mode));const date=document.querySelector('#dailyHistoryDate');if(date)date.hidden=mode!=='history';renderBookingRows()};
 window.dailyHistoryDate=v=>{historyDate=v;renderBookingRows()};
 window.dailyLocalStatus=(id,status)=>{const b=db.bookings.find(x=>String(x.id)===String(id));if(!b||!hasOwner())return;if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز إلى: '+statusName(status)+'؟'))return;legacyChange(id,status);renderBookingRows()};
 window.dailyPortalStatus=async(id,status)=>{if(!hasOwner())return;if(['completed','noShow'].includes(status)&&!confirm('تأكيد تغيير حالة الحجز إلى: '+statusName(status)+'؟'))return;try{await firestore.collection('portalBookings').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),...(status==='completed'?{completedAt:firebase.firestore.FieldValue.serverTimestamp()}:{})});await loadDailyBookings();toast('تم حفظ حالة الحجز')}catch(e){toast('تعذر حفظ الحالة: '+e.message)}};
 function dailyAppointments(){return `<div class="card"><h2>الحجوزات والمواعيد</h2><p class="muted">تظهر حجوزات اليوم والقادمة والمعلقة حتى تؤكد الموظفة إتمام الخدمة. لا تُحذف السجلات عند نهاية اليوم.</p><div class="row" style="margin:12px 0;flex-wrap:wrap"><button class="btn secondary small" data-daily-mode="active" onclick="dailyBookingView('active')">الحجوزات النشطة والقادمة</button><button class="btn secondary small" data-daily-mode="history" onclick="dailyBookingView('history')">البحث بالتاريخ</button><button class="btn secondary small" data-daily-mode="all" onclick="dailyBookingView('all')">كل السجلات</button><input id="dailyHistoryDate" type="date" value="${historyDate}" hidden onchange="dailyHistoryDate(this.value)"><button class="btn secondary small" onclick="ownerTab('appointments')">تحديث</button></div><div id="dailyBookingNotice" class="muted"></div><div id="dailyBookingRows"></div></div>`}
 function dailyInvoices(){const d=today(),list=db.invoices.filter(i=>invoiceDate(i)===d),total=list.reduce((n,i)=>n+Number(i.total||0),0);return `<div class="card"><h2>فواتير اليوم</h2><p class="muted">كل يوم يبدأ عرض جديد تلقائيًا، والفواتير السابقة محفوظة ويمكن الرجوع إليها بالتاريخ.</p><div class="stats"><div class="stat"><span>عدد فواتير اليوم</span><strong>${list.length}</strong></div><div class="stat"><span>مبيعات اليوم</span><strong>${money(total)}</strong></div></div><div class="row" style="margin:12px 0;flex-wrap:wrap"><label>من <input type="date" id="dailyInvoiceFrom" value="${d}"></label><label>إلى <input type="date" id="dailyInvoiceTo" value="${d}"></label><button class="btn secondary small" onclick="dailyInvoiceSearch()">بحث بالتاريخ</button><button class="btn secondary small" onclick="dailyInvoiceToday()">اليوم</button></div><div id="dailyInvoiceCount" class="muted">${list.length} فاتورة</div><div id="dailyInvoiceTable">${invoiceTable(list)}</div></div>`}
 window.dailyInvoiceSearch=()=>{const a=document.querySelector('#dailyInvoiceFrom')?.value||'',b=document.querySelector('#dailyInvoiceTo')?.value||'';if(a&&b&&a>b){toast('تاريخ البداية بعد النهاية');return}const list=db.invoices.filter(i=>(!a||invoiceDate(i)>=a)&&(!b||invoiceDate(i)<=b));document.querySelector('#dailyInvoiceTable').innerHTML=invoiceTable(list);document.querySelector('#dailyInvoiceCount').textContent=list.length+' فاتورة'};
 window.dailyInvoiceToday=()=>{document.querySelector('#dailyInvoiceFrom').value=today();document.querySelector('#dailyInvoiceTo').value=today();window.dailyInvoiceSearch()};
 renderOwner=function(tab=ownerActiveTab){
  legacyRender(tab);
  if(!hasOwner())return;
  const content=document.querySelector('.owner-content');if(!content)return;
  if(tab==='appointments'){content.innerHTML=dailyAppointments();bookingView='active';loadDailyBookings();}
  if(tab==='invoices')content.innerHTML=dailyInvoices();
  if(tab==='dashboard'){ownerDailySummary();firestore.collection('portalBookings').get().then(s=>{portalCache=s.docs.map(d=>({id:d.id,...d.data()}));if(ownerActiveTab==='dashboard')ownerDailySummary()}).catch(()=>{});}
 };
})();
</script>

<!-- Final navigation fix: keep extra modules inside the dark owner sidebar only. -->
<style id="owner-final-navigation-style">
.owner-sidebar{position:sticky!important;top:0!important;height:100dvh!important;max-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain}
.owner-menu{overflow:visible!important;flex:0 0 auto}
.owner-menu button{min-height:42px}
@media(max-width:700px){.owner-shell{display:grid!important;grid-template-columns:76px minmax(0,1fr)!important}.owner-sidebar{width:76px!important;position:sticky!important;top:0!important;height:100dvh!important;max-height:100dvh!important}.owner-menu{display:flex!important;flex-direction:column!important;overflow:visible!important;white-space:normal!important}.owner-menu button{width:100%!important;min-width:0!important}.owner-menu button span:not(.owner-menu-icon){display:none!important}.owner-main{min-width:0!important}}
</style>
<script>
(function(){
 'use strict';
 // Older extensions append their navigation below #app. Relocate only genuine panels,
 // and discard the duplicate strip (without removing any Firebase-backed records).
 function tidyOwnerNavigation(){
  if(typeof hasOwner!=='function'||!hasOwner())return;
  const app=document.getElementById('app');if(!app)return;
  const shell=app.querySelector(':scope > .owner-shell');
  if(!shell)return;
  const content=shell.querySelector('.owner-content');if(!content)return;
  for(const child of [...app.children]){
   if(child===shell)continue;
   const heading=child.querySelector('h3,h2');
   if(heading&&heading.textContent.trim()==='وحدات الإدارة الإضافية'){child.remove();continue}
   if(child.tagName==='BUTTON'&&child.textContent.includes('تخصيص التصميم')){child.remove();continue}
   content.appendChild(child);
  }
  // Remove obsolete navigation wherever a previous patch placed it.
  for(const el of [...content.querySelectorAll('.card')]){
   const heading=el.querySelector(':scope > h3,:scope > h2');
   if(heading?.textContent.trim()==='وحدات الإدارة الإضافية')el.remove();
  }
  for(const el of [...content.querySelectorAll('button')]){
   if(el.textContent.trim()==='🎨 تخصيص التصميم' && el.parentElement===content)el.remove();
  }
 }
 const before=window.renderOwner;
 window.renderOwner=function(tab){
  const result=before.apply(this,arguments);
  tidyOwnerNavigation();
  return result;
 };
 const app=document.getElementById('app');
 if(app){
  let active=false;
  new MutationObserver(()=>{
   if(active)return;
   active=true;
   try{tidyOwnerNavigation()}finally{active=false}
  }).observe(app,{childList:true,subtree:false});
 }
 tidyOwnerNavigation();
})();
</script>
